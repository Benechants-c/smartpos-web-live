<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c35">
<title>PROMAX SmartPOS | Back Office</title>
<style>
:root{--navy:#101c35;--navy2:#172846;--green:#16a34a;--blue:#2563eb;--bg:#f3f6fb;--line:#e2e8f0;--muted:#64748b;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font:14px Inter,system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{height:64px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20;box-shadow:0 3px 14px #0f172a22}
.brand{font-size:19px;font-weight:900;letter-spacing:.3px}.brand small{display:block;font-size:10px;color:#a9b8d0;font-weight:500;letter-spacing:1.2px}
.headright{display:flex;align-items:center;gap:10px}.status{font-size:11px;background:#14532d;color:#bbf7d0;padding:7px 10px;border-radius:20px;font-weight:800}
.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:245px;background:var(--navy);color:#dbeafe;padding:14px 10px;flex-shrink:0}
.navtitle{font-size:10px;color:#8295b5;font-weight:800;letter-spacing:1.4px;padding:14px 12px 6px}
.nav{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;display:flex;gap:11px;align-items:center;font-weight:650}
.nav:hover,.nav.active{background:#263957;color:#fff}.nav .ico{width:22px;text-align:center;font-size:16px}
main{padding:20px;width:100%;max-width:1500px;margin:auto;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 0 18px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 4px;color:#111c31}.sub{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid #e8edf4;border-radius:14px;padding:17px;margin-bottom:14px;box-shadow:0 2px 8px #0f172a08;min-width:0}
.kpi{display:flex;justify-content:space-between;gap:8px;align-items:center}.kpi .label{color:var(--muted);font-size:12px;font-weight:700}.kpi strong{display:block;font-size:24px;margin-top:8px}.kpi .symbol{background:#eff6ff;color:#2563eb;border-radius:11px;padding:11px;font-size:19px}
.kpi.green .symbol{background:#dcfce7;color:#15803d}.kpi.orange .symbol{background:#ffedd5;color:#c2410c}.kpi.red .symbol{background:#fee2e2;color:#b91c1c}
h2{font-size:16px;margin:0 0 13px}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#fff;font-weight:800}.btn.blue{background:var(--blue)}.btn.dark{background:var(--navy)}.btn.light{background:#eaf0f7;color:#24334d}.btn.red{background:#fee2e2;color:#b91c1c}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.field{margin-bottom:11px;min-width:0}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px;background:#fff;color:#172033;outline:none}
input:focus,select:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tablewrap{overflow:auto;width:100%}table{border-collapse:collapse;width:100%;min-width:620px}th{text-align:left;color:#64748b;background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:11px 9px;white-space:nowrap}td{padding:11px 9px;border-top:1px solid var(--line);vertical-align:middle}tr:hover td{background:#fbfdff}
.pill{display:inline-block;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:900;background:#dcfce7;color:#166534}.pill.low{background:#fef3c7;color:#92400e}.pill.out,.pill.bad{background:#fee2e2;color:#991b1b}.pill.info{background:#dbeafe;color:#1d4ed8}
.search{max-width:360px}.empty{text-align:center;padding:24px;color:#94a3b8}
.posgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:14px;align-items:start}
.productgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-height:65vh;overflow:auto}
.producttile{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;text-align:left}.producttile b{display:block;margin-bottom:5px}.producttile small{color:var(--muted)}
.cartline{display:grid;grid-template-columns:1fr 60px 75px 28px;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.cartline input{padding:7px}
.totalrow{display:flex;justify-content:space-between;padding:7px 0}.totalrow.big{font-size:20px;font-weight:900;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.receipt{font-family:ui-monospace,monospace;max-width:360px;margin:12px auto;padding:18px;border:1px dashed #94a3b8;color:#111;background:#fff}.receipt h3{text-align:center;margin:0}.receipt .center{text-align:center}
footer{padding:22px;text-align:center;color:#94a3b8;font-size:11px}
.mobilemenu{display:none}
@media(max-width:900px){aside{width:205px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.posgrid{grid-template-columns:1fr}}
@media(max-width:620px){header{height:58px;padding:0 12px}.mobilemenu{display:inline-block}.layout{display:block}aside{display:none;position:fixed;z-index:30;top:58px;bottom:0;left:0;width:260px;overflow:auto;box-shadow:10px 0 30px #0003}aside.open{display:block}main{padding:13px}.grid{gap:8px}.card{padding:13px}.kpi strong{font-size:20px}.formgrid,.formgrid.three{grid-template-columns:1fr}.productgrid{grid-template-columns:1fr 1fr}.headright .status{display:none}}
@media print{body *{visibility:hidden!important}#modal,#modal *{visibility:visible!important}#modal{position:absolute!important;inset:0!important;background:#fff!important;padding:0!important;display:block!important}#modal>div{width:100%!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;padding:0!important}#modal>div>div:first-child,#modal>div>.toolbar{display:none!important}.receipt{border:0;max-width:100%;margin:0}body{background:#fff}}
</style>
</head>
<body>
<header>
 <div class="toolbar"><button class="btn light mobilemenu" onclick="toggleNav()">☰</button><div class="brand">PROMAX <span style="color:#4ade80">SmartPOS</span><small>BACK OFFICE MANAGEMENT</small></div></div>
 <div class="headright"><span class="status" id="branchStatus">● SHOP001-HRE • LOCAL MODE</span><button class="btn light small" onclick="showPage('settings')">⚙ Settings</button></div>
</header>
<div class="layout">
<aside id="sidebar">
 <div class="navtitle">WORKSPACE</div>
 <button class="nav active" data-page="dashboard" onclick="showPage('dashboard')"><span class="ico">▦</span>Dashboard</button>
 <button class="nav" data-page="pos" onclick="showPage('pos')"><span class="ico">🛒</span>POS / New Sale</button>
 <div class="navtitle">INVENTORY & SALES</div>
 <button class="nav" data-page="products" onclick="showPage('products')"><span class="ico">📦</span>Products</button>
 <button class="nav" data-page="purchasing" onclick="showPage('purchasing')"><span class="ico">🛍️</span>Purchase Orders</button>
 <button class="nav" data-page="grn" onclick="showPage('grn')"><span class="ico">📥</span>Goods Received (GRN)</button>
 <button class="nav" data-page="stock" onclick="showPage('stock')"><span class="ico">📋</span>Stock Control</button>
 <button class="nav" data-page="sales" onclick="showPage('sales')"><span class="ico">🧾</span>Sales & Receipts</button>
 <div class="navtitle">PEOPLE & FINANCE</div>
 <button class="nav" data-page="customers" onclick="showPage('customers')"><span class="ico">👥</span>Customers</button>
 <button class="nav" data-page="suppliers" onclick="showPage('suppliers')"><span class="ico">🏭</span>Suppliers</button>
 <button class="nav" data-page="expenses" onclick="showPage('expenses')"><span class="ico">💸</span>Expenses & Cash</button>
 <button class="nav" data-page="reports" onclick="showPage('reports')"><span class="ico">📈</span>Reports</button>
 <div class="navtitle">ADMINISTRATION</div>
 <button class="nav" data-page="users" onclick="showPage('users')"><span class="ico">👤</span>Users & Roles</button>
 <button class="nav" data-page="branches" onclick="showPage('branches')"><span class="ico">🏢</span>Branches</button>
 <button class="nav" data-page="audit" onclick="showPage('audit')"><span class="ico">📜</span>Audit Log</button>
 <button class="nav" data-page="settings" onclick="showPage('settings')"><span class="ico">⚙️</span>Settings & Backup</button>
</aside>
<main id="main"></main>
</div>
<footer>PROMAX SmartPOS • Back Office • Local browser storage prototype</footer>
<script>
'use strict';
const KEY='promax_smartpos_v1';
const defaults={products:[],sales:[],customers:[],suppliers:[],expenses:[],orders:[],grns:[],adjustments:[],users:[{id:'USR001',name:'Administrator',role:'ADMIN',active:true}],branches:[{id:'SHOP001-HRE',name:'Main Shop',location:'Harare',active:true}],audit:[],settings:{shop:'SHOP001-HRE',shopName:'PROMAX Store',address:'',phone:'',currency:'USD',tax:0,printer:'80mm',lowStock:5},next:{product:1,sale:1,po:1,grn:1,expense:1}};
let db=loadDB(),page='dashboard',cart=[],lastReceipt=null;
function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==='object'?Object.assign(structuredClone(defaults),x):structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Storage is full or unavailable. Export a backup and clear old browser data.');return false}}
function id(prefix,key){let n=db.next[key]||1;db.next[key]=n+1;return prefix+String(n).padStart(6,'0')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return (db.settings.currency==='USD'?'$':db.settings.currency+' ')+Number(v||0).toFixed(2)}
function num(v){return Number(v)||0}
function dateNow(){return new Date().toISOString()}
function fmtDate(d){return d?new Date(d).toLocaleString():'—'}
function log(action,detail=''){db.audit.unshift({date:dateNow(),user:'Administrator',action,detail});db.audit=db.audit.slice(0,1000);persist()}
function sum(arr,fn){return arr.reduce((a,x)=>a+fn(x),0)}
function salesTotal(){return sum(db.sales,s=>num(s.total))}
function expensesTotal(){return sum(db.expenses,e=>num(e.amount))}
function cogsTotal(){return sum(db.sales,s=>sum(s.items||[],i=>num(i.cost)*num(i.qty)))}
function grossProfit(){return salesTotal()-cogsTotal()}
function netProfit(){return grossProfit()-expensesTotal()}
function stockValue(){return sum(db.products,p=>num(p.cost)*num(p.stock))}
function stockStatus(p){return num(p.stock)<=0?'<span class="pill out">OUT OF STOCK</span>':num(p.stock)<=num(db.settings.lowStock)?'<span class="pill low">LOW STOCK</span>':'<span class="pill">IN STOCK</span>'}
function toggleNav(){document.getElementById('sidebar').classList.toggle('open')}
function showPage(p){page=p;document.getElementById('sidebar').classList.remove('open');render()}
function head(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="sub">${desc}</p></div><div class="toolbar no-print">${actions}</div></div>`}
function kpi(label,value,icon,cls=''){return `<div class="card kpi ${cls}"><div><div class="label">${label}</div><strong>${value}</strong></div><span class="symbol">${icon}</span></div>`}
function table(headers,rows,empty='No records found'){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function field(label,id,placeholder='',type='text',value=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}"></div>`}
function selectField(label,id,options){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></div>`}
function dashboard(){let low=db.products.filter(p=>num(p.stock)<=num(db.settings.lowStock));let today=new Date().toDateString();let todaySales=db.sales.filter(s=>new Date(s.date).toDateString()===today);return head('Dashboard','Business overview • '+esc(db.settings.shop))+
`<div class="grid">${kpi("Today's Sales",money(sum(todaySales,s=>s.total)),'💰','green')}${kpi('Total Receipts',db.sales.length,'🧾')}${kpi('Gross Profit',money(grossProfit()),'📈','green')}${kpi('Net Profit',money(netProfit()),'💵',netProfit()<0?'red':'green')}</div>
<div class="grid">${kpi('Products',db.products.length,'📦')}${kpi('Stock Value',money(stockValue()),'🏷️')}${kpi('Low Stock Items',low.length,'⚠️','orange')}${kpi('Expenses',money(expensesTotal()),'💸','red')}</div>
<div class="grid2"><section class="card"><h2>Recent Sales</h2>${table(['Receipt','Date','Payment','Total'],db.sales.slice(0,6).map(s=>`<tr><td><b>${esc(s.id)}</b></td><td>${fmtDate(s.date)}</td><td>${esc(s.payment)}</td><td><b>${money(s.total)}</b></td></tr>`).join(''),'No sales recorded')}</section>
<section class="card"><h2>Stock Alerts</h2>${table(['Product','On hand','Status'],low.slice(0,8).map(p=>`<tr><td>${esc(p.name)}</td><td>${num(p.stock)}</td><td>${stockStatus(p)}</td></tr>`).join(''),'All products are above the low-stock level')}</section></div>`}
function productsPage(){return head('Products','Create and maintain your product catalogue',`<button class="btn" onclick="productForm()">＋ Add Product</button><button class="btn light" onclick="exportCSV('products')">Export CSV</button>`)+
`<section class="card"><div class="toolbar"><input class="search" id="productSearch" placeholder="Search name, SKU or category..." oninput="filterTable('productSearch','productRows')"></div>${table(['SKU','Product','Category','Cost','Selling','Margin','Stock','Status','Action'],db.products.map((p,i)=>`<tr class="productRows"><td>${esc(p.sku)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(num(p.price)-num(p.cost))}</td><td>${num(p.stock)}</td><td>${stockStatus(p)}</td><td><button class="btn light small" onclick="productForm('${p.id}')">Edit</button> <button class="btn red small" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join(''),'No products added yet')}</section>`}
function productForm(pid=''){let p=db.products.find(x=>x.id===pid)||{};modal(pid?'Edit Product':'Add Product',`<div class="formgrid">${field('Product name','fName','e.g. Rice 2kg','text',p.name||'')}${field('SKU / Barcode','fSku','Leave blank to auto-generate','text',p.sku||'')}${field('Category','fCat','e.g. Groceries','text',p.category||'General')}${field('Cost price','fCost','0.00','number',p.cost??0)}${field('Selling price','fPrice','0.00','number',p.price??0)}${field('Opening stock','fStock','Quantity','number',p.stock??0)}</div>`,`saveProduct('${pid}')`)}
function saveProduct(pid){let name=val('fName').trim();if(!name)return alert('Product name is required');let cost=num(val('fCost')),price=num(val('fPrice')),stock=num(val('fStock'));if(cost<0||price<0||stock<0)return alert('Values cannot be negative');let p={id:pid||id('PRD','product'),sku:val('fSku').trim()||('SKU-'+Date.now().toString().slice(-7)),name,category:val('fCat').trim()||'General',cost,price,stock};if(pid){let old=db.products.findIndex(x=>x.id===pid);db.products[old]=p}else db.products.push(p);persist();log(pid?'Product updated':'Product created',name);closeModal();render()}
function deleteProduct(pid){let p=db.products.find(x=>x.id===pid);if(!p||!confirm('Delete '+p.name+'? Historical sales will remain.'))return;db.products=db.products.filter(x=>x.id!==pid);persist();log('Product deleted',p.name);render()}
function posPage(){let items=db.products.filter(p=>p.stock>0);return head('POS / New Sale','Search products, build a cart and complete checkout')+
`<div class="posgrid"><section class="card"><div class="toolbar"><input id="posSearch" placeholder="Search product / SKU / barcode..." oninput="renderProductTiles()" autofocus><button class="btn light" onclick="renderProductTiles()">Search</button></div><div class="productgrid" id="productTiles">${items.map(p=>tile(p)).join('')||'<div class="empty">No available products. Add products or receive stock.</div>'}</div></section>
<section class="card"><h2>Current Sale</h2><div id="cartLines">${cartHTML()}</div><div class="totalrow"><span>Subtotal</span><b>${money(cartSubtotal())}</b></div><div class="totalrow"><span>Tax (${num(db.settings.tax)}%)</span><b>${money(cartTax())}</b></div><div class="totalrow big"><span>Total</span><span>${money(cartTotal())}</span></div>
<div class="field"><label>Payment method</label><select id="payment"><option>Cash</option><option>Mobile Money</option><option>Card</option><option>Bank Transfer</option><option>Credit</option></select></div><div class="field"><label>Customer (optional)</label><select id="saleCustomer"><option value="">Walk-in Customer</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><button class="btn" style="width:100%" onclick="checkout()">Complete Sale</button><button class="btn light" style="width:100%;margin-top:8px" onclick="clearCart()">Clear Cart</button></section></div>`}
function tile(p){return `<button class="producttile" onclick="addToCart('${p.id}')"><b>${esc(p.name)}</b><small>${esc(p.sku)} • Stock ${num(p.stock)}</small><div style="font-weight:900;margin-top:9px">${money(p.price)}</div></button>`}
function renderProductTiles(){let q=val('posSearch').toLowerCase();let el=document.getElementById('productTiles');if(!el)return;let a=db.products.filter(p=>num(p.stock)>0&&[p.name,p.sku,p.category].join(' ').toLowerCase().includes(q));el.innerHTML=a.map(tile).join('')||'<div class="empty">No matching products in stock</div>'}
function addToCart(pid){let p=db.products.find(x=>x.id===pid);if(!p)return;let line=cart.find(x=>x.pid===pid);if(line){if(line.qty>=p.stock)return alert('Not enough stock');line.qty++}else cart.push({pid,name:p.name,price:num(p.price),cost:num(p.cost),qty:1});refreshCart()}
function changeQty(pid,v){let l=cart.find(x=>x.pid===pid),p=db.products.find(x=>x.id===pid);if(!l)return;let q=Math.floor(num(v));if(q<=0){cart=cart.filter(x=>x.pid!==pid)}else if(q>p.stock){alert('Quantity exceeds available stock');q=p.stock;l.qty=q}else l.qty=q;refreshCart()}
function removeLine(pid){cart=cart.filter(x=>x.pid!==pid);refreshCart()}
function cartSubtotal(){return sum(cart,x=>x.price*x.qty)}
function cartTax(){return cartSubtotal()*num(db.settings.tax)/100}
function cartTotal(){return cartSubtotal()+cartTax()}
function cartHTML(){return cart.length?cart.map(x=>`<div class="cartline"><div><b>${esc(x.name)}</b><small class="muted" style="display:block">${money(x.price)} each</small></div><input type="number" min="1" value="${x.qty}" onchange="changeQty('${x.pid}',this.value)"><b>${money(x.price*x.qty)}</b><button class="btn red small" onclick="removeLine('${x.pid}')">×</button></div>`).join(''):'<div class="empty">Cart is empty. Select products to begin.</div>'}
function refreshCart(){let e=document.getElementById('cartLines');if(e)e.innerHTML=cartHTML();let box=document.querySelector('.posgrid .card:last-child');if(box){let totals=box.querySelectorAll('.totalrow b,.totalrow.big span:last-child');if(totals[0])totals[0].textContent=money(cartSubtotal());if(totals[1])totals[1].textContent=money(cartTax());if(totals[2])totals[2].textContent=money(cartTotal())}}
function clearCart(){cart=[];render()}
function checkout(){if(!cart.length)return alert('Cart is empty');for(let l of cart){let p=db.products.find(x=>x.id===l.pid);if(!p||p.stock<l.qty)return alert('Stock changed for '+l.name+'. Review the cart.')}let subtotal=cartSubtotal(),tax=cartTax(),total=subtotal+tax;let sale={id:id('INV','sale'),date:dateNow(),items:cart.map(x=>({...x})),subtotal,tax,total,payment:val('payment')||'Cash',customerId:val('saleCustomer')||'',branch:db.settings.shop,user:'Administrator'};cart.forEach(l=>{db.products.find(p=>p.id===l.pid).stock-=l.qty});db.sales.unshift(sale);lastReceipt=sale;cart=[];persist();log('Sale completed',sale.id+' '+money(total));render();openReceipt(sale.id)}
function salesPage(){return head('Sales & Receipts','Review transactions and reprint receipts',`<button class="btn light" onclick="exportCSV('sales')">Export CSV</button>`)+`<section class="card">${table(['Receipt','Date','Customer','Payment','Items','Total','Action'],db.sales.map(s=>{let c=db.customers.find(x=>x.id===s.customerId);return `<tr><td><b>${esc(s.id)}</b></td><td>${fmtDate(s.date)}</td><td>${esc(c?c.name:'Walk-in')}</td><td>${esc(s.payment)}</td><td>${s.items.length}</td><td><b>${money(s.total)}</b></td><td><button class="btn light small" onclick="openReceipt('${s.id}')">View / Print</button></td></tr>`}).join(''),'No receipts yet')}</section>`}
function openReceipt(sid){let s=db.sales.find(x=>x.id===sid);if(!s)return;let c=db.customers.find(x=>x.id===s.customerId);modal('Receipt '+s.id,receiptHTML(s,c),`window.print()`,'Print Receipt')}
function receiptHTML(s,c){return `<div class="receipt"><h3>${esc(db.settings.shopName)}</h3><div class="center">${esc(db.settings.address)}<br>${esc(db.settings.phone)}<br>RECEIPT: ${esc(s.id)}<br>${fmtDate(s.date)}<br>Customer: ${esc(c?c.name:'Walk-in')}</div><hr>${s.items.map(i=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(i.name)} x${i.qty}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}<hr><div class="totalrow"><span>Subtotal</span><b>${money(s.subtotal)}</b></div><div class="totalrow"><span>Tax</span><b>${money(s.tax)}</b></div><div class="totalrow big"><span>TOTAL</span><span>${money(s.total)}</span></div><div class="center">Payment: ${esc(s.payment)}<br><br>Thank you. Come again!</div></div>`}
function purchasingPage(){return head('Purchase Orders','Order stock from your suppliers',`<button class="btn" onclick="poForm()">＋ New Purchase Order</button>`)+`<section class="card">${table(['PO Number','Supplier','Date','Lines','Estimated Total','Status','Action'],db.orders.map(o=>`<tr><td><b>${esc(o.id)}</b></td><td>${esc(o.supplierName)}</td><td>${fmtDate(o.date)}</td><td>${o.items.length}</td><td>${money(sum(o.items,i=>i.qty*i.cost))}</td><td><span class="pill ${o.status==='RECEIVED'?'':'low'}">${esc(o.status)}</span></td><td><button class="btn light small" onclick="viewPO('${o.id}')">View</button></td></tr>`).join(''),'No purchase orders created')}</section>`}
function poForm(){if(!db.suppliers.length)return alert('Add a supplier first');let opts=db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');let prod=db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.sku)})</option>`).join('');modal('Create Purchase Order',`<div class="field"><label>Supplier</label><select id="poSupplier">${opts}</select></div><div class="field"><label>Product</label><select id="poProduct">${prod}</select></div>${field('Quantity','poQty','Quantity','number',1)}${field('Unit cost','poCost','0.00','number',0)}`,'savePO()')}
function savePO(){let p=db.products.find(x=>x.id===val('poProduct')),s=db.suppliers.find(x=>x.id===val('poSupplier')),q=Math.floor(num(val('poQty'))),cost=num(val('poCost'));if(!p||!s||q<=0||cost<0)return alert('Select a product and supplier and enter a valid quantity/cost');let o={id:id('PO','po'),supplierId:s.id,supplierName:s.name,date:dateNow(),items:[{pid:p.id,name:p.name,qty:q,cost}],status:'ORDERED'};db.orders.unshift(o);persist();log('Purchase order created',o.id);closeModal();render()}
function viewPO(oid){let o=db.orders.find(x=>x.id===oid);if(!o)return;modal('Purchase Order '+o.id,`<p><b>Supplier:</b> ${esc(o.supplierName)}<br><b>Date:</b> ${fmtDate(o.date)}<br><b>Status:</b> ${esc(o.status)}</p>${table(['Product','Qty','Unit Cost','Total'],o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.cost)}</td><td>${money(i.qty*i.cost)}</td></tr>`).join(''))}`,`closeModal()`,'Close')}
function grnPage(){return head('Goods Received (GRN)','Receive delivered goods and increase stock',`<button class="btn" onclick="grnForm()">＋ Receive Stock</button>`)+`<section class="card">${table(['GRN','PO Reference','Supplier','Date','Items','Total Cost'],db.grns.map(g=>`<tr><td><b>${esc(g.id)}</b></td><td>${esc(g.poId||'Direct')}</td><td>${esc(g.supplierName)}</td><td>${fmtDate(g.date)}</td><td>${g.items.length}</td><td>${money(sum(g.items,i=>i.qty*i.cost))}</td></tr>`).join(''),'No goods received yet')}</section>`}
function grnForm(){let pending=db.orders.filter(o=>o.status!=='RECEIVED');let opts='<option value="">Direct receipt (no PO)</option>'+pending.map(o=>`<option value="${o.id}">${o.id} • ${esc(o.supplierName)}</option>`).join('');let suppliers=db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');let prods=db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');modal('Receive Goods',`<div class="field"><label>Purchase Order</label><select id="grnPO" onchange="prefillGRN()">${opts}</select></div><div class="field"><label>Supplier (direct receipt)</label><select id="grnSupplier"><option value="">Select supplier</option>${suppliers}</select></div><div class="field"><label>Product</label><select id="grnProduct">${prods}</select></div>${field('Quantity received','grnQty','Quantity','number',1)}${field('Unit cost','grnCost','0.00','number',0)}`,'saveGRN()')}
function prefillGRN(){let o=db.orders.find(x=>x.id===val('grnPO'));if(!o)return;let s=document.getElementById('grnSupplier');if(s)s.value=o.supplierId;let p=document.getElementById('grnProduct');if(p&&o.items[0])p.value=o.items[0].pid;let q=document.getElementById('grnQty');if(q&&o.items[0])q.value=o.items[0].qty;let c=document.getElementById('grnCost');if(c&&o.items[0])c.value=o.items[0].cost}
function saveGRN(){let o=db.orders.find(x=>x.id===val('grnPO')),p=db.products.find(x=>x.id===val('grnProduct')),s=db.suppliers.find(x=>x.id===val('grnSupplier'))||(o?db.suppliers.find(x=>x.id===o.supplierId):null),q=Math.floor(num(val('grnQty'))),cost=num(val('grnCost'));if(!p||!s||q<=0||cost<0)return alert('Complete supplier, product, quantity and cost');p.stock+=q;p.cost=cost;let g={id:id('GRN','grn'),poId:o?o.id:'',supplierName:s.name,date:dateNow(),items:[{pid:p.id,name:p.name,qty:q,cost}]};db.grns.unshift(g);if(o)o.status='RECEIVED';persist();log('Stock received',g.id+' '+p.name+' x'+q);closeModal();render()}
function stockPage(){return head('Stock Control','Stock levels, valuation and manual adjustments',`<button class="btn light" onclick="exportCSV('stock')">Export Stock CSV</button>`)+`<section class="card">${table(['SKU','Product','On Hand','Unit Cost','Stock Value','Status','Action'],db.products.map(p=>`<tr><td>${esc(p.sku)}</td><td><b>${esc(p.name)}</b></td><td>${p.stock}</td><td>${money(p.cost)}</td><td>${money(p.stock*p.cost)}</td><td>${stockStatus(p)}</td><td><button class="btn light small" onclick="adjustStock('${p.id}')">Adjust</button></td></tr>`).join(''),'No products')}</section>`}
function adjustStock(pid){let p=db.products.find(x=>x.id===pid);if(!p)return;modal('Stock Adjustment',`<p><b>${esc(p.name)}</b> • Current stock: ${p.stock}</p>${field('New physical quantity','adjQty','Enter counted quantity','number',p.stock)}${field('Reason','adjReason','e.g. Stock count / damage')}` ,`saveAdjustment('${pid}')`)}
function saveAdjustment(pid){let p=db.products.find(x=>x.id===pid),q=Math.floor(num(val('adjQty'))),reason=val('adjReason').trim();if(!p||q<0)return alert('Enter a valid quantity');let before=p.stock;p.stock=q;db.adjustments.unshift({date:dateNow(),pid,name:p.name,before,after:q,reason});persist();log('Stock adjusted',p.name+': '+before+' → '+q);closeModal();render()}
function simplePeople(type){let isC=type==='customers',arr=isC?db.customers:db.suppliers,title=isC?'Customers':'Suppliers',prefix=isC?'CUS':'SUP';return head(title,'Maintain '+title.toLowerCase()+' records',`<button class="btn" onclick="personForm('${type}')">＋ Add ${isC?'Customer':'Supplier'}</button>`)+`<section class="card">${table(['Code','Name','Phone','Email','Address','Action'],arr.map(x=>`<tr><td>${esc(x.id)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.address)}</td><td><button class="btn light small" onclick="personForm('${type}','${x.id}')">Edit</button> <button class="btn red small" onclick="deletePerson('${type}','${x.id}')">Delete</button></td></tr>`).join(''),'No records added')}</section>`}
function personForm(type,pid=''){let isC=type==='customers',arr=isC?db.customers:db.suppliers,p=arr.find(x=>x.id===pid)||{};modal('Add / Edit '+(isC?'Customer':'Supplier'),`<div class="formgrid">${field('Name','perName','Full name / company','text',p.name||'')}${field('Phone','perPhone','Phone number','text',p.phone||'')}${field('Email','perEmail','Email address','email',p.email||'')}${field('Address','perAddress','Address','text',p.address||'')}</div>`,`savePerson('${type}','${pid}')`)}
function savePerson(type,pid){let arr=type==='customers'?db.customers:db.suppliers,name=val('perName').trim();if(!name)return alert('Name is required');let x={id:pid||((type==='customers'?'CUS':'SUP')+Date.now()),name,phone:val('perPhone'),email:val('perEmail'),address:val('perAddress')};if(pid)arr[arr.findIndex(z=>z.id===pid)]=x;else arr.unshift(x);persist();log(type.slice(0,-1)+' saved',name);closeModal();render()}
function deletePerson(type,pid){if(!confirm('Delete this record?'))return;let key=type==='customers'?'customers':'suppliers';db[key]=db[key].filter(x=>x.id!==pid);persist();render()}
function expensesPage(){return head('Expenses & Cash','Record operating expenses',`<button class="btn" onclick="expenseForm()">＋ Add Expense</button><button class="btn light" onclick="exportCSV('expenses')">Export CSV</button>`)+`<div class="grid">${kpi('Total Sales',money(salesTotal()),'💰','green')}${kpi('COGS',money(cogsTotal()),'📦')}${kpi('Expenses',money(expensesTotal()),'💸','red')}${kpi('Net Profit',money(netProfit()),'📊',netProfit()<0?'red':'green')}</div><section class="card">${table(['Expense ID','Date','Category','Description','Amount','Action'],db.expenses.map(e=>`<tr><td>${esc(e.id)}</td><td>${fmtDate(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td><button class="btn red small" onclick="deleteExpense('${e.id}')">Delete</button></td></tr>`).join(''),'No expenses recorded')}</section>`}
function expenseForm(){modal('Record Expense',`<div class="formgrid">${selectField('Category','exCat',[['Rent','Rent'],['Transport','Transport'],['Utilities','Utilities'],['Salaries','Salaries'],['Repairs','Repairs'],['Other','Other']])}${field('Amount','exAmount','0.00','number')}${field('Description','exDesc','What was paid for?')}</div>`,'saveExpense()')}
function saveExpense(){let amount=num(val('exAmount')),description=val('exDesc').trim();if(amount<=0||!description)return alert('Enter a description and amount greater than zero');db.expenses.unshift({id:id('EXP','expense'),date:dateNow(),category:val('exCat'),description,amount});persist();log('Expense recorded',description+' '+money(amount));closeModal();render()}
function deleteExpense(eid){if(!confirm('Delete this expense?'))return;db.expenses=db.expenses.filter(e=>e.id!==eid);persist();log('Expense deleted',eid);render()}
function reportsPage(){let pay={};db.sales.forEach(s=>pay[s.payment]=(pay[s.payment]||0)+s.total);return head('Reports & Analytics','Business performance and management reports',`<button class="btn light" onclick="exportCSV('sales')">Export Sales</button>`)+
`<div class="grid">${kpi('Revenue',money(salesTotal()),'💰','green')}${kpi('Cost of Goods',money(cogsTotal()),'📦')}${kpi('Gross Profit',money(grossProfit()),'📈','green')}${kpi('Net Profit',money(netProfit()),'💵',netProfit()<0?'red':'green')}</div>
<div class="grid2"><section class="card"><h2>Payment Breakdown</h2>${table(['Method','Transactions Value'],Object.keys(pay).map(k=>`<tr><td>${esc(k)}</td><td><b>${money(pay[k])}</b></td></tr>`).join(''),'No payments yet')}</section><section class="card"><h2>Inventory Summary</h2>${table(['Metric','Value'],`<tr><td>Product count</td><td>${db.products.length}</td></tr><tr><td>Total units on hand</td><td>${sum(db.products,p=>num(p.stock))}</td></tr><tr><td>Stock valuation at cost</td><td>${money(stockValue())}</td></tr><tr><td>Low stock products</td><td>${db.products.filter(p=>p.stock<=db.settings.lowStock).length}</td></tr><tr><td>Purchase orders</td><td>${db.orders.length}</td></tr><tr><td>GRNs</td><td>${db.grns.length}</td></tr>`)}</section></div>
<section class="card"><h2>Profit calculation</h2><p class="muted">Gross profit = sales less the recorded cost of sold items. Net profit = gross profit less expenses. This is a management estimate and excludes unrecorded costs, tax liabilities and other accounting adjustments.</p></section>`}
function usersPage(){return head('Users & Roles','Basic staff directory and role assignment',`<button class="btn" onclick="userForm()">＋ Add User</button>`)+`<section class="card"><p class="muted">This single-file version records user profiles only. It does not provide secure login or enforce permissions.</p>${table(['User ID','Name','Role','Status','Action'],db.users.map(u=>`<tr><td>${esc(u.id)}</td><td><b>${esc(u.name)}</b></td><td>${esc(u.role)}</td><td><span class="pill ${u.active?'':'out'}">${u.active?'ACTIVE':'INACTIVE'}</span></td><td><button class="btn light small" onclick="userForm('${u.id}')">Edit</button></td></tr>`).join(''))}</section>`}
function userForm(uid=''){let u=db.users.find(x=>x.id===uid)||{};modal('User Profile',`<div class="formgrid">${field('Full name','uName','Name','text',u.name||'')}${selectField('Role','uRole',[['ADMIN','Administrator'],['MANAGER','Manager'],['CASHIER','Cashier'],['STOCK','Stock Keeper']])}</div><div class="field"><label><input id="uActive" type="checkbox" style="width:auto" ${u.active===false?'':'checked'}> Active account</label></div>`,`saveUser('${uid}')`);if(u.role)document.getElementById('uRole').value=u.role}
function saveUser(uid){let name=val('uName').trim();if(!name)return alert('Name required');let u={id:uid||'USR'+Date.now(),name,role:val('uRole'),active:document.getElementById('uActive').checked};if(uid)db.users[db.users.findIndex(x=>x.id===uid)]=u;else db.users.push(u);persist();log('User profile saved',name);closeModal();render()}
function branchesPage(){return head('Branches','Manage shop locations',`<button class="btn" onclick="branchForm()">＋ Add Branch</button>`)+`<section class="card">${table(['Branch Code','Branch Name','Location','Status'],db.branches.map(b=>`<tr><td>${esc(b.id)}</td><td><b>${esc(b.name)}</b></td><td>${esc(b.location)}</td><td><span class="pill">${b.active?'ACTIVE':'INACTIVE'}</span></td></tr>`).join(''))}</section>`}
function branchForm(){modal('Add Branch',`${field('Branch code','bCode','e.g. SHOP002')}${field('Branch name','bName','Shop name')}${field('Location','bLocation','Town / city')}`,'saveBranch()')}
function saveBranch(){let code=val('bCode').trim(),name=val('bName').trim();if(!code||!name)return alert('Branch code and name required');db.branches.push({id:code,name,location:val('bLocation'),active:true});persist();log('Branch added',code);closeModal();render()}
function auditPage(){return head('Audit Log','Recent recorded changes and transactions',`<button class="btn light" onclick="exportCSV('audit')">Export CSV</button>`)+`<section class="card">${table(['Date','User','Activity','Details'],db.audit.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join(''),'No activity recorded yet')}</section>`}
function settingsPage(){let s=db.settings;return head('Settings & Data Management','Configure your shop and protect your records')+
`<section class="card"><h2>Business Settings</h2><div class="formgrid">${field('Shop / Branch Code','setShop','SHOP001-HRE','text',s.shop)}${field('Business Name','setName','Business name','text',s.shopName)}${field('Phone','setPhone','Phone','text',s.phone)}${field('Address','setAddress','Address','text',s.address)}${selectField('Currency','setCurrency',[['USD','USD ($)'],['ZWG','ZWG'],['ZAR','ZAR'],['BWP','BWP']])}${field('Tax rate (%)','setTax','0','number',s.tax)}${field('Low stock alert threshold','setLow','5','number',s.lowStock)}${selectField('Receipt printer width','setPrinter',[['80mm','80mm Thermal'],['58mm','58mm Thermal'],['A4','A4']])}</div><button class="btn" onclick="saveSettings()">Save Settings</button></section>
<section class="card"><h2>Backup & Restore</h2><p class="muted">Export a JSON backup regularly. Keep a copy outside this browser/device. Restore replaces the current local data.</p><div class="toolbar"><button class="btn blue" onclick="backup()">⬇ Download Full Backup</button><label class="btn light" for="restoreFile">Restore Backup</label><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"><button class="btn light" onclick="exportCSV('products')">Products CSV</button><button class="btn light" onclick="exportCSV('sales')">Sales CSV</button></div></section>
<section class="card"><h2>System Status</h2><p>Storage: <b>Browser localStorage</b></p><p>Cloud sync: <span class="pill low">NOT CONNECTED</span></p><p>ZIMRA fiscalisation: <span class="pill low">NOT CONNECTED</span></p><p class="muted">This interface does not submit fiscal invoices to ZIMRA. A certified fiscal device/service integration and testing are required.</p><button class="btn red" onclick="clearData()">Clear all local data</button></section>`}
function saveSettings(){Object.assign(db.settings,{shop:val('setShop').trim(),shopName:val('setName').trim(),phone:val('setPhone'),address:val('setAddress'),currency:val('setCurrency'),tax:num(val('setTax')),lowStock:num(val('setLow')),printer:val('setPrinter')});persist();log('Settings updated');render()}
function clearData(){if(!confirm('This permanently clears all PROMAX data stored in this browser. Download a backup first. Continue?'))return;localStorage.removeItem(KEY);db=structuredClone(defaults);cart=[];render()}
function backup(){download('promax-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}
function restoreBackup(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.products)||!Array.isArray(x.sales)||!x.settings)throw Error('Invalid backup');if(!confirm('Replace current PROMAX data with this backup?'))return;db=Object.assign(structuredClone(defaults),x);persist();log('Backup restored',f.name);render();alert('Backup restored')}catch(e){alert('Could not restore: '+e.message)}};r.readAsText(f)}
function exportCSV(type){let rows=[];if(type==='products'||type==='stock')rows=[['SKU','Name','Category','Cost','Price','Stock'],...db.products.map(p=>[p.sku,p.name,p.category,p.cost,p.price,p.stock])];else if(type==='sales')rows=[['Receipt','Date','Payment','Subtotal','Tax','Total'],...db.sales.map(s=>[s.id,s.date,s.payment,s.subtotal,s.tax,s.total])];else if(type==='expenses')rows=[['ID','Date','Category','Description','Amount'],...db.expenses.map(e=>[e.id,e.date,e.category,e.description,e.amount])];else rows=[['Date','User','Action','Details'],...db.audit.map(a=>[a.date,a.user,a.action,a.detail])];let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('promax-'+type+'.csv',csv,'text/csv;charset=utf-8')}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function filterTable(inputId,rowClass){let q=val(inputId).toLowerCase();document.querySelectorAll('.'+rowClass).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function val(id){let e=document.getElementById(id);return e?e.value:''}
function modal(title,body,action,label='Save'){let old=document.getElementById('modal');if(old)old.remove();let d=document.createElement('div');d.id='modal';d.style='position:fixed;inset:0;background:#0f172a99;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px';d.innerHTML=`<div style="background:white;border-radius:15px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><h2 style="margin:0">${title}</h2><button class="btn light small" onclick="closeModal()">✕</button></div><div>${body}</div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn" onclick="${action}">${label}</button></div></div>`;document.body.appendChild(d)}
function closeModal(){let m=document.getElementById('modal');if(m)m.remove()}
function render(){document.getElementById('branchStatus').textContent='● '+db.settings.shop+' • LOCAL MODE';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));let pages={dashboard,products:productsPage,pos:posPage,purchasing:purchasingPage,grn:grnPage,stock:stockPage,sales:salesPage,customers:()=>simplePeople('customers'),suppliers:()=>simplePeople('suppliers'),expenses:expensesPage,reports:reportsPage,users:usersPage,branches:branchesPage,audit:auditPage,settings:settingsPage};document.getElementById('main').innerHTML=(pages[page]||dashboard)()}
render();
</script>
</body>
</html>
