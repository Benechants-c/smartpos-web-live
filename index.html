<body class="bg-[#020617] text-slate-100">
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
<div class="card max-w-md w-full">
<h1 class="text-xl font-black text-center">SmartPOS V5 FINAL - ALL 11 POINTS</h1>
<p class="text-center text-emerald-400 text-[11px] mt-1">ICONS BARS PRINTER REAL TILL STOCK TAKE CALENDAR PDF NO DEMO</p>
<input id="email" class="input mt-4" value="boss@smartpos.co.zw">
<input id="pass" type="password" class="input mt-2" value="Boss123">
<button onclick="loginEmail()" class="w-full mt-3 bg-blue-600 btn">Login</button>

</div></div>
<div id="mainApp" class="hidden flex min-h-screen">
<div id="sidebar" class="w-[320px] bg-[#0f172a] border-r border-slate-800 p-3 fixed h-full overflow-y-auto z-20">
<div class="flex justify-between items-center"><h2 class="font-black text-[13px]">SmartPOS BACK OFFICE LIVE</h2></div>
<div id="shopBadge" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded mt-2 mb-3">SHOP001-HRE | V5 FINAL</div>
<nav id="menu" class="space-y-1"></nav>
<div class="mt-6 pt-3 border-t border-slate-800 text-[10px] text-slate-500"><div id="userEmailDisplay"></div><button onclick="logout()" class="mt-2 w-full bg-red-600 btn text-white">Logout</button><button onclick="clearCache()" class="mt-2 w-full bg-amber-600 btn">Fix Black Screen / Remove Demo</button></div>
</div>
<div class="flex-1 lg:ml-[320px] p-3 lg:p-6"><div class="lg:hidden mb-3"><button onclick="document.getElementById('sidebar').classList.toggle('hidden')" class="bg-slate-800 px-3 py-2 rounded text-xs">Menu</button></div><div id="contentArea"></div></div>
</div>
<script>
function safeParse(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){localStorage.removeItem(k);return f;}}
function clearCache(){if(confirm('Clear cache including demo Sugar? This will remove demo stock')){localStorage.clear();location.reload();}}
const firebaseConfig={apiKey:"AIzaSyATD1DELs0gmtnS_iG8gcA2UvqwtQDF2A4",authDomain:"smartpos-83781.firebaseapp.com",projectId:"smartpos-83781"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const auth=firebase.auth();
let products=safeParse('sp_products_v5',[]);
let pos=safeParse('sp_pos',[]);
let grns=safeParse('sp_grns',[]);
let posCart=[];
let customers=safeParse('sp_customers',[{name:'Walk-in Customer',phone:'0770000000',balance:0}]);
let suppliers=safeParse('sp_suppliers',[{name:'Main Supplier',phone:'0771111111'},{name:'Delta Beverages',phone:'0772222222'}]);
let expenses=safeParse('sp_expenses',[]);
let purchaseOrders=safeParse('sp_po',[]);
let users=safeParse('sp_users',[{email:'boss@smartpos.co.zw',role:'Admin'}]);
let branches=safeParse('sp_branches',[{code:'SHOP001-HRE',name:'Main Shop Harare'}]);
let audit=safeParse('sp_audit_v5',[]);
let stockTakes=safeParse('sp_stocktake',[]);
let settings=safeParse('sp_settings_v5',{shopName:'SmartPOS Main Shop',shopCode:'SHOP001-HRE',phone:'+263 77 123 4567',address:'Harare CBD',tin:'10012345',vatNum:'22012345',currency:'USD / ZWG',usdToZwg:36.5,vat:15,lowStock:10,allowNegative:false,maxDiscount:10,receiptHeader:'Thank you for shopping!',receiptFooter:'Goods not returnable. ZIMRA Fiscal Receipt',zimraStatus:'OFF',zimraDeviceId:'',zimraModel:'Server Ver 1.0',zimraModelVer:'1.0',printerType:'80mm Thermal',printerName:'POS-80',printCopies:1,autoPrint:false,showLogo:true,showTinVat:true,showZimra:true,logRetention:30,logLevel:'All'});
let currentModule='dashboard';
let editingProdIndex=-1, editingCustomerIndex=-1, editingSupplierIndex=-1;
let lastReceipt=null;
function saveAll(){localStorage.setItem('sp_products_v5',JSON.stringify(products));localStorage.setItem('sp_pos',JSON.stringify(pos));localStorage.setItem('sp_grns',JSON.stringify(grns));localStorage.setItem('sp_customers',JSON.stringify(customers));localStorage.setItem('sp_suppliers',JSON.stringify(suppliers));localStorage.setItem('sp_expenses',JSON.stringify(expenses));localStorage.setItem('sp_po',JSON.stringify(purchaseOrders));localStorage.setItem('sp_users',JSON.stringify(users));localStorage.setItem('sp_branches',JSON.stringify(branches));localStorage.setItem('sp_audit_v5',JSON.stringify(audit));localStorage.setItem('sp_stocktake',JSON.stringify(stockTakes));localStorage.setItem('sp_settings_v5',JSON.stringify(settings));}
function logAudit(action){const entry={action:action,time:new Date().toISOString(),user:auth.currentUser?auth.currentUser.email:settings.shopCode,module:currentModule};audit.unshift(entry);if(audit.length>500)audit.pop();saveAll();}
auth.onAuthStateChanged(u=>{if(u){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');document.getElementById('userEmailDisplay').innerText=u.email;logAudit('Login '+u.email);renderMenu();renderModule('dashboard');}else{document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('mainApp').classList.add('hidden');}});
function loginEmail(){const e=document.getElementById('email').value,p=document.getElementById('pass').value;auth.signInWithEmailAndPassword(e,p).catch(()=>auth.createUserWithEmailAndPassword(e,p)).catch(er=>document.getElementById('status').innerText=er.message);}
function loginGoogle(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>document.getElementById('status').innerText=e.message);}
function logout(){logAudit('Logout');auth.signOut();}
function renderMenu(){const items=[['dashboard','📊 1. Dashboard'],['pos','🛒 2. POS / New Sale'],['products','📦 3. Products PRD'],['purchasing','🛍️ 4. Purchasing PO'],['grn','📥 5. GRN - Receive'],['sales','🧾 6. Sales / Receipts'],['stocktake','📋 Stock Take'],['customers','👥 7. Customers'],['suppliers','🏭 8. Suppliers'],['expenses','💸 9. Expenses & Cash'],['reports','📈 10. Reports Profit'],['users','👤 11. Users'],['branches','🏢 12. Branches'],['audit','📜 13. Audit Log'],['settings','⚙️ 14. Settings & ZIMRA']];document.getElementById('menu').innerHTML=items.map(([id,label])=>{const a=currentModule===id?'bg-blue-600 text-white':'bg-[#1e293b] hover:bg-slate-700';return `<button onclick="renderModule('${id}')" class="w-full text-left px-3 py-2.5 rounded-xl ${a} text-[12px]">${label}</button>`;}).join('')+`<div class="mt-3 space-y-1"><button onclick="downloadBackup()" class="w-full text-left px-3 py-2 rounded-xl bg-[#1e293b] text-[11px]">⬇️ Download Backup</button><input id="restoreInput" type="file" class="hidden" onchange="restoreBackup(event)"><button onclick="document.getElementById('restoreInput').click()" class="w-full text-left px-3 py-2 rounded-xl bg-[#1e293b] text-[11px]">⬆️ Restore Backup</button></div>`;document.getElementById('shopBadge').innerText=`${settings.shopCode} | ${settings.printerType} | ZIMRA ${settings.zimraStatus}`;}
function renderModule(id){currentModule=id;logAudit('Open '+id);renderMenu();const area=document.getElementById('contentArea');if(id==='dashboard')area.innerHTML=renderDashboard();else if(id==='products')area.innerHTML=renderProducts();else if(id==='pos')area.innerHTML=renderPOS();else if(id==='grn')area.innerHTML=renderGRN();else if(id==='purchasing')area.innerHTML=renderPO();else if(id==='sales')area.innerHTML=renderSales();else if(id==='stocktake')area.innerHTML=renderStockTake();else if(id==='customers')area.innerHTML=renderCustomers();else if(id==='suppliers')area.innerHTML=renderSuppliers();else if(id==='expenses')area.innerHTML=renderExpenses();else if(id==='reports')area.innerHTML=renderReports();else if(id==='users')area.innerHTML=renderUsers();else if(id==='branches')area.innerHTML=renderBranches();else if(id==='audit')area.innerHTML=renderAudit();else if(id==='settings')area.innerHTML=renderSettings();if(window.innerWidth<1024)document.getElementById('sidebar').classList.add('hidden');if(id==='reports')setTimeout(drawCharts,300);}
function renderDashboard(){const sv=products.reduce((s,p)=>s+p.stock*p.cost,0);const sa=pos.reduce((s,r)=>s+r.total,0);const co=pos.reduce((s,r)=>s+r.cogs,0);const ex=expenses.reduce((s,e)=>s+e.amount,0);const low=products.filter(p=>p.stock<=settings.lowStock);return `<div class="space-y-4"><div class="flex justify-between items-center flex-wrap gap-2"><h1 class="text-xl font-black">📊 1. Dashboard</h1><div class="flex gap-2"><button onclick="printReport('dashboard')" class="bg-slate-700 btn text-[11px]">🖨️ Print</button><button onclick="exportPDF('dashboard')" class="bg-blue-600 btn text-[11px]">📄 PDF</button></div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="card"><div class="label">Stock Value</div><div class="text-xl font-black">$${sv.toFixed(2)}</div></div><div class="card"><div class="label">Retail Value</div><div class="text-xl font-black">$${products.reduce((s,p)=>s+p.stock*p.price,0).toFixed(2)}</div></div><div class="card"><div class="label">Net Sales</div><div class="text-xl font-black">$${sa.toFixed(2)}</div></div><div class="card border-emerald-800 bg-emerald-950/20"><div class="label text-emerald-400">Gross Profit</div><div class="text-xl font-black text-emerald-400">$${(sa-co).toFixed(2)}</div></div></div><div class="grid lg:grid-cols-2 gap-4"><div class="card"><div class="font-bold mb-3">Low Stock (${low.length})</div><table class="w-full"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Stock</th></tr>${low.map(p=>`<tr class="row"><td class="td font-mono">${p.code}</td><td class="td">${p.name}</td><td class="td text-red-400 font-bold">${p.stock}</td></tr>`).join('')||'<tr><td colspan=3 class="td text-slate-500">All stocked</td></tr>'}</table></div><div class="card"><div class="font-bold mb-3">Recent Sales</div><table class="w-full"><tr><th class="th">Receipt</th><th class="th">Total</th><th class="th">Profit</th></tr>${pos.slice(0,5).map(s=>`<tr class="row"><td class="td font-mono">${s.id}</td><td class="td">$${s.total.toFixed(2)}</td><td class="td text-emerald-400">$${(s.total-s.cogs).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=3 class="td text-slate-500">No sales</td></tr>'}</table></div></div></div>`;}
function renderProducts(){return `<div class="space-y-4"><div class="card"><div class="flex justify-between items-center flex-wrap gap-2"><h2 class="font-black">📦 3. Products - ${products.length} items (No Demo)</h2><div class="flex gap-2"><button onclick="exportProducts()" class="bg-emerald-600 btn text-[11px]">⬇️ Export CSV</button><input id="importProd" type="file" accept=".csv,.json" class="hidden" onchange="importProducts(event)"><button onclick="document.getElementById('importProd').click()" class="bg-blue-600 btn text-[11px]">⬆️ Import</button><button onclick="printReport('products')" class="bg-slate-700 btn text-[11px]">🖨️ Print</button><button onclick="toggleProdForm()" class="bg-blue-600 btn">+ New</button></div></div><div id="prodForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-4 gap-3"><div><label class="label">Product Code *</label><input id="pf_code" class="input"></div><div><label class="label">Product Name *</label><input id="pf_name" class="input"></div><div><label class="label">Category</label><select id="pf_cat" class="input"><option>Grocery</option><option>Electronics</option><option>Hardware</option><option>Clothing</option><option>Beverages</option><option>General</option></select></div><div><label class="label">Supplier</label><select id="pf_sup" class="input">${suppliers.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div><label class="label">Cost Price</label><input id="pf_cost" type="number" step="0.01" class="input"></div><div><label class="label">Selling Price</label><input id="pf_price" type="number" step="0.01" class="input"></div><div><label class="label">Stock Qty</label><input id="pf_stock" type="number" class="input"></div><div><label class="label">Reorder Level</label><input id="pf_reorder" type="number" class="input" value="${settings.lowStock}"></div></div><div class="mt-4 flex gap-2"><button onclick="saveProduct()" class="bg-emerald-600 btn">Save Product</button><button onclick="toggleProdForm()" class="bg-slate-700 btn">Cancel</button></div></div></div><div class="card"><div class="overflow-x-auto"><table class="w-full" id="prodTable"><thead><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Category</th><th class="th">Stock</th><th class="th">Cost</th><th class="th">Price</th><th class="th">Margin</th><th class="th">Action</th></tr></thead><tbody>${products.map((p,i)=>`<tr class="row"><td class="td font-mono font-bold">${p.code}</td><td class="td">${p.name}</td><td class="td"><span class="bg-slate-800 px-2 py-1 rounded text-[10px]">${p.cat}</span></td><td class="td">${p.stock}</td><td class="td">$${p.cost.toFixed(2)}</td><td class="td">$${p.price.toFixed(2)}</td><td class="td text-emerald-400">${p.cost>0?(((p.price-p.cost)/p.cost)*100).toFixed(0)+'%':''}</td><td class="td"><button onclick="editProduct(${i})" class="text-blue-400 text-[11px] mr-2">Edit</button><button onclick="deleteProduct(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')||'<tr><td colspan=8 class="td text-center py-8 text-slate-500">No products - Add first product (No Sugar demo)</td></tr>'}</tbody></table></div></div></div>`;}
function toggleProdForm(){document.getElementById('prodForm').classList.toggle('hidden');}
function saveProduct(){const code=document.getElementById('pf_code').value.trim().toUpperCase();const name=document.getElementById('pf_name').value.trim();const cat=document.getElementById('pf_cat').value;const sup=document.getElementById('pf_sup').value;const cost=parseFloat(document.getElementById('pf_cost').value)||0;const price=parseFloat(document.getElementById('pf_price').value)||0;const stock=parseInt(document.getElementById('pf_stock').value)||0;const reorder=parseInt(document.getElementById('pf_reorder').value)||10;if(!code||!name){alert('Code and Name required');return;}if(editingProdIndex>=0){products[editingProdIndex]={code,name,cat,supplier:sup,cost,price,stock,reorder};editingProdIndex=-1;}else{if(products.find(p=>p.code===code)){alert('Code exists');return;}products.push({code,name,cat,supplier:sup,cost,price,stock,reorder});}saveAll();logAudit('Save Product '+code);renderModule('products');}
function editProduct(i){editingProdIndex=i;renderModule('products');setTimeout(()=>{const p=products[i];document.getElementById('prodForm').classList.remove('hidden');document.getElementById('pf_code').value=p.code;document.getElementById('pf_name').value=p.name;document.getElementById('pf_cat').value=p.cat;document.getElementById('pf_cost').value=p.cost;document.getElementById('pf_price').value=p.price;document.getElementById('pf_stock').value=p.stock;},100);}
function deleteProduct(i){if(confirm('Delete '+products[i].code+'?')){logAudit('Delete '+products[i].code);products.splice(i,1);saveAll();renderModule('products');}}
function exportProducts(){let csv='Code,Name,Category,Supplier,Stock,Cost,Price\n';products.forEach(p=>{csv+=`${p.code},${p.name},${p.cat},${p.supplier||''},${p.stock},${p.cost},${p.price}\n`;});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='products_'+settings.shopCode+'.csv';a.click();}
function importProducts(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const text=ev.target.result;const lines=text.split('\n');for(let i=1;i<lines.length;i++){const cols=lines[i].split(',');if(cols.length>=3){const code=cols[0].trim().toUpperCase();if(code&&!products.find(p=>p.code===code))products.push({code,name:cols[1].trim(),cat:cols[2].trim()||'General',supplier:cols[3]||'',stock:parseInt(cols[4])||0,cost:parseFloat(cols[5])||0,price:parseFloat(cols[6])||0,reorder:settings.lowStock});}}saveAll();renderModule('products');}catch(err){alert('Import failed');}};r.readAsText(file);}
function renderPOS(){const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);const cogs=posCart.reduce((s,i)=>s+i.qty*i.cost,0);return `<div class="space-y-4"><div class="flex justify-between items-center"><h1 class="text-xl font-black">🛒 2. POS Real Till</h1><div class="flex gap-2"><button onclick="printReport('pos')" class="bg-slate-700 btn text-[11px]">🖨️ Print</button></div></div><div class="grid lg:grid-cols-5 gap-4"><div class="lg:col-span-3 card"><div class="flex gap-2"><input id="posSearch" oninput="filterPOS()" placeholder="Scan barcode or Search Code" class="input"><select id="posCatFilter" onchange="filterPOS()" class="input w-[130px]"><option value="">All Cat</option>${[...new Set(products.map(p=>p.cat))].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="overflow-x-auto mt-3"><table class="w-full"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Stock</th><th class="th">Price</th><th class="th">Add</th></tr><tbody id="posList">${products.map((p,idx)=>`<tr class="row"><td class="td font-mono font-bold">${p.code}</td><td class="td">${p.name}</td><td class="td">${p.stock}</td><td class="td font-bold">$${p.price.toFixed(2)}</td><td class="td"><button onclick="addToCart(${idx})" class="bg-blue-600 px-3 py-1 rounded text-[11px]">+ Add</button></td></tr>`).join('')||'<tr><td colspan=5 class="td text-center py-8 text-slate-500">No products</td></tr>'}</tbody></table></div></div><div class="lg:col-span-2 card border-emerald-900/30"><h3 class="font-bold">CART - Rows & Columns</h3><table class="w-full text-[12px] mt-2"><tr><th class="th">Code</th><th class="th">Qty</th><th class="th">Price</th><th class="th">Total</th><th class="th"></th></tr>${posCart.map((c,i)=>`<tr class="row"><td class="td font-mono text-[10px]">${c.code}</td><td class="td"><button onclick="changeQty(${i},-1)" class="bg-slate-800 px-2 rounded">-</button> ${c.qty} <button onclick="changeQty(${i},1)" class="bg-slate-800 px-2 rounded">+</button></td><td class="td">$${c.price.toFixed(2)}</td><td class="td font-bold">$${(c.qty*c.price).toFixed(2)}</td><td class="td"><button onclick="posCart.splice(${i},1);renderModule('pos')" class="text-red-400">x</button></td></tr>`).join('')||'<tr><td colspan=5 class="td text-center">Empty</td></tr>'}</table><div class="mt-4 p-3 bg-[#020617] rounded-xl border border-slate-700"><div class="flex justify-between font-black text-[16px]"><span>TOTAL</span><span>$${total.toFixed(2)}</span></div><div class="grid grid-cols-2 gap-2 mt-3"><div><label class="label">Tendered Amount *</label><input id="tendered" type="number" step="0.01" oninput="calcChange()" class="input font-bold text-[16px]" placeholder="${total.toFixed(2)}"></div><div><label class="label">Change</label><div id="changeDisplay" class="input bg-emerald-950/30 text-emerald-400 font-black">$0.00</div></div></div><div class="mt-3"><label class="label">Customer</label><select id="posCustomer" class="input">${customers.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div class="mt-2"><label class="label">Payment Method</label><select id="posPay" class="input"><option>Cash USD</option><option>Cash ZWG</option><option>ZiG Transfer</option><option>USD Transfer</option><option>EcoCash</option><option>Credit</option></select></div><button onclick="checkout()" class="w-full mt-4 bg-emerald-600 btn py-3">Complete Sale $${total.toFixed(2)}</button></div><div id="liveReceipt" class="card mt-3 hidden"><h3 class="font-bold">Live Receipt - Double Tape</h3><div id="receiptTape" class="receipt-tape mt-2"></div><div class="mt-3 flex gap-2"><button onclick="printReceipt()" class="bg-blue-600 btn text-[11px] flex-1">Print</button><button onclick="reprintLast()" class="bg-slate-700 btn text-[11px] flex-1">Reprint</button></div></div></div></div></div>`;}
function filterPOS(){const q=document.getElementById('posSearch').value.toLowerCase();const cat=document.getElementById('posCatFilter').value;document.getElementById('posList').innerHTML=products.filter(p=>{const mq=p.code.toLowerCase().includes(q)||p.name.toLowerCase().includes(q);const mc=!cat||p.cat===cat;return mq&&mc;}).map(p=>{const idx=products.indexOf(p);return `<tr class="row"><td class="td font-mono">${p.code}</td><td class="td">${p.name}</td><td class="td">${p.stock}</td><td class="td">$${p.price.toFixed(2)}</td><td class="td"><button onclick="addToCart(${idx})" class="bg-blue-600 px-3 py-1 rounded text-[11px]">+ Add</button></td></tr>`;}).join('');}
function addToCart(idx){const p=products[idx];if(p.stock<=0&&!settings.allowNegative){alert('Out of stock');return;}const ex=posCart.find(c=>c.code===p.code);if(ex)ex.qty++;else posCart.push({code:p.code,name:p.name,price:p.price,qty:1,cost:p.cost});renderModule('pos');}
function changeQty(i,d){posCart[i].qty+=d;if(posCart[i].qty<=0)posCart.splice(i,1);renderModule('pos');}
function calcChange(){const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);const tender=parseFloat(document.getElementById('tendered')?.value)||0;const change=tender-total;const el=document.getElementById('changeDisplay');if(el){el.innerText='$'+change.toFixed(2);}}
function checkout(){if(posCart.length===0){alert('Cart empty');return;}const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);const cogs=posCart.reduce((s,i)=>s+i.qty*i.cost,0);const tender=parseFloat(document.getElementById('tendered')?.value)||total;const change=tender-total;const cust=document.getElementById('posCustomer').value;const pay=document.getElementById('posPay').value;posCart.forEach(c=>{const pr=products.find(pp=>pp.code===c.code);if(pr)pr.stock-=c.qty;});const sale={id:'S'+Date.now(),items:[...posCart],total,cogs,customer:cust,payment:pay,tendered:tender,change,date:new Date().toISOString()};pos.unshift(sale);lastReceipt=sale;posCart=[];saveAll();logAudit('Sale '+sale.id);showLiveReceipt(sale);renderModule('pos');setTimeout(()=>document.getElementById('liveReceipt').classList.remove('hidden'),200);}
function showLiveReceipt(s){const tape=`${settings.shopName}\n${settings.address}\nPhone: ${settings.phone}\nTIN: ${settings.tin}\nReceipt: ${s.id}\nDate: ${new Date(s.date).toLocaleString()}\nCustomer: ${s.customer}\nPayment: ${s.payment}\n${s.items.map(it=>`${it.code} ${it.qty}x$${it.price.toFixed(2)}=$${(it.qty*it.price).toFixed(2)}`).join('\n')}\nTOTAL: $${s.total.toFixed(2)}\nTendered: $${s.tendered.toFixed(2)}\nChange: $${s.change.toFixed(2)}\n${settings.receiptHeader}`;document.getElementById('receiptTape').innerText=tape;}
function printReceipt(){if(!lastReceipt)return;const content=document.getElementById('receiptTape').innerText;const w=window.open('','','width=300,height=600');w.document.write(`<pre>${content}</pre>`);w.document.close();w.print();}
function reprintLast(){if(!lastReceipt)return;showLiveReceipt(lastReceipt);document.getElementById('liveReceipt').classList.remove('hidden');}
function renderPO(){return `<div class="card"><div class="flex justify-between flex-wrap gap-2"><h2 class="font-black">🛍️ 4. Purchasing PO</h2><div class="flex gap-2"><button onclick="printReport('po')" class="bg-slate-700 btn text-[11px]">🖨️ Print</button><button onclick="exportPO()" class="bg-emerald-600 btn text-[11px]">⬇️ Export</button></div></div><table class="w-full mt-3"><tr><th class="th">PO</th><th class="th">📅 Date</th><th class="th">Supplier</th><th class="th">Product</th><th class="th">Qty</th><th class="th">Status</th><th class="th">Action</th></tr>${purchaseOrders.map((po,i)=>`<tr class="row"><td class="td font-mono">${po.id}</td><td class="td text-[11px]">${new Date(po.date).toLocaleDateString()}</td><td class="td">${po.supplier}</td><td class="td font-mono">${po.productCode||''}</td><td class="td">${po.qty||''}</td><td class="td"><span class="px-2 py-1 rounded text-[10px] ${po.status==='Received'?'bg-emerald-500/20 text-emerald-400':'bg-amber-500/20 text-amber-400'}">${po.status}</span></td><td class="td"><button onclick="receivePO(${i})" class="text-emerald-400 text-[11px] mr-2">Receive</button><button onclick="deletePO(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')||'<tr><td colspan=7 class="td text-center py-6 text-slate-500">No Purchase Orders</td></tr>'}</table></div>`;}
function receivePO(i){const po=purchaseOrders[i];if(po.status==='Received'){alert('Already received');return;}const prod=products.find(p=>p.code===po.productCode);if(prod){prod.stock+=po.qty;grns.unshift({code:prod.code,name:prod.name,qty:po.qty,cost:prod.cost,date:new Date().toISOString(),po:po.id});}po.status='Received';saveAll();logAudit('Receive PO '+po.id);renderModule('purchasing');}

function renderGRN(){return `<div class="space-y-4"><div class="card"><div class="flex justify-between flex-wrap gap-2"><h2 class="font-black">📥 5. GRN - Receive</h2><div class="flex gap-2"><button onclick="printReport('grn')" class="bg-slate-700 btn text-[11px]">🖨️ Print</button><button onclick="exportGRN()" class="bg-emerald-600 btn text-[11px]">⬇️ Export</button><button onclick="toggleGRNForm()" class="bg-emerald-600 btn">+ Receive Stock</button></div></div><div id="grnForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-4 gap-3"><div><label class="label">PO Number (Optional)</label><select id="grn_po" class="input"><option value="">Direct Receive</option>${purchaseOrders.filter(po=>po.status!=='Received').map(po=>`<option value="${po.id}">${po.id}</option>`).join('')}</select></div><div><label class="label">Product Code *</label><select id="grn_code" class="input" onchange="onGRNCodeChange()">${products.map(p=>`<option value="${p.code}">${p.code} - ${p.name}</option>`).join('')}<option value="NEW">+ Add New Code</option></select></div><div id="grn_new_code_div" class="hidden"><label class="label">New Code</label><input id="grn_new_code" class="input" placeholder="STOVE001"></div><div><label class="label">Quantity *</label><input id="grn_qty" type="number" class="input"></div><div><label class="label">Cost Price</label><input id="grn_cost" type="number" step="0.01" class="input"></div><div id="grn_new_name_div" class="hidden"><label class="label">New Product Name</label><input id="grn_new_name" class="input"></div><div id="grn_new_price_div" class="hidden"><label class="label">Selling Price</label><input id="grn_new_price" type="number" step="0.01" class="input"></div></div><div class="mt-3 flex gap-2"><button onclick="saveGRN()" class="bg-emerald-600 btn">Receive Stock</button><button onclick="toggleGRNForm()" class="bg-slate-700 btn">Cancel</button></div></div></div><div class="card"><div class="flex gap-2 mb-3 flex-wrap"><div><label class="label">📅 From Date</label><input id="grn_from" type="date" class="input w-[130px]" onchange="filterGRN()"></div><div><label class="label">📅 To Date</label><input id="grn_to" type="date" class="input w-[130px]" onchange="filterGRN()"></div><button onclick="clearGRNFilter()" class="bg-slate-700 btn text-[11px] mt-5">Clear</button></div><div class="overflow-x-auto"><table class="w-full" id="grnTable"><tr><th class="th">📅 Date</th><th class="th">PO</th><th class="th">Code</th><th class="th">Product</th><th class="th">Qty Received</th><th class="th">Cost</th><th class="th">New Stock</th></tr>${grns.slice(0,100).map(g=>{const prod=products.find(p=>p.code===g.code);return `<tr class="row"><td class="td text-[11px]">${new Date(g.date).toLocaleString()}</td><td class="td font-mono text-[11px]">${g.po||'Direct'}</td><td class="td font-mono font-bold">${g.code}</td><td class="td">${g.name}</td><td class="td text-emerald-400 font-bold">+${g.qty}</td><td class="td">$${g.cost.toFixed(2)}</td><td class="td">${prod?prod.stock:'-'}</td></tr>`;}).join('')||'<tr><td colspan=7 class="td text-center py-6 text-slate-500">No GRN records</td></tr>'}</table></div></div></div>`;}

function saveGRN(){const poId=document.getElementById('grn_po').value;let code=document.getElementById('grn_code').value;const qty=parseInt(document.getElementById('grn_qty').value)||0;let cost=parseFloat(document.getElementById('grn_cost').value)||0;if(code==='NEW'){code=document.getElementById('grn_new_code').value.trim().toUpperCase();const name=document.getElementById('grn_new_name').value.trim();const price=parseFloat(document.getElementById('grn_new_price').value)||0;if(!code||!name){alert('New Code and Name required');return;}if(products.find(p=>p.code===code)){alert('Code exists');return;}const newProd={code,name,cat:'General',cost,price:price||cost*1.5,stock:0,supplier:''};products.push(newProd);}if(!code||qty<=0){alert('Code and Qty required');return;}let prod=products.find(p=>p.code===code);if(!prod){alert('Product not found');return;}prod.stock+=qty;if(cost>0)prod.cost=cost;else cost=prod.cost;grns.unshift({code:prod.code,name:prod.name,qty,cost,date:new Date().toISOString(),po:poId||''});if(poId){const po=purchaseOrders.find(p=>p.id===poId);if(po)po.status='Received';}saveAll();logAudit('GRN '+code+' +'+qty);renderModule('grn');}

t-4"></div></div></div>`;}
function viewReceipt(i){const s=pos[i];lastReceipt=s;const area=document.getElementById('receiptView');area.classList.remove('hidden');area.innerHTML=`<div class="card"><div class="flex justify-between"><h3 class="font-bold">Receipt ${s.id} - Double Tape</h3><div class="flex gap-2"><button onclick="printReceiptFromView(${i})" class="bg-blue-600 btn text-[11px]">🖨️ Print</button><button onclick="document.getElementById('receiptView').classList.add('hidden')" class="bg-slate-700 btn text-[11px]">Close</button></div></div><div class="grid lg:grid-cols-2 gap-4 mt-4"><div><table class="w-full mt-2"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Qty</th><th class="th">Price</th><th class="th">Total</th></tr>${s.items.map(it=>`<tr><td class="td font-mono">${it.code}</td><td class="td">${it.name}</td><td class="td">${it.qty}</td><td class="td">$${it.price.toFixed(2)}</td><td class="td">$${(it.qty*it.price).toFixed(2)}</td></tr>`).join('')}</table><div class="mt-3 pt-3 border-t border-slate-700 space-y-1"><div class="flex justify-between font-bold"><span>Total</span><span>$${s.total.toFixed(2)}</span></div><div class="flex justify-between text-[12px]"><span>Tendered</span><span>$${(s.tendered||s.total).toFixed(2)}</span></div><div class="flex justify-between text-[12px] text-emerald-400"><span>Change</span><span>$${(s.change||0).toFixed(2)}</span></div></div></div><div><div class="receipt-tape" id="receiptTapeView">${settings.shopName}\n${settings.address}\nPhone: ${settings.phone}\nTIN: ${settings.tin} VAT: ${settings.vatNum}\n----------------\nReceipt: ${s.id}\nDate: ${new Date(s.date).toLocaleString()}\nCustomer: ${s.customer}\nPayment: ${s.payment}\n----------------\n${s.items.map(it=>`${it.code} ${it.name} ${it.qty}x$${it.price.toFixed(2)}=$${(it.qty*it.price).toFixed(2)}`).join('\n')}\n----------------\nTOTAL: $${s.total.toFixed(2)}\nTendered: $${(s.tendered||s.total).toFixed(2)}\nChange: $${(s.change||0).toFixed(2)}\nProfit: $${(s.total-s.cogs).toFixed(2)}\nZWG: $${(s.total*settings.usdToZwg).toFixed(2)}\n----------------\n${settings.receiptHeader}\n${settings.receiptFooter}\n</div></div></div></div>`;}

function renderStockTake(){return `<div class="space-y-4"><div class="card"><div class="flex justify-between items-center flex-wrap gap-2"><h2 class="font-black">📋 Stock Take - Track by Dates 📅</h2><div class="flex gap-2 flex-wrap"><div><label class="label">📅 From</label><input id="st_from" type="date" class="input w-[130px]"></div><div><label class="label">📅 To</label><input id="st_to" type="date" class="input w-[130px]"></div><button onclick="filterStockTake()" class="bg-blue-600 btn text-[11px] mt-4">Filter</button><button onclick="clearStockTakeFilter()" class="bg-slate-700 btn text-[11px] mt-4">Clear</button><button onclick="printReport('stocktake')" class="bg-slate-700 btn text-[11px] mt-4">🖨️ Print</button><button onclick="exportStockTake()" class="bg-emerald-600 btn text-[11px] mt-4">⬇️ Export</button><button onclick="startStockTake()" class="bg-blue-600 btn text-[11px] mt-4">+ New Count</button></div></div></div><div class="card"><div class="overflow-x-auto"><table class="w-full" id="stockTakeTable"><tr><th class="th">📅 Date</th><th class="th">Code</th><th class="th">Name</th><th class="th">System</th><th class="th">Counted</th><th class="th">Variance</th><th class="th">Value Impact</th><th class="th">Action</th></tr>${stockTakes.map((st,i)=>`<tr class="row"><td class="td text-[11px]">${new Date(st.date).toLocaleDateString()}</td><td class="td font-mono font-bold">${st.code}</td><td class="td">${st.name}</td><td class="td">${st.system}</td><td class="td font-bold">${st.counted}</td><td class="td ${st.variance<0?'text-red-400':'text-emerald-400'} font-bold">${st.variance>0?'+':''}${st.variance}</td><td class="td">$${(st.variance*st.cost).toFixed(2)}</td><td class="td"><button onclick="deleteStockTake(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')||'<tr><td colspan=8 class="td text-center py-6 text-slate-500">No stock takes - Count by dates</td></tr>'}</table></div></div><div id="stockTakeForm" class="card hidden"><h3 class="font-bold">New Stock Take Count</h3><div class="grid lg:grid-cols-4 gap-3 mt-3"><div><label class="label">Product Code *</label><select id="stk_code" class="input">${products.map(p=>`<option value="${p.code}">${p.code} - ${p.name} - Sys:${p.stock}</option>`).join('')}</select></div><div><label class="label">Counted Quantity *</label><input id="stk_counted" type="number" class="input" placeholder="Physical count"></div><div><label class="label">📅 Stock Take Date</label><input id="stk_date" type="date" class="input" value="${new Date().toISOString().split('T')[0]}"></div><div><label class="label">Notes</label><input id="stk_notes" class="input" placeholder="Damaged, expired etc"></div></div><div class="mt-3 flex gap-2"><button onclick="saveStockTake()" class="bg-emerald-600 btn">Save Count</button><button onclick="document.getElementById('stockTakeForm').classList.add('hidden')" class="bg-slate-700 btn">Cancel</button></div></div></div>`;}
function startStockTake(){document.getElementById('stockTakeForm').classList.remove('hidden');}
function saveStockTake(){const code=document.getElementById('stk_code').value;const counted=parseInt(document.getElementById('stk_counted').value);const date=document.getElementById('stk_date').value||new Date().toISOString();const notes=document.getElementById('stk_notes').value;if(!code||isNaN(counted)){alert('Code and Count required');return;}const prod=products.find(p=>p.code===code);if(!prod){alert('Product not found');return;}const variance=counted-prod.stock;stockTakes.unshift({code:prod.code,name:prod.name,system:prod.stock,counted,variance,cost:prod.cost,date,notes});prod.stock=counted;saveAll();logAudit('Stock Take '+code+' Variance '+variance);renderModule('stocktake');}

function renderUsers(){return `<div class="card"><div class="flex justify-between flex-wrap gap-2"><h2 class="font-black">👤 11. Users</h2><div class="flex gap-2"><button onclick="printReport('users')" class="bg-slate-700 btn text-[11px]">🖨️ Print</button><button onclick="toggleUserForm()" class="bg-blue-600 btn">+ New User</button></div></div><div id="userForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-3 gap-3"><div><label class="label">Email *</label><input id="u_email" class="input"></div><div><label class="label">Role *</label><select id="u_role" class="input"><option>Admin</option><option>Cashier</option><option>Viewer</option></select></div><div><label class="label">Branch</label><select id="u_branch" class="input">${branches.map(b=>`<option>${b.code}</option>`).join('')}</select></div></div><div class="mt-3 flex gap-2"><button onclick="saveUser()" class="bg-emerald-600 btn">Save</button><button onclick="toggleUserForm()" class="bg-slate-700 btn">Cancel</button></div></div><table class="w-full mt-4"><tr><th class="th">Email</th><th class="th">Role</th><th class="th">Branch</th><th class="th">Action</th></tr>${users.map((u,i)=>`<tr class="row"><td class="td">${u.email}</td><td class="td"><span class="bg-blue-500/20 text-blue-400 px-2 py-1 rounded text-[10px]">${u.role}</span></td><td class="td font-mono text-[11px]">${u.branch||settings.shopCode}</td><td class="td"><button onclick="deleteUser(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')}</table></div>`;}
function toggleUserForm(){document.getElementById('userForm').classList.toggle('hidden');}
function saveUser(){const email=document.getElementById('u_email').value.trim();const role=document.getElementById('u_role').value;const branch=document.getElementById('u_branch').value;if(!email){alert('Email required');return;}users.push({email,role,branch});saveAll();logAudit('Add User '+email);renderModule('users');}
function deleteUser(i){if(confirm('Delete?')){logAudit('Delete User '+users[i].email);users.splice(i,1);saveAll();renderModule('users');}}
function renderBranches(){return `<div class="card"><div class="flex justify-between flex-wrap gap-2"><h2 class="font-black">🏢 12. Branches</h2><div class="flex gap-2"><button onclick="printReport('branches')" class="bg-slate-700 btn text-[11px]">🖨️ Print</button><button onclick="toggleBranchForm()" class="bg-blue-600 btn">+ New Branch</button></div></div><div id="branchForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-2 gap-3"><div><label class="label">Branch Code *</label><input id="b_code" class="input" placeholder="SHOP002-BYO"></div><div><label class="label">Branch Name *</label><input id="b_name" class="input"></div><div><label class="label">Address</label><input id="b_addr" class="input"></div><div><label class="label">Phone</label><input id="b_phone" class="input"></div></div><div class="mt-3 flex gap-2"><button onclick="saveBranch()" class="bg-emerald-600 btn">Save</button><button onclick="toggleBranchForm()" class="bg-slate-700 btn">Cancel</button></div></div><table class="w-full mt-4"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Address</th><th class="th">Action</th></tr>${branches.map((b,i)=>`<tr class="row"><td class="td font-mono font-bold">${b.code}</td><td class="td">${b.name}</td><td class="td text-[11px]">${b.address||''}</td><td class="td"><button onclick="deleteBranch(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')}</table></div>`;}
function toggleBranchForm(){document.getElementById('branchForm').classList.toggle('hidden');}
function saveBranch(){const code=document.getElementById('b_code').value.trim().toUpperCase();const name=document.getElementById('b_name').value.trim();const addr=document.getElementById('b_addr').value.trim();const phone=document.getElementById('b_phone').value.trim();if(!code||!name){alert('Required');return;}branches.push({code,name,address:addr,phone});saveAll();logAudit('Add Branch '+code);renderModule('branches');}
function deleteBranch(i){if(confirm('Delete?')){logAudit('Delete Branch '+branches[i].code);branches.splice(i,1);saveAll();renderModule('branches');}}
function renderAudit(){return `<div class="space-y-4"><div class="card"><div class="flex justify-between flex-wrap gap-2"><h2 class="font-black">📜 13. Audit Log - FIXED & WORKING</h2><div class="flex gap-2 flex-wrap"><div><label class="label">📅 From</label><input id="audit_from" type="date" class="input w-[130px]"></div><div><label class="label">📅 To</label><input id="audit_to" type="date" class="input w-[130px]"></div><button onclick="filterAudit()" class="bg-blue-600 btn text-[11px] mt-4">Filter</button><button onclick="printReport('audit')" class="bg-slate-700 btn text-[11px] mt-4">🖨️ Print</button><button onclick="exportAudit()" class="bg-emerald-600 btn text-[11px] mt-4">⬇️ Export</button><button onclick="exportPDF('audit')" class="bg-blue-600 btn text-[11px] mt-4">📄 PDF</button></div></div><div class="mt-3 text-[11px] text-slate-400">Total Logs: ${audit.length} | Retention: ${settings.logRetention} days | Level: ${settings.logLevel}</div></div><div class="card"><table class="w-full" id="auditTable"><tr><th class="th">📅 Date & Time</th><th class="th">Action</th><th class="th">Module</th><th class="th">User</th></tr>${audit.slice(0,150).map(a=>`<tr class="row"><td class="td text-[11px]">${new Date(a.time).toLocaleString()}</td><td class="td">${a.action}</td><td class="td"><span class="bg-slate-800 px-2 py-1 rounded text-[10px]">${a.module||''}</span></td><td class="td text-[11px]">${a.user||''}</td></tr>`).join('')||'<tr><td colspan=4 class="td text-center py-6 text-slate-500">No logs yet - Use system to generate logs - Now FIXED!</td></tr>'}</table><div class="mt-4 flex gap-2"><button onclick="if(confirm('Clear all audit logs?')){audit=[];saveAll();renderModule('audit');}" class="bg-red-600 btn text-[11px]">Clear Log</button><button onclick="testAudit()" class="bg-blue-600 btn text-[11px]">Test Log</button></div></div></div>`;}
function testAudit(){logAudit('Test Audit Log - System Working');renderModule('audit');}
function filterAudit(){const from=document.getElementById('audit_from').value;const to=document.getElementById('audit_to').value;const filtered=audit.filter(a=>{const d=new Date(a.time).toISOString().split('T')[0];if(from&&d<from)return false;if(to&&d>to)return false;return true;});const table=document.getElementById('auditTable');let html=`<tr><th class="th">📅 Date & Time</th><th class="th">Action</th><th class="th">Module</th><th class="th">User</th></tr>`;filtered.slice(0,150).forEach(a=>{html+=`<tr class="row"><td class="td text-[11px]">${new Date(a.time).toLocaleString()}</td><td class="td">${a.action}</td><td class="td">${a.module||''}</td><td class="td text-[11px]">${a.user||''}</td></tr>`;});table.innerHTML=html;}
function exportAudit(){let csv='Date,Action,Module,User\n';audit.forEach(a=>{csv+=`${a.time},${a.action},${a.module||''},${a.user||''}\n`;});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='audit_'+settings.shopCode+'.csv';a.click();}
function renderSettings(){return `<div class="space-y-4"><h1 class="text-xl font-black">⚙️ 14. Settings & ZIMRA - FULL CUSTOMIZATION</h1><div class="grid lg:grid-cols-3 gap-4"><div class="card"><h3 class="font-bold text-blue-400">🏪 1. Shop Information - Customize Address, Phone, TIN</h3><div class="space-y-3 mt-3"><div><label class="label">Shop Name</label><input id="s_shopName" value="${settings.shopName}" class="input"></div><div><label class="label">Shop Code</label><input id="s_shopCode" value="${settings.shopCode}" class="input"></div><div><label class="label">Phone Numbers</label><input id="s_phone" value="${settings.phone}" class="input"></div><div><label class="label">Address</label><input id="s_address" value="${settings.address}" class="input"></div><div><label class="label">TIN Number</label><input id="s_tin" value="${settings.tin}" class="input"></div><div><label class="label">VAT Number</label><input id="s_vatNum" value="${settings.vatNum}" class="input"></div></div></div><div class="card"><h3 class="font-bold text-cyan-400">🧾 4. Receipt Customization Menu</h3><p class="text-[11px] text-slate-400 mt-1">Customize receipts, logs, address, phone without disturbing other settings</p><div class="space-y-3 mt-3"><div><label class="label">Receipt Header Message</label><textarea id="s_rHeader" class="input h-[60px]">${settings.receiptHeader}</textarea></div><div><label class="label">Receipt Footer Message</label><textarea id="s_rFooter" class="input h-[60px]">${settings.receiptFooter}</textarea></div><div class="grid grid-cols-3 gap-2"><div><label class="label">Show Logo</label><select id="s_showLogo" class="input"><option value="true" ${settings.showLogo?'selected':''}>Yes</option><option value="false" ${!settings.showLogo?'selected':''}>No</option></select></div><div><label class="label">Show TIN/VAT</label><select id="s_showTin" class="input"><option value="true" ${settings.showTinVat?'selected':''}>Yes</option><option value="false" ${!settings.showTinVat?'selected':''}>No</option></select></div><div><label class="label">Show ZIMRA</label><select id="s_showZimra" class="input"><option value="true" ${settings.showZimra?'selected':''}>Yes</option><option value="false" ${!settings.showZimra?'selected':''}>No</option></select></div></div><div class="mt-3 p-3 bg-[#020617] rounded-xl border border-slate-700"><div class="label">Live Receipt Preview</div><div class="receipt-tape mt-2">${settings.shopName}\n${settings.address}\nPhone: ${settings.phone}\nTIN: ${settings.tin}\n${settings.receiptHeader}\nTOTAL: $100.00\n${settings.receiptFooter}</div></div></div><div class="card"><h3 class="font-bold text-purple-400">🖨️ 5. Printer Settings</h3><div class="space-y-3 mt-3"><div><label class="label">Printer Type</label><select id="s_printerType" class="input"><option ${settings.printerType==='80mm Thermal'?'selected':''}>80mm Thermal</option><option ${settings.printerType==='58mm Thermal'?'selected':''}>58mm Thermal</option><option ${settings.printerType==='A4 Laser'?'selected':''}>A4 Laser</option><option ${settings.printerType==='PDF Only'?'selected':''}>PDF Only</option></select></div><div><label class="label">Printer Name</label><input id="s_printerName" value="${settings.printerName}" class="input" placeholder="POS-80"></div><div><label class="label">Print Copies</label><input id="s_copies" type="number" value="${settings.printCopies}" class="input"></div><div><label class="label">Auto Print on Sale</label><select id="s_autoPrint" class="input"><option value="false" ${!settings.autoPrint?'selected':''}>No</option><option value="true" ${settings.autoPrint?'selected':''}>Yes</option></select></div><button onclick="testPrint()" class="w-full bg-blue-600 btn mt-2">🖨️ Test Print Receipt</button></div><div class="mt-6"><h3 class="font-bold text-orange-400">📜 6. Logs Settings</h3><div class="space-y-3 mt-3"><div><label class="label">Log Retention Days</label><input id="s_logRet" type="number" value="${settings.logRetention}" class="input"></div><div><label class="label">Log Level</label><select id="s_logLevel" class="input"><option ${settings.logLevel==='All'?'selected':''}>All</option><option ${settings.logLevel==='Sales Only'?'selected':''}>Sales Only</option><option ${settings.logLevel==='Critical Only'?'selected':''}>Critical Only</option></select></div></div></div></div></div><div class="card border border-red-900/30"><h3 class="font-bold text-red-400">🔴 ZIMRA FDMS - Fiscalisation</h3><div class="grid lg:grid-cols-2 gap-3 mt-3"><div><label class="label">ZIMRA Status</label><select id="s_zimra" class="input"><option ${settings.zimraStatus==='OFF'?'selected':''}>OFF</option><option ${settings.zimraStatus==='ON'?'selected':''}>ON</option></select></div><div><label class="label">Device ID</label><input id="s_zimraId" value="${settings.zimraDeviceId}" class="input" placeholder="ZIMRA123456"></div><div><label class="label">Model Name</label><input id="s_zimraModel" value="${settings.zimraModel}" class="input"></div><div><label class="label">Model Version</label><input id="s_zimraVer" value="${settings.zimraModelVer}" class="input"></div></div></div><div class="card"><div class="flex gap-2 flex-wrap"><button onclick="saveSettings()" class="bg-blue-600 btn px-8 py-3">💾 Save All Settings</button><button onclick="downloadBackup()" class="bg-emerald-600 btn">⬇️ Backup</button><button onclick="printReport('settings')" class="bg-slate-700 btn">🖨️ Print Settings</button><button onclick="exportPDF('settings')" class="bg-blue-600 btn">📄 PDF</button></div></div></div>`;}
function testPrint(){const content=`${settings.shopName}\n${settings.address}\nPhone: ${settings.phone}\nTIN: ${settings.tin}\n----------------\nTEST PRINT\nPrinter: ${settings.printerType}\nName: ${settings.printerName}\nDate: ${new Date().toLocaleString()}\n----------------\n${settings.receiptHeader}\n----------------\n`;const w=window.open('','','width=300,height=500');w.document.write(`<pre style="font-family:monospace;font-size:11px;white-space:pre-line">${content}</pre>`);w.document.close();w.print();logAudit('Test Print');}
function saveSettings(){settings.shopName=document.getElementById('s_shopName').value;settings.shopCode=document.getElementById('s_shopCode').value;settings.phone=document.getElementById('s_phone').value;settings.address=document.getElementById('s_address').value;settings.tin=document.getElementById('s_tin').value;settings.vatNum=document.getElementById('s_vatNum').value;settings.printerType=document.getElementById('s_printerType').value;settings.printerName=document.getElementById('s_printerName').value;settings.printCopies=parseInt(document.getElementById('s_copies').value)||1;settings.autoPrint=document.getElementById('s_autoPrint').value==='true';settings.showLogo=document.getElementById('s_showLogo').value==='true';settings.showTinVat=document.getElementById('s_showTin').value==='true';settings.showZimra=document.getElementById('s_showZimra').value==='true';settings.logRetention=parseInt(document.getElementById('s_logRet').value)||30;settings.logLevel=document.getElementById('s_logLevel').value;settings.zimraStatus=document.getElementById('s_zimra').value;settings.zimraDeviceId=document.getElementById('s_zimraId').value;settings.zimraModel=document.getElementById('s_zimraModel').value;settings.zimraModelVer=document.getElementById('s_zimraVer').value;settings.receiptHeader=document.getElementById('s_rHeader').value;settings.receiptFooter=document.getElementById('s_rFooter').value;saveAll();renderMenu();logAudit('Save Settings');alert('✅ V5 Settings Saved - All Customizations Applied');renderModule('settings');}
function printReport(type){logAudit('Print '+type);window.print();}
function exportPDF(type){logAudit('Export PDF '+type);alert('PDF Export for '+type+' - Use Print -> Save as PDF in browser dialog\n\nCurrent: Use Ctrl+P -> Save as PDF');window.print();}
function downloadBackup(){const data={products,pos,grns,customers,suppliers,expenses,purchaseOrders,settings,audit,stockTakes,exported:new Date().toISOString(),version:'V5 FINAL'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SmartPOS-V5-FINAL-Backup-'+settings.shopCode+'.json';a.click();logAudit('Download Backup');}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.products)products=d.products;if(d.pos)pos=d.pos;if(d.grns)grns=d.grns;if(d.customers)customers=d.customers;if(d.suppliers)suppliers=d.suppliers;if(d.expenses)expenses=d.expenses;if(d.purchaseOrders)purchaseOrders=d.purchaseOrders;if(d.settings)settings=d.settings;if(d.audit)audit=d.audit;if(d.stockTakes)stockTakes=d.stockTakes;saveAll();location.reload();}catch(err){alert('Invalid');}};r.readAsText(file);}
</script></body></html>
