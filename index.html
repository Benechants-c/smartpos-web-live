<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPOS V4 PREMIUM - TABLES & FORMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
.th{background:#1e293b;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:12px 10px;text-align:left}
.td{padding:10px;font-size:13px;border-top:1px solid #1e293b}
.row:hover{background:#1e293b}
.input{width:100%;padding:10px 12px;border-radius:10px;background:#0f172a;border:1px solid #334155;color:white;font-size:13px}
.label{font-size:11px;color:#94a3b8;margin-bottom:4px;display:block}
.card{border:1px solid #1e293b;background:#0f172a;border-radius:16px;padding:16px}
.btn{padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px}
</style>
</head>
<body class="bg-[#020617] text-slate-100">
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
<div class="card max-w-md w-full">
<h1 class="text-xl font-black text-center">🔥 SmartPOS V4 PREMIUM</h1>
<p class="text-center text-emerald-400 text-[11px] mt-1">TABLES + FORMS - NO POPUPS - 1-14 PROPER</p>
<input id="email" class="input mt-4" value="boss@smartpos.co.zw">
<input id="pass" type="password" class="input mt-2" value="Boss123">
<button onclick="loginEmail()" class="w-full mt-3 bg-blue-600 btn">Login</button>
<button onclick="loginGoogle()" class="w-full mt-2 bg-white text-black btn">Google</button>
<p id="status" class="text-[11px] text-center mt-2 text-yellow-400">V4 Premium Ready</p>
</div></div>
<div id="mainApp" class="hidden flex min-h-screen">
<div id="sidebar" class="w-[300px] bg-[#0f172a] border-r border-slate-800 p-3 fixed h-full overflow-y-auto z-20">
<div class="flex justify-between items-center"><h2 class="font-black text-[13px]">SmartPOS BACK OFFICE LIVE</h2></div>
<div id="shopBadge" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded mt-2 mb-3">SHOP001-HRE | V4 PREMIUM</div>
<nav id="menu" class="space-y-1"></nav>
<div class="mt-6 pt-3 border-t border-slate-800 text-[10px] text-slate-500"><div id="userEmailDisplay"></div><button onclick="logout()" class="mt-2 w-full bg-red-600 btn text-white">Logout</button><button onclick="clearCache()" class="mt-2 w-full bg-amber-600 btn">Fix Black Screen</button></div>
</div>
<div class="flex-1 lg:ml-[300px] p-3 lg:p-6"><div class="lg:hidden mb-3"><button onclick="document.getElementById('sidebar').classList.toggle('hidden')" class="bg-slate-800 px-3 py-2 rounded text-xs">☰ Menu</button></div><div id="contentArea"></div></div>
</div>
<script>
function safeParse(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){localStorage.removeItem(k);return f;}}
function clearCache(){if(confirm('Clear cache?')){localStorage.clear();location.reload();}}
const firebaseConfig={apiKey:"AIzaSyATD1DELs0gmtnS_iG8gcA2UvqwtQDF2A4",authDomain:"smartpos-83781.firebaseapp.com",projectId:"smartpos-83781"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const auth=firebase.auth();
let products=safeParse('sp_products',[{code:'PRD000125',name:'Sugar 2kg',cat:'Grocery',cost:5,price:10,stock:100,supplier:'Main Supplier'}]);
let pos=safeParse('sp_pos',[]);
let grns=safeParse('sp_grns',[]);
let posCart=[];
let customers=safeParse('sp_customers',[{name:'Walk-in Customer',phone:'0770000000',balance:0}]);
let suppliers=safeParse('sp_suppliers',[{name:'Main Supplier',phone:'0771111111'},{name:'Delta Beverages',phone:'0772222222'}]);
let expenses=safeParse('sp_expenses',[]);
let purchaseOrders=safeParse('sp_po',[]);
let users=safeParse('sp_users',[{email:'boss@smartpos.co.zw',role:'Admin'}]);
let branches=safeParse('sp_branches',[{code:'SHOP001-HRE',name:'Main Shop Harare'}]);
let audit=safeParse('sp_audit',[]);
let settings=safeParse('sp_settings_full',{shopName:'SmartPOS Main Shop',shopCode:'SHOP001-HRE',phone:'+263 77 123 4567',address:'Harare CBD',tin:'10012345',vatNum:'22012345',currency:'USD / ZWG',usdToZwg:36.5,vat:15,lowStock:10,allowNegative:false,maxDiscount:10,receiptHeader:'Thank you for shopping!',receiptFooter:'Goods not returnable. ZIMRA Fiscal Receipt',zimraStatus:'OFF',zimraDeviceId:'',zimraModel:'Server Ver 1.0',zimraModelVer:'1.0'});
let currentModule='dashboard';
let editingProdIndex=-1, editingCustomerIndex=-1, editingSupplierIndex=-1;
function saveAll(){localStorage.setItem('sp_products',JSON.stringify(products));localStorage.setItem('sp_pos',JSON.stringify(pos));localStorage.setItem('sp_grns',JSON.stringify(grns));localStorage.setItem('sp_customers',JSON.stringify(customers));localStorage.setItem('sp_suppliers',JSON.stringify(suppliers));localStorage.setItem('sp_expenses',JSON.stringify(expenses));localStorage.setItem('sp_po',JSON.stringify(purchaseOrders));localStorage.setItem('sp_users',JSON.stringify(users));localStorage.setItem('sp_branches',JSON.stringify(branches));localStorage.setItem('sp_audit',JSON.stringify(audit));localStorage.setItem('sp_settings_full',JSON.stringify(settings));}
function logAudit(a){audit.unshift({action:a,time:new Date().toISOString(),user:auth.currentUser?auth.currentUser.email:''});saveAll();}
auth.onAuthStateChanged(u=>{if(u){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');document.getElementById('userEmailDisplay').innerText=u.email;renderMenu();renderModule('dashboard');}else{document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('mainApp').classList.add('hidden');}});
function loginEmail(){const e=document.getElementById('email').value,p=document.getElementById('pass').value;auth.signInWithEmailAndPassword(e,p).catch(()=>auth.createUserWithEmailAndPassword(e,p)).catch(er=>document.getElementById('status').innerText=er.message);}
function loginGoogle(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>document.getElementById('status').innerText=e.message);}
function logout(){auth.signOut();}
function renderMenu(){const items=[['dashboard','1. Dashboard'],['pos','2. POS / New Sale'],['products','3. Products PRD'],['purchasing','4. Purchasing PO'],['grn','5. GRN - Receive'],['sales','6. Sales / Receipts'],['customers','7. Customers'],['suppliers','8. Suppliers'],['expenses','9. Expenses & Cash'],['reports','10. Reports Profit'],['users','11. Users'],['branches','12. Branches'],['audit','13. Audit Log'],['settings','14. Settings & ZIMRA']];document.getElementById('menu').innerHTML=items.map(([id,label])=>{const a=currentModule===id?'bg-blue-600 text-white':'bg-[#1e293b] hover:bg-slate-700';return `<button onclick="renderModule('${id}')" class="w-full text-left px-3 py-2.5 rounded-xl ${a} text-[12px]">${label}</button>`;}).join('')+`<div class="mt-3 space-y-1"><button onclick="downloadBackup()" class="w-full text-left px-3 py-2 rounded-xl bg-[#1e293b] text-[11px]">⬇ Download Backup</button><input id="restoreInput" type="file" class="hidden" onchange="restoreBackup(event)"><button onclick="document.getElementById('restoreInput').click()" class="w-full text-left px-3 py-2 rounded-xl bg-[#1e293b] text-[11px]">⬆ Restore Backup</button></div>`;document.getElementById('shopBadge').innerText=`${settings.shopCode} | ZIMRA ${settings.zimraStatus} | ${settings.currency}`;}
function renderModule(id){currentModule=id;renderMenu();const area=document.getElementById('contentArea');if(id==='dashboard')area.innerHTML=renderDashboard();else if(id==='products')area.innerHTML=renderProducts();else if(id==='pos')area.innerHTML=renderPOS();else if(id==='grn')area.innerHTML=renderGRN();else if(id==='purchasing')area.innerHTML=renderPO();else if(id==='sales')area.innerHTML=renderSales();else if(id==='customers')area.innerHTML=renderCustomers();else if(id==='suppliers')area.innerHTML=renderSuppliers();else if(id==='expenses')area.innerHTML=renderExpenses();else if(id==='reports')area.innerHTML=renderReports();else if(id==='users')area.innerHTML=renderUsers();else if(id==='branches')area.innerHTML=renderBranches();else if(id==='audit')area.innerHTML=renderAudit();else if(id==='settings')area.innerHTML=renderSettings();if(window.innerWidth<1024)document.getElementById('sidebar').classList.add('hidden');}
function renderDashboard(){const sv=products.reduce((s,p)=>s+p.stock*p.cost,0);const sa=pos.reduce((s,r)=>s+r.total,0);const co=pos.reduce((s,r)=>s+r.cogs,0);const ex=expenses.reduce((s,e)=>s+e.amount,0);const low=products.filter(p=>p.stock<=settings.lowStock);return `<div class="space-y-4"><div class="flex justify-between items-center"><h1 class="text-xl font-black">1. Dashboard</h1><div class="text-[11px] text-slate-400">${new Date().toLocaleString()}</div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="card"><div class="label">Stock Value (Cost)</div><div class="text-xl font-black">$${sv.toFixed(2)}</div></div><div class="card"><div class="label">Retail Value</div><div class="text-xl font-black">$${products.reduce((s,p)=>s+p.stock*p.price,0).toFixed(2)}</div></div><div class="card"><div class="label">Net Sales</div><div class="text-xl font-black">$${sa.toFixed(2)}</div></div><div class="card border-emerald-800 bg-emerald-950/20"><div class="label text-emerald-400">Gross Profit</div><div class="text-xl font-black text-emerald-400">$${(sa-co).toFixed(2)}</div><div class="text-[10px] text-slate-400">Net $${(sa-co-ex).toFixed(2)}</div></div></div><div class="grid lg:grid-cols-2 gap-4"><div class="card"><div class="font-bold mb-3">Low Stock Alert (${low.length})</div><div class="overflow-x-auto"><table class="w-full"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Stock</th><th class="th">Action</th></tr>${low.map(p=>`<tr class="row"><td class="td font-mono">${p.code}</td><td class="td">${p.name}</td><td class="td text-red-400 font-bold">${p.stock}</td><td class="td"><button onclick="renderModule('purchasing')" class="text-blue-400 text-[11px]">Order</button></td></tr>`).join('')||'<tr><td colspan=4 class="td text-slate-500">All stocked</td></tr>'}</table></div></div><div class="card"><div class="font-bold mb-3">Recent Sales</div><table class="w-full"><tr><th class="th">Receipt</th><th class="th">Total</th><th class="th">Profit</th></tr>${pos.slice(0,5).map(s=>`<tr class="row"><td class="td font-mono">${s.id}</td><td class="td">$${s.total.toFixed(2)}</td><td class="td text-emerald-400">$${(s.total-s.cogs).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=3 class="td text-slate-500">No sales</td></tr>'}</table></div></div></div>`;}
function renderProducts(){return `<div class="space-y-4"><div class="card"><div class="flex justify-between items-center"><h2 class="font-black">3. Products PRD</h2><button onclick="toggleProdForm()" class="bg-blue-600 btn">+ New Product</button></div><div id="prodForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-4 gap-3"><div><label class="label">Product Code *</label><input id="pf_code" class="input" placeholder="STOVE001"></div><div><label class="label">Product Name *</label><input id="pf_name" class="input" placeholder="Product Name"></div><div><label class="label">Category</label><select id="pf_cat" class="input"><option>Grocery</option><option>Electronics</option><option>Hardware</option><option>Clothing</option><option>Beverages</option><option>General</option></select></div><div><label class="label">Supplier</label><select id="pf_sup" class="input">${suppliers.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div><label class="label">Cost Price</label><input id="pf_cost" type="number" step="0.01" class="input" placeholder="0.00"></div><div><label class="label">Selling Price</label><input id="pf_price" type="number" step="0.01" class="input" placeholder="0.00"></div><div><label class="label">Stock Qty</label><input id="pf_stock" type="number" class="input" placeholder="0"></div><div><label class="label">Reorder Level</label><input id="pf_reorder" type="number" class="input" value="${settings.lowStock}"></div></div><div class="mt-4 flex gap-2"><button onclick="saveProduct()" class="bg-emerald-600 btn">Save Product</button><button onclick="toggleProdForm()" class="bg-slate-700 btn">Cancel</button></div></div></div><div class="card"><div class="overflow-x-auto"><table class="w-full"><thead><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Category</th><th class="th">Supplier</th><th class="th">Stock</th><th class="th">Cost</th><th class="th">Price</th><th class="th">Margin</th><th class="th">Action</th></tr></thead><tbody>${products.map((p,i)=>`<tr class="row"><td class="td font-mono font-bold">${p.code}</td><td class="td">${p.name}</td><td class="td"><span class="bg-slate-800 px-2 py-1 rounded text-[10px]">${p.cat}</span></td><td class="td text-[11px]">${p.supplier||''}</td><td class="td ${p.stock<=settings.lowStock?'text-red-400 font-bold':''}">${p.stock}</td><td class="td">$${p.cost.toFixed(2)}</td><td class="td">$${p.price.toFixed(2)}</td><td class="td text-emerald-400">${p.cost>0?(((p.price-p.cost)/p.cost)*100).toFixed(0)+'%':''}</td><td class="td"><button onclick="editProduct(${i})" class="text-blue-400 text-[11px] mr-2">Edit</button><button onclick="deleteProduct(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')}</tbody></table></div></div></div>`;}
function toggleProdForm(){document.getElementById('prodForm').classList.toggle('hidden');}
function saveProduct(){const code=document.getElementById('pf_code').value.trim().toUpperCase();const name=document.getElementById('pf_name').value.trim();const cat=document.getElementById('pf_cat').value;const sup=document.getElementById('pf_sup').value;const cost=parseFloat(document.getElementById('pf_cost').value)||0;const price=parseFloat(document.getElementById('pf_price').value)||0;const stock=parseInt(document.getElementById('pf_stock').value)||0;const reorder=parseInt(document.getElementById('pf_reorder').value)||10;if(!code||!name){alert('Code and Name required');return;}if(editingProdIndex>=0){products[editingProdIndex]={code,name,cat,supplier:sup,cost,price,stock,reorder};editingProdIndex=-1;}else{if(products.find(p=>p.code===code)){alert('Code exists');return;}products.push({code,name,cat,supplier:sup,cost,price,stock,reorder});}saveAll();logAudit('Save Product '+code);renderModule('products');}
function editProduct(i){editingProdIndex=i;renderModule('products');setTimeout(()=>{const p=products[i];document.getElementById('prodForm').classList.remove('hidden');document.getElementById('pf_code').value=p.code;document.getElementById('pf_name').value=p.name;document.getElementById('pf_cat').value=p.cat;document.getElementById('pf_cost').value=p.cost;document.getElementById('pf_price').value=p.price;document.getElementById('pf_stock').value=p.stock;},100);}
function deleteProduct(i){if(confirm('Delete '+products[i].code+'?')){logAudit('Delete '+products[i].code);products.splice(i,1);saveAll();renderModule('products');}}
function renderPOS(){const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);return `<div class="space-y-4"><h1 class="text-xl font-black">2. POS / New Sale</h1><div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 card"><div class="flex gap-2 mb-3"><input id="posSearch" oninput="filterPOS()" placeholder="Search by Code or Name" class="input"><select id="posCatFilter" onchange="filterPOS()" class="input w-[140px]"><option value="">All Category</option>${[...new Set(products.map(p=>p.cat))].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="overflow-x-auto"><table class="w-full"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Stock</th><th class="th">Price</th><th class="th">Action</th></tr><tbody id="posList">${products.map((p,idx)=>`<tr class="row"><td class="td font-mono font-bold">${p.code}</td><td class="td">${p.name}</td><td class="td ${p.stock<=0?'text-red-400':''}">${p.stock}</td><td class="td">$${p.price.toFixed(2)}</td><td class="td"><button onclick="addToCart(${idx})" class="bg-blue-600 px-3 py-1 rounded text-[11px]">Add</button></td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="flex justify-between"><h3 class="font-bold">Cart (${posCart.length})</h3><button onclick="posCart=[];renderModule('pos')" class="text-[11px] text-slate-400">Clear</button></div><div class="mt-3 space-y-2 max-h-[300px] overflow-y-auto"><table class="w-full"><tr><th class="th">Code</th><th class="th">Qty</th><th class="th">Total</th><th class="th"></th></tr>${posCart.map((c,i)=>`<tr class="row"><td class="td font-mono text-[11px]">${c.code}</td><td class="td"><div class="flex items-center gap-1"><button onclick="changeQty(${i},-1)" class="bg-slate-800 px-2 rounded">-</button><span class="text-[12px]">${c.qty}</span><button onclick="changeQty(${i},1)" class="bg-slate-800 px-2 rounded">+</button></div></td><td class="td">$${(c.qty*c.price).toFixed(2)}</td><td class="td"><button onclick="posCart.splice(${i},1);renderModule('pos')" class="text-red-400">×</button></td></tr>`).join('')||'<tr><td colspan=4 class="td text-slate-500 text-center">Cart Empty</td></tr>'}</table></div><div class="mt-4 pt-3 border-t border-slate-700"><div class="flex justify-between font-black"><span>Total</span><span>$${total.toFixed(2)}</span></div><div class="flex justify-between text-[11px] text-slate-400"><span>ZWG @ ${settings.usdToZwg}</span><span>$${(total*settings.usdToZwg).toFixed(2)}</span></div><div class="mt-3"><label class="label">Customer</label><select id="posCustomer" class="input">${customers.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div class="mt-2"><label class="label">Payment Method</label><select id="posPay" class="input"><option>Cash USD</option><option>Cash ZWG</option><option>ZiG Transfer</option><option>USD Transfer</option><option>Credit</option></select></div><button onclick="checkout()" class="w-full mt-4 bg-emerald-600 btn py-3 text-[14px]">Complete Sale - $${total.toFixed(2)}</button></div></div></div></div>`;}
function filterPOS(){const q=document.getElementById('posSearch').value.toLowerCase();const cat=document.getElementById('posCatFilter').value;document.getElementById('posList').innerHTML=products.filter(p=>{const matchQ=p.code.toLowerCase().includes(q)||p.name.toLowerCase().includes(q);const matchC=!cat||p.cat===cat;return matchQ&&matchC;}).map(p=>{const idx=products.indexOf(p);return `<tr class="row"><td class="td font-mono font-bold">${p.code}</td><td class="td">${p.name}</td><td class="td">${p.stock}</td><td class="td">$${p.price.toFixed(2)}</td><td class="td"><button onclick="addToCart(${idx})" class="bg-blue-600 px-3 py-1 rounded text-[11px]">Add</button></td></tr>`;}).join('');}
function addToCart(idx){const p=products[idx];if(p.stock<=0&&!settings.allowNegative){alert('Out of stock');return;}const ex=posCart.find(c=>c.code===p.code);if(ex)ex.qty++;else posCart.push({code:p.code,name:p.name,price:p.price,qty:1,cost:p.cost});renderModule('pos');}
function changeQty(i,d){posCart[i].qty+=d;if(posCart[i].qty<=0)posCart.splice(i,1);renderModule('pos');}
function checkout(){if(posCart.length===0){alert('Cart empty');return;}const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);const cogs=posCart.reduce((s,i)=>s+i.qty*i.cost,0);const cust=document.getElementById('posCustomer').value;const pay=document.getElementById('posPay').value;posCart.forEach(c=>{const pr=products.find(pp=>pp.code===c.code);if(pr)pr.stock-=c.qty;});pos.unshift({id:'S'+Date.now(),items:[...posCart],total,cogs,customer:cust,payment:pay,date:new Date().toISOString()});posCart=[];saveAll();logAudit('Sale $'+total+' '+pay);alert('Sale Complete Profit $'+(total-cogs).toFixed(2));renderModule('dashboard');}
function renderPO(){return `<div class="space-y-4"><div class="card"><div class="flex justify-between items-center"><h2 class="font-black">4. Purchasing PO</h2><button onclick="togglePOForm()" class="bg-blue-600 btn">+ New PO</button></div><div id="poForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-3 gap-3"><div><label class="label">Supplier *</label><select id="po_supplier" class="input">${suppliers.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div><label class="label">Product Code *</label><select id="po_product" class="input">${products.map(p=>`<option value="${p.code}">${p.code} - ${p.name}</option>`).join('')}</select></div><div><label class="label">Quantity *</label><input id="po_qty" type="number" class="input" placeholder="Qty"></div><div><label class="label">Expected Cost</label><input id="po_cost" type="number" step="0.01" class="input" placeholder="0.00"></div><div><label class="label">Expected Date</label><input id="po_date" type="date" class="input"></div></div><div class="mt-3 flex gap-2"><button onclick="savePO()" class="bg-emerald-600 btn">Create PO</button><button onclick="togglePOForm()" class="bg-slate-700 btn">Cancel</button></div></div></div><div class="card"><div class="overflow-x-auto"><table class="w-full"><tr><th class="th">PO Number</th><th class="th">Date</th><th class="th">Supplier</th><th class="th">Product</th><th class="th">Qty</th><th class="th">Cost</th><th class="th">Status</th><th class="th">Action</th></tr>${purchaseOrders.map((po,i)=>`<tr class="row"><td class="td font-mono">${po.id}</td><td class="td text-[11px]">${new Date(po.date).toLocaleDateString()}</td><td class="td">${po.supplier}</td><td class="td font-mono">${po.productCode||po.items[0]?.code||''}</td><td class="td">${po.qty||po.items[0]?.qty||''}</td><td class="td">$${(po.cost||0).toFixed(2)}</td><td class="td"><span class="px-2 py-1 rounded text-[10px] ${po.status==='Received'?'bg-emerald-500/20 text-emerald-400':'bg-amber-500/20 text-amber-400'}">${po.status}</span></td><td class="td"><button onclick="receivePO(${i})" class="text-emerald-400 text-[11px] mr-2">Receive</button><button onclick="deletePO(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')||'<tr><td colspan=8 class="td text-center text-slate-500 py-6">No Purchase Orders</td></tr>'}</table></div></div></div>`;}
function togglePOForm(){document.getElementById('poForm').classList.toggle('hidden');}
function savePO(){const sup=document.getElementById('po_supplier').value;const prodCode=document.getElementById('po_product').value;const qty=parseInt(document.getElementById('po_qty').value)||0;const cost=parseFloat(document.getElementById('po_cost').value)||0;const date=document.getElementById('po_date').value||new Date().toISOString();if(!sup||!prodCode||qty<=0){alert('Required fields');return;}const po={id:'PO'+Date.now(),supplier:sup,productCode:prodCode,qty,cost,date,items:[{code:prodCode,qty}],status:'Pending'};purchaseOrders.unshift(po);saveAll();logAudit('Create PO '+po.id);renderModule('purchasing');}
function receivePO(i){const po=purchaseOrders[i];if(po.status==='Received'){alert('Already received');return;}const prod=products.find(p=>p.code===po.productCode);if(!prod){alert('Product not found');return;}prod.stock+=po.qty;if(po.cost>0)prod.cost=po.cost;grns.unshift({code:prod.code,name:prod.name,qty:po.qty,cost:po.cost||prod.cost,date:new Date().toISOString(),po:po.id});po.status='Received';saveAll();logAudit('Receive PO '+po.id);renderModule('purchasing');}
function deletePO(i){if(confirm('Delete PO?')){purchaseOrders.splice(i,1);saveAll();renderModule('purchasing');}}
function renderGRN(){return `<div class="space-y-4"><div class="card"><div class="flex justify-between items-center"><h2 class="font-black">5. GRN - Goods Receive Note</h2><button onclick="toggleGRNForm()" class="bg-emerald-600 btn">+ Receive Stock</button></div><div id="grnForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-4 gap-3"><div><label class="label">PO Number (Optional)</label><select id="grn_po" class="input"><option value="">Direct Receive (No PO)</option>${purchaseOrders.filter(po=>po.status!=='Received').map(po=>`<option value="${po.id}">${po.id} - ${po.productCode}</option>`).join('')}</select></div><div><label class="label">Product Code *</label><select id="grn_code" class="input" onchange="onGRNCodeChange()">${products.map(p=>`<option value="${p.code}">${p.code} - ${p.name}</option>`).join('')}<option value="NEW">+ Add New Product Code</option></select></div><div id="grn_new_code_div" class="hidden"><label class="label">New Product Code</label><input id="grn_new_code" class="input" placeholder="STOVE001"></div><div><label class="label">Quantity *</label><input id="grn_qty" type="number" class="input" placeholder="Qty"></div><div><label class="label">Cost Price</label><input id="grn_cost" type="number" step="0.01" class="input" placeholder="0.00"></div><div id="grn_new_name_div" class="hidden"><label class="label">New Product Name</label><input id="grn_new_name" class="input" placeholder="Name"></div><div id="grn_new_price_div" class="hidden"><label class="label">Selling Price</label><input id="grn_new_price" type="number" step="0.01" class="input" placeholder="Price"></div></div><div class="mt-3 flex gap-2"><button onclick="saveGRN()" class="bg-emerald-600 btn">Receive Stock</button><button onclick="toggleGRNForm()" class="bg-slate-700 btn">Cancel</button></div></div></div><div class="card"><div class="overflow-x-auto"><table class="w-full"><tr><th class="th">Date</th><th class="th">PO</th><th class="th">Code</th><th class="th">Product</th><th class="th">Qty Received</th><th class="th">Cost</th><th class="th">New Stock</th></tr>${grns.slice(0,50).map(g=>{const prod=products.find(p=>p.code===g.code);return `<tr class="row"><td class="td text-[11px]">${new Date(g.date).toLocaleString()}</td><td class="td font-mono text-[11px]">${g.po||'Direct'}</td><td class="td font-mono font-bold">${g.code}</td><td class="td">${g.name}</td><td class="td text-emerald-400 font-bold">+${g.qty}</td><td class="td">$${g.cost.toFixed(2)}</td><td class="td">${prod?prod.stock:'-'}</td></tr>`;}).join('')||'<tr><td colspan=7 class="td text-center text-slate-500 py-6">No GRN records</td></tr>'}</table></div></div></div>`;}
function toggleGRNForm(){document.getElementById('grnForm').classList.toggle('hidden');}
function onGRNCodeChange(){const val=document.getElementById('grn_code').value;const show=val==='NEW';document.getElementById('grn_new_code_div').classList.toggle('hidden',!show);document.getElementById('grn_new_name_div').classList.toggle('hidden',!show);document.getElementById('grn_new_price_div').classList.toggle('hidden',!show);if(!show){const prod=products.find(p=>p.code===val);if(prod)document.getElementById('grn_cost').value=prod.cost;}}
function saveGRN(){const poId=document.getElementById('grn_po').value;let code=document.getElementById('grn_code').value;const qty=parseInt(document.getElementById('grn_qty').value)||0;let cost=parseFloat(document.getElementById('grn_cost').value)||0;if(code==='NEW'){code=document.getElementById('grn_new_code').value.trim().toUpperCase();const name=document.getElementById('grn_new_name').value.trim();const price=parseFloat(document.getElementById('grn_new_price').value)||0;if(!code||!name){alert('New Code and Name required');return;}if(products.find(p=>p.code===code)){alert('Code exists');return;}const newProd={code,name,cat:'General',cost,price:price||cost*1.5,stock:0,supplier:''};products.push(newProd);}if(!code||qty<=0){alert('Code and Qty required');return;}let prod=products.find(p=>p.code===code);if(!prod){alert('Product not found');return;}prod.stock+=qty;if(cost>0)prod.cost=cost;else cost=prod.cost;grns.unshift({code:prod.code,name:prod.name,qty,cost,date:new Date().toISOString(),po:poId||''});if(poId){const po=purchaseOrders.find(p=>p.id===poId);if(po)po.status='Received';}saveAll();logAudit('GRN '+code+' +'+qty);renderModule('grn');}
function renderSales(){return `<div class="card"><h2 class="font-black">6. Sales / Receipts</h2><div class="overflow-x-auto mt-4"><table class="w-full"><tr><th class="th">Receipt No</th><th class="th">Date</th><th class="th">Customer</th><th class="th">Payment</th><th class="th">Items</th><th class="th">Total</th><th class="th">Profit</th><th class="th">Action</th></tr>${pos.map((s,i)=>`<tr class="row"><td class="td font-mono font-bold">${s.id}</td><td class="td text-[11px]">${new Date(s.date).toLocaleString()}</td><td class="td">${s.customer||'Walk-in'}</td><td class="td"><span class="bg-slate-800 px-2 py-1 rounded text-[10px]">${s.payment||'Cash'}</span></td><td class="td">${s.items.length}</td><td class="td font-bold">$${s.total.toFixed(2)}</td><td class="td text-emerald-400 font-bold">$${(s.total-s.cogs).toFixed(2)}</td><td class="td"><button onclick="viewReceipt(${i})" class="text-blue-400 text-[11px] mr-2">View</button><button onclick="refundSale(${i})" class="text-red-400 text-[11px]">Refund</button></td></tr>`).join('')||'<tr><td colspan=8 class="td text-center text-slate-500 py-6">No sales yet</td></tr>'}</table></div><div id="receiptView" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"></div></div>`;}
function viewReceipt(i){const s=pos[i];document.getElementById('receiptView').classList.remove('hidden');document.getElementById('receiptView').innerHTML=`<div class="flex justify-between"><h3 class="font-bold">Receipt ${s.id}</h3><button onclick="document.getElementById('receiptView').classList.add('hidden')" class="text-slate-400">Close</button></div><div class="mt-3 text-[12px] space-y-1"><div>Date: ${new Date(s.date).toLocaleString()}</div><div>Customer: ${s.customer}</div><div>Payment: ${s.payment}</div></div><table class="w-full mt-3"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Qty</th><th class="th">Price</th><th class="th">Total</th></tr>${s.items.map(it=>`<tr><td class="td font-mono">${it.code}</td><td class="td">${it.name}</td><td class="td">${it.qty}</td><td class="td">$${it.price.toFixed(2)}</td><td class="td">$${(it.qty*it.price).toFixed(2)}</td></tr>`).join('')}</table><div class="mt-3 pt-3 border-t border-slate-700 flex justify-between font-black"><span>Total</span><span>$${s.total.toFixed(2)}</span></div><div class="text-[11px] text-slate-400 mt-2">${settings.receiptHeader}<br>${settings.receiptFooter}<br>TIN: ${settings.tin} | VAT: ${settings.vatNum} | ZIMRA: ${settings.zimraStatus}</div>`;}
function refundSale(i){if(!confirm('Refund '+pos[i].id+'? Stock will be returned'))return;const s=pos[i];s.items.forEach(c=>{const pr=products.find(pp=>pp.code===c.code);if(pr)pr.stock+=c.qty;});pos.splice(i,1);saveAll();logAudit('Refund '+s.id);renderModule('sales');}
function renderCustomers(){return `<div class="space-y-4"><div class="card"><div class="flex justify-between"><h2 class="font-black">7. Customers</h2><button onclick="toggleCustomerForm()" class="bg-blue-600 btn">+ New Customer</button></div><div id="custForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-3 gap-3"><div><label class="label">Full Name *</label><input id="cu_name" class="input" placeholder="Customer Name"></div><div><label class="label">Phone *</label><input id="cu_phone" class="input" placeholder="0770000000"></div><div><label class="label">Email</label><input id="cu_email" class="input" placeholder="Email"></div><div><label class="label">Address</label><input id="cu_addr" class="input" placeholder="Address"></div><div><label class="label">Credit Limit</label><input id="cu_credit" type="number" class="input" placeholder="0.00"></div></div><div class="mt-3 flex gap-2"><button onclick="saveCustomer()" class="bg-emerald-600 btn">Save Customer</button><button onclick="toggleCustomerForm()" class="bg-slate-700 btn">Cancel</button></div></div></div><div class="card"><table class="w-full"><tr><th class="th">Name</th><th class="th">Phone</th><th class="th">Email</th><th class="th">Balance</th><th class="th">Action</th></tr>${customers.map((c,i)=>`<tr class="row"><td class="td font-bold">${c.name}</td><td class="td">${c.phone}</td><td class="td text-[11px]">${c.email||''}</td><td class="td">$${(c.balance||0).toFixed(2)}</td><td class="td"><button onclick="editCustomer(${i})" class="text-blue-400 text-[11px] mr-2">Edit</button><button onclick="deleteCustomer(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')}</table></div></div>`;}

function renderExpenses(){const total=expenses.reduce((s,e)=>s+e.amount,0);return `<div class="space-y-4"><div class="card"><div class="flex justify-between"><h2 class="font-black">9. Expenses & Cash - Total $${total.toFixed(2)}</h2><button onclick="toggleExpForm()" class="bg-blue-600 btn">+ New Expense</button></div><div id="expForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-4 gap-3"><div><label class="label">Category *</label><select id="ex_cat" class="input"><option>Rent</option><option>Transport</option><option>Airtime</option><option>Wages</option><option>Electricity</option><option>Water</option><option>Fuel</option><option>Marketing</option><option>Other</option></select></div><div><label class="label">Description *</label><input id="ex_desc" class="input" placeholder="Description"></div><div><label class="label">Amount *</label><input id="ex_amt" type="number" step="0.01" class="input" placeholder="0.00"></div><div><label class="label">Payment Method</label><select id="ex_pay" class="input"><option>Cash</option><option>Transfer</option><option>EcoCash</option></select></div></div><div class="mt-3 flex gap-2"><button onclick="saveExpense()" class="bg-emerald-600 btn">Save Expense</button><button onclick="toggleExpForm()" class="bg-slate-700 btn">Cancel</button></div></div></div><div class="card"><table class="w-full"><tr><th class="th">Date</th><th class="th">Category</th><th class="th">Description</th><th class="th">Payment</th><th class="th">Amount</th><th class="th">Action</th></tr>${expenses.map((e,i)=>`<tr class="row"><td class="td text-[11px]">${new Date(e.date).toLocaleDateString()}</td><td class="td"><span class="bg-slate-800 px-2 py-1 rounded text-[10px]">${e.cat}</span></td><td class="td">${e.desc}</td><td class="td text-[11px]">${e.pay||'Cash'}</td><td class="td font-bold text-red-400">$${e.amount.toFixed(2)}</td><td class="td"><button onclick="deleteExpense(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')||'<tr><td colspan=6 class="td text-center text-slate-500 py-6">No expenses</td></tr>'}</table></div></div>`;}
function toggleExpForm(){document.getElementById('expForm').classList.toggle('hidden');}
function saveExpense(){const cat=document.getElementById('ex_cat').value;const desc=document.getElementById('ex_desc').value.trim();const amt=parseFloat(document.getElementById('ex_amt').value)||0;const pay=document.getElementById('ex_pay').value;if(!desc||amt<=0){alert('Description and Amount required');return;}expenses.unshift({cat,desc,amount:amt,pay,date:new Date().toISOString()});saveAll();logAudit('Expense $'+amt);renderModule('expenses');}

function renderReports(){const sales=pos.reduce((s,r)=>s+r.total,0);const cogs=pos.reduce((s,r)=>s+r.cogs,0);const gross=sales-cogs;const exp=expenses.reduce((s,e)=>s+e.amount,0);const net=gross-exp;const vat=sales*settings.vat/100;return `<div class="space-y-4"><div class="card"><h2 class="font-black">10. Reports Profit</h2><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-4"><div class="card"><div class="label">Net Sales</div><div class="text-xl font-black">$${sales.toFixed(2)}</div></div><div class="card"><div class="label">COGS</div><div class="text-xl font-black">$${cogs.toFixed(2)}</div></div><div class="card border-emerald-800 bg-emerald-950/20"><div class="label text-emerald-400">Gross Profit</div><div class="text-xl font-black text-emerald-400">$${gross.toFixed(2)}</div></div><div class="card"><div class="label">Expenses</div><div class="text-xl font-black text-red-400">$${exp.toFixed(2)}</div></div><div class="card border-blue-800 bg-blue-950/20"><div class="label text-blue-400">Net Profit</div><div class="text-xl font-black text-blue-400">$${net.toFixed(2)}</div></div><div class="card"><div class="label">VAT ${settings.vat}%</div><div class="text-xl font-black">$${vat.toFixed(2)}</div></div><div class="card"><div class="label">ZWG Sales</div><div class="text-xl font-black">$${(sales*settings.usdToZwg).toFixed(2)}</div></div><div class="card"><div class="label">Stock Value</div><div class="text-xl font-black">$${products.reduce((s,p)=>s+p.stock*p.cost,0).toFixed(2)}</div></div></div></div><div class="card"><h3 class="font-bold">Sales by Product Code</h3><table class="w-full mt-3"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Qty Sold</th><th class="th">Revenue</th><th class="th">Profit</th></tr>${(()=>{const map={};pos.forEach(s=>s.items.forEach(it=>{if(!map[it.code])map[it.code]={code:it.code,name:it.name,qty:0,rev:0,profit:0};map[it.code].qty+=it.qty;map[it.code].rev+=it.qty*it.price;map[it.code].profit+=(it.price-it.cost)*it.qty;}));return Object.values(map).map(m=>`<tr class="row"><td class="td font-mono font-bold">${m.code}</td><td class="td">${m.name}</td><td class="td">${m.qty}</td><td class="td">$${m.rev.toFixed(2)}</td><td class="td text-emerald-400 font-bold">$${m.profit.toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=5 class="td text-center text-slate-500">No sales data</td></tr>';})()}</table></div></div>`;}
function renderUsers(){return `<div class="card"><div class="flex justify-between"><h2 class="font-black">11. Users</h2><button onclick="toggleUserForm()" class="bg-blue-600 btn">+ New User</button></div><div id="userForm" class="hidden mt-4 p-4 bg-[#020617] rounded-xl border border-slate-800"><div class="grid lg:grid-cols-3 gap-3"><div><label class="label">Email *</label><input id="u_email" class="input" placeholder="user@email.com"></div><div><label class="label">Role *</label><select id="u_role" class="input"><option>Admin</option><option>Cashier</option><option>Viewer</option></select></div><div><label class="label">Branch</label><select id="u_branch" class="input">${branches.map(b=>`<option>${b.code}</option>`).join('')}</select></div></div><div class="mt-3 flex gap-2"><button onclick="saveUser()" class="bg-emerald-600 btn">Save User</button><button onclick="toggleUserForm()" class="bg-slate-700 btn">Cancel</button></div></div><table class="w-full mt-4"><tr><th class="th">Email</th><th class="th">Role</th><th class="th">Branch</th><th class="th">Action</th></tr>${users.map((u,i)=>`<tr class="row"><td class="td">${u.email}</td><td class="td"><span class="bg-blue-500/20 text-blue-400 px-2 py-1 rounded text-[10px]">${u.role}</span></td><td class="td font-mono text-[11px]">${u.branch||settings.shopCode}</td><td class="td"><button onclick="deleteUser(${i})" class="text-red-400 text-[11px]">Delete</button></td></tr>`).join('')}</table></div>`;}

function deleteBranch(i){if(confirm('Delete branch?')){branches.splice(i,1);saveAll();renderModule('branches');}}
function renderAudit(){return `<div class="card"><h2 class="font-black">13. Audit Log</h2><table class="w-full mt-4"><tr><th class="th">Date & Time</th><th class="th">Action</th><th class="th">User</th></tr>${audit.slice(0,100).map(a=>`<tr class="row"><td class="td text-[11px]">${new Date(a.time).toLocaleString()}</td><td class="td">${a.action}</td><td class="td text-[11px]">${a.user||''}</td></tr>`).join('')||'<tr><td colspan=3 class="td text-center text-slate-500">No logs</td></tr>'}</table><button onclick="if(confirm('Clear audit log?')){audit=[];saveAll();renderModule('audit');}" class="mt-4 bg-red-600 btn">Clear Log</button></div>`;}
function renderSettings(){return `<div class="space-y-4"><h1 class="text-xl font-black">14. Settings & ZIMRA - FULL</h1><div class="card"><h3 class="font-bold text-blue-400">1. Shop Information</h3><div class="grid lg:grid-cols-2 gap-3 mt-3"><div><label class="label">Shop Name</label><input id="s_shopName" value="${settings.shopName}" class="input"></div><div><label class="label">Shop Code</label><input id="s_shopCode" value="${settings.shopCode}" class="input"></div><div><label class="label">Phone</label><input id="s_phone" value="${settings.phone}" class="input"></div><div><label class="label">Address</label><input id="s_address" value="${settings.address}" class="input"></div><div><label class="label">TIN Number</label><input id="s_tin" value="${settings.tin}" class="input"></div><div><label class="label">VAT Number</label><input id="s_vatNum" value="${settings.vatNum}" class="input"></div></div></div><div class="card"><h3 class="font-bold text-emerald-400">2. Financial</h3><div class="grid lg:grid-cols-3 gap-3 mt-3"><div><label class="label">Currency</label><select id="s_currency" class="input"><option ${settings.currency==='USD / ZWG'?'selected':''}>USD / ZWG</option><option ${settings.currency==='USD'?'selected':''}>USD</option><option ${settings.currency==='ZWG'?'selected':''}>ZWG</option></select></div><div><label class="label">USD to ZWG Rate</label><input id="s_rate" type="number" step="0.01" value="${settings.usdToZwg}" class="input"></div><div><label class="label">VAT Rate %</label><input id="s_vat" type="number" value="${settings.vat}" class="input"></div></div></div><div class="card"><h3 class="font-bold text-amber-400">3. Inventory</h3><div class="grid lg:grid-cols-3 gap-3 mt-3"><div><label class="label">Low Stock Threshold</label><input id="s_low" type="number" value="${settings.lowStock}" class="input"></div><div><label class="label">Allow Negative Stock</label><select id="s_neg" class="input"><option value="false" ${!settings.allowNegative?'selected':''}>No</option><option value="true" ${settings.allowNegative?'selected':''}>Yes</option></select></div><div><label class="label">Max Discount %</label><input id="s_maxDisc" type="number" value="${settings.maxDiscount}" class="input"></div></div></div><div class="card border border-red-900/30"><h3 class="font-bold text-red-400">5. ZIMRA FDMS</h3><div class="grid lg:grid-cols-2 gap-3 mt-3"><div><label class="label">ZIMRA Status</label><select id="s_zimra" class="input"><option ${settings.zimraStatus==='OFF'?'selected':''}>OFF</option><option ${settings.zimraStatus==='ON'?'selected':''}>ON</option></select></div><div><label class="label">Device ID</label><input id="s_zimraId" value="${settings.zimraDeviceId}" class="input" placeholder="ZIMRA123456"></div><div><label class="label">Model Name</label><input id="s_zimraModel" value="${settings.zimraModel}" class="input"></div><div><label class="label">Model Version</label><input id="s_zimraVer" value="${settings.zimraModelVer}" class="input"></div></div></div><div class="card"><h3 class="font-bold text-cyan-400">6. Receipt</h3><div class="grid gap-3 mt-3"><div><label class="label">Header Message</label><input id="s_rHeader" value="${settings.receiptHeader}" class="input"></div><div><label class="label">Footer Message</label><input id="s_rFooter" value="${settings.receiptFooter}" class="input"></div></div></div><div class="card"><button onclick="saveSettings()" class="bg-blue-600 btn px-8 py-3">💾 Save All Settings</button><button onclick="downloadBackup()" class="ml-2 bg-emerald-600 btn">Download Backup</button></div></div>`;}
function saveSettings(){settings.shopName=document.getElementById('s_shopName').value;settings.shopCode=document.getElementById('s_shopCode').value;settings.phone=document.getElementById('s_phone').value;settings.address=document.getElementById('s_address').value;settings.tin=document.getElementById('s_tin').value;settings.vatNum=document.getElementById('s_vatNum').value;settings.currency=document.getElementById('s_currency').value;settings.usdToZwg=parseFloat(document.getElementById('s_rate').value)||36.5;settings.vat=parseFloat(document.getElementById('s_vat').value)||15;settings.lowStock=parseInt(document.getElementById('s_low').value)||10;settings.allowNegative=document.getElementById('s_neg').value==='true';settings.maxDiscount=parseInt(document.getElementById('s_maxDisc').value)||10;settings.zimraStatus=document.getElementById('s_zimra').value;settings.zimraDeviceId=document.getElementById('s_zimraId').value;settings.zimraModel=document.getElementById('s_zimraModel').value;settings.zimraModelVer=document.getElementById('s_zimraVer').value;settings.receiptHeader=document.getElementById('s_rHeader').value;settings.receiptFooter=document.getElementById('s_rFooter').value;saveAll();renderMenu();alert('Settings Saved V4');renderModule('settings');}
function downloadBackup(){const data={products,pos,grns,customers,suppliers,expenses,purchaseOrders,settings,audit,exported:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SmartPOS-V4-Backup-'+settings.shopCode+'.json';a.click();}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.products)products=d.products;if(d.pos)pos=d.pos;if(d.grns)grns=d.grns;if(d.customers)customers=d.customers;if(d.suppliers)suppliers=d.suppliers;if(d.expenses)expenses=d.expenses;if(d.purchaseOrders)purchaseOrders=d.purchaseOrders;if(d.settings)settings=d.settings;saveAll();location.reload();}catch(err){alert('Invalid');}};r.readAsText(file);}
</script></body></html>
