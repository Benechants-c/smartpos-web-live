<div class="mt-5 space-y-3">

</div></div></div>

<div id="shopBadge" class="text-[11px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded mb-3">SHOP001-HRE | ZIMRA OFF | USD/ZWG</div>

<div class="mt-6 pt-3 border-t border-slate-800 text-[10px] text-slate-500"><div id="userEmailDisplay"></div><div>SHOP001-HRE - Vercel LIVE - FULL V2</div><button onclick="logout()" class="mt-2 w-full bg-red-600 p-2 rounded-lg text-white font-bold">Logout</button></div>
</div>
<div class="flex-1 lg:ml-[280px] p-3 lg:p-6"><div class="lg:hidden mb-3 flex justify-between items-center"><button onclick="toggleSidebar()" class="bg-slate-800 px-3 py-2 rounded">☰ Menu</button><div class="text-xs">SHOP001-HRE</div></div><div id="contentArea"></div></div>
</div></div></div>
<script>
function safeParse(key, fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){localStorage.removeItem(key);return fallback;}}
function clearCache(){if(confirm('Clear cache to fix black screen?')){localStorage.clear();location.reload();}}
const firebaseConfig={apiKey:"AIzaSyATD1DELs0gmtnS_iG8gcA2UvqwtQDF2A4",authDomain:"smartpos-83781.firebaseapp.com",projectId:"smartpos-83781",storageBucket:"smartpos-83781.firebasestorage.app",messagingSenderId:"635519087873",appId:"1:635519087873:web:3669e629e7c76f01971700"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const auth=firebase.auth();
let products=safeParse('sp_products',[{code:'PRD000125',name:'Demo Sugar 2kg',cat:'Grocery',cost:5,price:10,stock:100,reorder:10}]);
let pos=safeParse('sp_pos',[]);let grns=safeParse('sp_grns',[]);let posCart=[];
let settings=safeParse('sp_settings_full',{shopName:'SmartPOS Main Shop',shopCode:'SHOP001-HRE',phone:'+263 77 123 4567',address:'Harare CBD',tin:'10012345',vatNum:'22012345',currency:'USD / ZWG',usdToZwg:36.5,vat:15,vatInclusive:false,lowStock:10,allowNegative:false,costMethod:'Average',barcode:true,discountAllowed:true,maxDiscount:10,autoPrint:false,showCustomer:true,creditSales:true,receiptHeader:'Thank you for shopping!',receiptFooter:'Goods once sold not returnable. ZIMRA Fiscal Receipt',logo:'',zimraStatus:'OFF',zimraDeviceId:'',zimraModel:'Server Ver 1.0',zimraModelVer:'1.0',fiscalOpen:'08:00',fiscalClose:'20:00',qr:true});
let currentModule='dashboard';
function saveAll(){localStorage.setItem('sp_products',JSON.stringify(products));localStorage.setItem('sp_pos',JSON.stringify(pos));localStorage.setItem('sp_grns',JSON.stringify(grns));localStorage.setItem('sp_settings_full',JSON.stringify(settings));}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('hidden');}
auth.onAuthStateChanged(u=>{if(u){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');document.getElementById('userEmailDisplay').innerText=u.email;renderMenu();renderModule('dashboard');}else{document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('mainApp').classList.add('hidden');}});
function loginEmail(){const e=document.getElementById('email').value,p=document.getElementById('pass').value;document.getElementById('status').innerText='Logging...';auth.signInWithEmailAndPassword(e,p).catch(()=>auth.createUserWithEmailAndPassword(e,p)).catch(er=>document.getElementById('status').innerText=er.message);}
function loginGoogle(){const pr=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(pr).catch(er=>document.getElementById('status').innerText=er.message);}
function logout(){auth.signOut();}
function renderMenu(){const items=[['dashboard','0. Dashboard'],['pos','1. POS / New Sale'],['products','2. Products PRD'],['purchasing','5. Purchasing PO'],['grn','6. GRN - Receive (FIXED)'],['sales','7. Sales / Receipts'],['customers','8. Customers'],['suppliers','9. Suppliers'],['expenses','10. Expenses & Cash'],['reports','11. Reports Profit'],['users','12. Users'],['branches','13. Branches'],['audit','14. Audit Log'],['settings','Settings & ZIMRA (FULL 9 Sections)']];document.getElementById('menu').innerHTML=items.map(([id,label])=>{const active=currentModule===id?'bg-blue-600 text-white':'bg-slate-800 hover:bg-slate-700';return `<button onclick="renderModule('${id}')" class="w-full text-left px-3 py-2.5 rounded-xl ${active}">${label}</button>`;}).join('')+`<div class="mt-3 space-y-1"><button onclick="downloadBackup()" class="w-full text-left px-3 py-2 rounded-xl bg-slate-800">⬇ Download Backup</button><button onclick="document.getElementById('restoreInput').click()" class="w-full text-left px-3 py-2 rounded-xl bg-slate-800">⬆ Restore Backup</button><input id="restoreInput" type="file" accept=".json" class="hidden" onchange="restoreBackup(event)"><button onclick="clearCache()" class="w-full text-left px-3 py-2 rounded-xl bg-amber-600">Fix Black Screen</button></div>`;document.getElementById('shopBadge').innerText=`${settings.shopCode} | ZIMRA ${settings.zimraStatus} | ${settings.currency} | Rate ${settings.usdToZwg}`;}
function renderModule(id){currentModule=id;renderMenu();const area=document.getElementById('contentArea');try{if(id==='dashboard')area.innerHTML=renderDashboard();else if(id==='products')area.innerHTML=renderProducts();else if(id==='pos')area.innerHTML=renderPOS();else if(id==='grn')area.innerHTML=renderGRN();else if(id==='purchasing')area.innerHTML=renderPO();else if(id==='settings')area.innerHTML=renderFullSettings();else area.innerHTML=`<div class="bg-slate-900 p-6 rounded-2xl"><h2 class="text-xl font-bold">${id.toUpperCase()}</h2><p class="text-slate-400 mt-2">Module ${id} - Use Dashboard/Products/GRN/Settings for now.</p><button onclick="renderModule('settings')" class="mt-4 bg-blue-600 px-4 py-2 rounded">Go to FULL Settings</button></div>`;}catch(e){area.innerHTML=`<div class="bg-red-900/30 border border-red-600 p-6 rounded-2xl"><h2 class="font-bold">⚠️ Error: ${e.message}</h2><pre class="text-xs mt-2">${e.stack}</pre><button onclick="clearCache()" class="mt-3 bg-red-600 px-4 py-2 rounded">Clear Cache & Reload</button></div>`;}if(window.innerWidth<1024)document.getElementById('sidebar').classList.add('hidden');}
function renderDashboard(){const stockVal=products.reduce((s,p)=>s+(p.stock*p.cost),0);const stockRetail=products.reduce((s,p)=>s+(p.stock*p.price),0);const totalSales=pos.reduce((s,r)=>s+r.total,0);const totalCOGS=pos.reduce((s,r)=>s+r.cogs,0);const profit=totalSales-totalCOGS;return `<div class="space-y-4"><div class="flex justify-between items-center"><h1 class="text-2xl font-black">DASHBOARD - ${settings.shopCode} - ${settings.currency}</h1><div class="text-xs">${new Date().toLocaleString()}</div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="bg-slate-900 p-4 rounded-2xl border border-slate-800"><div class="text-[11px] text-slate-400">Stock Value (Cost)</div><div class="text-xl font-black">$${stockVal.toFixed(2)}</div><div class="text-[10px] text-slate-500">Opening + Received - Sold</div></div><div class="bg-slate-900 p-4 rounded-2xl border border-slate-800"><div class="text-[11px] text-slate-400">Stock Retail</div><div class="text-xl font-black">$${stockRetail.toFixed(2)}</div></div><div class="bg-slate-900 p-4 rounded-2xl border border-slate-800"><div class="text-[11px] text-slate-400">Net Sales</div><div class="text-xl font-black">$${totalSales.toFixed(2)}</div><div class="text-[10px]">Profit = Net Sales - COGS</div></div><div class="bg-slate-900 p-4 rounded-2xl border border-emerald-800 bg-emerald-950/20"><div class="text-[11px] text-emerald-400">Gross Profit</div><div class="text-xl font-black text-emerald-400">$${profit.toFixed(2)}</div></div></div><div class="grid grid-cols-3 lg:grid-cols-6 gap-2"><button onclick="renderModule('pos')" class="bg-blue-600 p-3 rounded-xl font-bold">+ New Sale</button><button onclick="renderModule('products')" class="bg-slate-800 p-3 rounded-xl">+ Add Product</button><button onclick="renderModule('purchasing')" class="bg-slate-800 p-3 rounded-xl">Purchase Order</button><button onclick="renderModule('grn')" class="bg-emerald-600 p-3 rounded-xl">Receive Stock</button><button onclick="renderModule('expenses')" class="bg-slate-800 p-3 rounded-xl">Record Expense</button><button onclick="renderModule('reports')" class="bg-slate-800 p-3 rounded-xl">View Reports</button></div><div class="bg-slate-900 rounded-2xl p-4 border border-slate-800"><h3 class="font-bold mb-2">Products (${products.length}) - With Product Codes</h3><div class="overflow-x-auto"><table class="w-full text-[12px]"><tr class="text-slate-500"><th class="text-left">Code</th><th>Name</th><th>Stock</th><th>Cost</th><th>Price</th></tr>${products.map(p=>`<tr class="border-t border-slate-800"><td class="font-mono">${p.code}</td><td>${p.name}</td><td class="${p.stock<=settings.lowStock?'text-red-400 font-bold':''}">${p.stock}</td><td>$${p.cost}</td><td>$${p.price}</td></tr>`).join('')}</table></div></div></div>`;}
function renderProducts(){return `<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800"><div class="flex justify-between items-center mb-3"><h2 class="font-black">2. Products PRD - Full Codes</h2><button onclick="addProductPrompt()" class="bg-blue-600 px-4 py-2 rounded-xl font-bold">+ Add Product</button></div><div class="overflow-x-auto"><table class="w-full text-[12px]"><tr class="text-slate-400"><th class="text-left p-2">Code</th><th class="text-left">Name</th><th>Cat</th><th>Stock</th><th>Cost</th><th>Price</th><th>Action</th></tr>${products.map((p,i)=>`<tr class="border-t border-slate-800"><td class="p-2 font-mono">${p.code}</td><td>${p.name}</td><td>${p.cat}</td><td>${p.stock}</td><td>$${p.cost}</td><td>$${p.price}</td><td><button onclick="deleteProd(${i})" class="text-red-400">Del</button></td></tr>`).join('')}</table></div><div class="mt-3 text-[11px] text-slate-500">Tip: Product Code is what you scan/type in GRN. Example: STOVE001, PRD000125. Code must be unique.</div></div>`;}
function addProductPrompt(){const code=prompt('Product Code (e.g. STOVE001):');if(!code)return;if(products.find(p=>p.code.toLowerCase()===code.toLowerCase())){alert('Code already exists!');return;}const name=prompt('Product Name:','New Product');const cat=prompt('Category:','General');const cost=parseFloat(prompt('Cost:','5')||'0');const price=parseFloat(prompt('Price:','10')||'0');const stock=parseInt(prompt('Opening Stock:','0')||'0');products.push({code:code.toUpperCase(),name:name||code,cat:cat||'General',cost,price,stock,reorder:settings.lowStock});saveAll();renderModule('products');}
function deleteProd(i){if(confirm('Delete?')){products.splice(i,1);saveAll();renderModule('products');}}
function renderPOS(){const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);return `<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 bg-slate-900 p-4 rounded-2xl border border-slate-800"><h2 class="font-black mb-2">1. POS / New Sale - ${settings.shopCode}</h2><input id="posSearch" oninput="filterPOS()" placeholder="Type product code or name (e.g. PRD000125, STOVE001)" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mb-2"><div id="posList" class="grid grid-cols-1 gap-1 max-h-[300px] overflow-y-auto">${products.map((p,idx)=>`<button onclick="addToCart(${idx})" class="text-left p-2 bg-slate-800 rounded flex justify-between"><span><b class="font-mono">${p.code}</b> - ${p.name} (${p.stock})</span><span>$${p.price}</span></button>`).join('')}</div></div><div class="bg-slate-900 p-4 rounded-2xl border border-slate-800"><h3 class="font-bold">Cart (${posCart.length})</h3><div class="mt-2 space-y-1 text-[13px]">${posCart.map((c,i)=>`<div class="flex justify-between"><span>${c.code} x${c.qty}</span><span>$${(c.qty*c.price).toFixed(2)} <button onclick="posCart.splice(${i},1);renderModule('pos')" class="text-red-400 ml-2">x</button></span></div>`).join('')||'<div class="text-slate-500">Empty</div>'}</div><div class="mt-3 pt-3 border-t border-slate-700 font-black">Total: $${total.toFixed(2)}<br><span class="text-[11px] font-normal text-slate-400">ZWG: $${(total*settings.usdToZwg).toFixed(2)} @ ${settings.usdToZwg}</span></div><button onclick="checkout()" class="w-full mt-3 bg-emerald-600 p-3 rounded-xl font-bold">Complete Sale</button></div></div>`;}
function filterPOS(){const q=document.getElementById('posSearch').value.toLowerCase();document.getElementById('posList').innerHTML=products.filter(p=>p.code.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)).map(p=>{const idx=products.indexOf(p);return `<button onclick="addToCart(${idx})" class="text-left p-2 bg-slate-800 rounded flex justify-between"><span><b class="font-mono">${p.code}</b> - ${p.name} (${p.stock})</span><span>$${p.price}</span></button>`;}).join('');}
function addToCart(idx){const p=products[idx];if(p.stock<=0&&!settings.allowNegative){alert('Out of stock!');return;}const existing=posCart.find(c=>c.code===p.code);if(existing)existing.qty++;else posCart.push({code:p.code,name:p.name,price:p.price,qty:1,cost:p.cost});renderModule('pos');}
function checkout(){if(posCart.length===0)return;const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);const cogs=posCart.reduce((s,i)=>s+i.qty*i.cost,0);posCart.forEach(c=>{const pr=products.find(pp=>pp.code===c.code);if(pr)pr.stock-=c.qty;});pos.push({id:'S'+Date.now(),items:[...posCart],total,cogs,date:new Date().toISOString()});posCart=[];saveAll();alert('Sale Complete! Profit $'+(total-cogs).toFixed(2));renderModule('dashboard');}
function renderPO(){return `<div class="bg-slate-900 p-4 rounded-2xl"><h2 class="font-black">5. Purchasing - PO</h2><p class="text-[12px] text-slate-400 mt-2">Create PO then go to GRN to receive using Product Code.</p><button onclick="alert('PO module - Use Products + GRN for now')" class="mt-3 bg-slate-800 px-4 py-2 rounded">+ New PO</button></div>`;}
function renderGRN(){return `<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800"><div class="flex justify-between"><h2 class="font-black">6. GRN - Receive Goods - WITH PRODUCT CODE INPUT (FIXED)</h2><button onclick="openGRN()" class="bg-emerald-600 px-4 py-2 rounded-xl font-bold">+ Receive Stock</button></div><div class="mt-3 overflow-x-auto"><table class="w-full text-[12px]"><tr class="text-slate-400"><th class="text-left">Date</th><th>Code</th><th>Product</th><th>Qty</th><th>Cost</th></tr>${grns.slice(-20).reverse().map(g=>`<tr class="border-t border-slate-800"><td>${new Date(g.date).toLocaleString()}</td><td class="font-mono">${g.code}</td><td>${g.name}</td><td>+${g.qty}</td><td>$${g.cost}</td></tr>`).join('')||'<tr><td colspan=5 class="text-slate-500 p-3">No receipts yet - Tap + Receive Stock and type product code!</td></tr>'}</table></div><div class="mt-4 bg-slate-800 p-3 rounded-xl text-[11px]"><b>NEW in this upgrade - Your problem SOLVED:</b><br>1. You can type Product Code manually (e.g. STOVE001)<br>2. If code not found, it will auto-create product<br>3. No more forced dropdown only</div></div>`;}
function openGRN(){const code=prompt('Enter Product CODE to receive (must exist or will create):\nExample: PRD000125, STOVE001, FRIDGE001\n\nYour products:\n'+products.map(p=>p.code+' - '+p.name).join('\n'));if(!code)return;let prod=products.find(p=>p.code.toLowerCase()===code.toLowerCase());if(!prod){if(confirm('Code '+code+' not found. Create new product with this code?')){const name=prompt('Product Name for '+code+':',code);const cost=parseFloat(prompt('Cost for '+code+':','10')||'10');const price=parseFloat(prompt('Price for '+code+':','15')||'15');prod={code:code.toUpperCase(),name:name||code,cat:'General',cost,price,stock:0,reorder:settings.lowStock};products.push(prod);}else return;}const qty=parseInt(prompt('Qty received for '+prod.code+' - '+prod.name+':','1')||'0');const newCostStr=prompt('New Cost? Leave blank to keep $'+prod.cost+':','');if(newCostStr&&!isNaN(parseFloat(newCostStr)))prod.cost=parseFloat(newCostStr);prod.stock+=qty;grns.push({code:prod.code,name:prod.name,qty,cost:prod.cost,date:new Date().toISOString()});saveAll();renderModule('grn');alert('Received '+qty+' x '+prod.code+'. New Stock: '+prod.stock);}
function renderFullSettings(){return `<div class="space-y-4"><h1 class="text-2xl font-black">SETTINGS - SHOP001-HRE - FULL PROFESSIONAL (9 Sections)</h1>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><h3 class="font-black text-blue-400">1. Shop Info</h3><div class="grid lg:grid-cols-2 gap-3 mt-3"><div><label class="text-[11px] text-slate-400">Shop Name</label><input id="s_shopName" value="${settings.shopName}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Shop Code</label><input id="s_shopCode" value="${settings.shopCode}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Phone</label><input id="s_phone" value="${settings.phone}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Address</label><input id="s_address" value="${settings.address}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">TIN Number</label><input id="s_tin" value="${settings.tin}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">VAT Number</label><input id="s_vatNum" value="${settings.vatNum}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div></div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><h3 class="font-black text-emerald-400">2. Financial</h3><div class="grid lg:grid-cols-3 gap-3 mt-3"><div><label class="text-[11px] text-slate-400">Currency</label><select id="s_currency" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option ${settings.currency==='USD / ZWG'?'selected':''}>USD / ZWG</option><option ${settings.currency==='USD'?'selected':''}>USD</option><option ${settings.currency==='ZWG'?'selected':''}>ZWG</option></select></div><div><label class="text-[11px] text-slate-400">USD to ZWG Rate</label><input id="s_rate" type="number" step="0.01" value="${settings.usdToZwg}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">VAT Rate %</label><input id="s_vat" type="number" value="${settings.vat}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">VAT Inclusive?</label><select id="s_vatInc" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option value="false" ${!settings.vatInclusive?'selected':''}>Exclusive</option><option value="true" ${settings.vatInclusive?'selected':''}>Inclusive</option></select></div></div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><h3 class="font-black text-amber-400">3. Inventory Settings</h3><div class="grid lg:grid-cols-3 gap-3 mt-3"><div><label class="text-[11px] text-slate-400">Low-stock Threshold</label><input id="s_low" type="number" value="${settings.lowStock}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Allow Negative Stock?</label><select id="s_neg" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option value="false" ${!settings.allowNegative?'selected':''}>No</option><option value="true" ${settings.allowNegative?'selected':''}>Yes</option></select></div><div><label class="text-[11px] text-slate-400">Cost Method</label><select id="s_costMethod" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option ${settings.costMethod==='Average'?'selected':''}>Average</option><option ${settings.costMethod==='FIFO'?'selected':''}>FIFO</option></select></div><div><label class="text-[11px] text-slate-400">Barcode Scanner</label><select id="s_barcode" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option value="true" ${settings.barcode?'selected':''}>Enabled</option><option value="false" ${!settings.barcode?'selected':''}>Disabled</option></select></div></div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><h3 class="font-black text-purple-400">4. Sales / POS</h3><div class="grid lg:grid-cols-3 gap-3 mt-3"><div><label class="text-[11px] text-slate-400">Discount Allowed?</label><select id="s_discAllow" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option value="true" ${settings.discountAllowed?'selected':''}>Yes</option><option value="false" ${!settings.discountAllowed?'selected':''}>No</option></select></div><div><label class="text-[11px] text-slate-400">Max Discount %</label><input id="s_maxDisc" type="number" value="${settings.maxDiscount}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Auto Print Receipt?</label><select id="s_autoPrint" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option value="false" ${!settings.autoPrint?'selected':''}>No</option><option value="true" ${settings.autoPrint?'selected':''}>Yes</option></select></div><div><label class="text-[11px] text-slate-400">Credit Sales?</label><select id="s_credit" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option value="true" ${settings.creditSales?'selected':''}>Yes</option><option value="false" ${!settings.creditSales?'selected':''}>No</option></select></div><div><label class="text-[11px] text-slate-400">Show Customer on Receipt?</label><select id="s_showCust" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option value="true" ${settings.showCustomer?'selected':''}>Yes</option><option value="false" ${!settings.showCustomer?'selected':''}>No</option></select></div></div></div>
<div class="bg-slate-900 border border-red-900/50 rounded-2xl p-4"><h3 class="font-black text-red-400">5. ZIMRA FDMS - Fiscalisation</h3><div class="grid lg:grid-cols-2 gap-3 mt-3"><div><label class="text-[11px] text-slate-400">ZIMRA Status</label><select id="s_zimra" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option ${settings.zimraStatus==='OFF'?'selected':''}>OFF</option><option ${settings.zimraStatus==='ON'?'selected':''}>ON</option></select></div><div><label class="text-[11px] text-slate-400">Device ID</label><input id="s_zimraId" value="${settings.zimraDeviceId}" placeholder="e.g. ZIMRA123456" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Model Name</label><input id="s_zimraModel" value="${settings.zimraModel}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Model Version</label><input id="s_zimraVer" value="${settings.zimraModelVer}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Fiscal Open</label><input id="s_fOpen" type="time" value="${settings.fiscalOpen}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Fiscal Close</label><input id="s_fClose" type="time" value="${settings.fiscalClose}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div></div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><h3 class="font-black text-cyan-400">6. Receipt Customization</h3><div class="grid lg:grid-cols-1 gap-3 mt-3"><div><label class="text-[11px] text-slate-400">Header Message</label><input id="s_rHeader" value="${settings.receiptHeader}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">Footer Message (ZIMRA Footer)</label><input id="s_rFooter" value="${settings.receiptFooter}" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"></div><div><label class="text-[11px] text-slate-400">QR Code on Receipt?</label><select id="s_qr" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-1"><option value="true" ${settings.qr?'selected':''}>Yes</option><option value="false" ${!settings.qr?'selected':''}>No</option></select></div></div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><h3 class="font-black text-slate-300">7-9. System / Backup / Security</h3><div class="flex flex-wrap gap-2 mt-3"><button onclick="saveFullSettings()" class="bg-blue-600 px-6 py-3 rounded-xl font-black">💾 Save All Settings</button><button onclick="downloadBackup()" class="bg-emerald-600 px-6 py-3 rounded-xl font-bold">⬇ Download Backup</button><button onclick="document.getElementById('restoreInput2').click()" class="bg-slate-700 px-6 py-3 rounded-xl">⬆ Restore Backup</button><input id="restoreInput2" type="file" accept=".json" class="hidden" onchange="restoreBackup(event)"><button onclick="clearCache()" class="bg-amber-600 px-6 py-3 rounded-xl">Fix Black Screen</button><button onclick="if(confirm('Reset ALL demo data?')){localStorage.clear();location.reload();}" class="bg-red-600 px-6 py-3 rounded-xl">Reset Demo</button></div><div class="mt-3 text-[11px] text-slate-500">Backup includes products, sales, GRNs, settings. Download daily.</div></div></div>`;}
function saveFullSettings(){settings.shopName=document.getElementById('s_shopName').value;settings.shopCode=document.getElementById('s_shopCode').value;settings.phone=document.getElementById('s_phone').value;settings.address=document.getElementById('s_address').value;settings.tin=document.getElementById('s_tin').value;settings.vatNum=document.getElementById('s_vatNum').value;settings.currency=document.getElementById('s_currency').value;settings.usdToZwg=parseFloat(document.getElementById('s_rate').value)||36.5;settings.vat=parseFloat(document.getElementById('s_vat').value)||15;settings.vatInclusive=document.getElementById('s_vatInc').value==='true';settings.lowStock=parseInt(document.getElementById('s_low').value)||10;settings.allowNegative=document.getElementById('s_neg').value==='true';settings.costMethod=document.getElementById('s_costMethod').value;settings.barcode=document.getElementById('s_barcode').value==='true';settings.discountAllowed=document.getElementById('s_discAllow').value==='true';settings.maxDiscount=parseInt(document.getElementById('s_maxDisc').value)||10;settings.autoPrint=document.getElementById('s_autoPrint').value==='true';settings.creditSales=document.getElementById('s_credit').value==='true';settings.showCustomer=document.getElementById('s_showCust').value==='true';settings.zimraStatus=document.getElementById('s_zimra').value;settings.zimraDeviceId=document.getElementById('s_zimraId').value;settings.zimraModel=document.getElementById('s_zimraModel').value;settings.zimraModelVer=document.getElementById('s_zimraVer').value;settings.fiscalOpen=document.getElementById('s_fOpen').value;settings.fiscalClose=document.getElementById('s_fClose').value;settings.receiptHeader=document.getElementById('s_rHeader').value;settings.receiptFooter=document.getElementById('s_rFooter').value;settings.qr=document.getElementById('s_qr').value==='true';saveAll();renderMenu();alert('✅ FULL Settings Saved! Shop: '+settings.shopCode+' ZIMRA: '+settings.zimraStatus+' Rate: '+settings.usdToZwg);renderModule('settings');}
function downloadBackup(){const data={products,pos,grns,settings,exported:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SmartPOS-Backup-'+settings.shopCode+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(ev){try{const data=JSON.parse(ev.target.result);if(data.products)products=data.products;if(data.pos)pos=data.pos;if(data.grns)grns=data.grns;if(data.settings)settings=data.settings;saveAll();alert('✅ Backup Restored!');location.reload();}catch(err){alert('Invalid backup: '+err.message);}};reader.readAsText(file);}
window.onerror=function(msg,url,line){const area=document.getElementById('contentArea');if(area){area.innerHTML+=`<div class="bg-red-900/40 border border-red-600 p-3 rounded-xl mt-3 text-[11px]">⚠️ JS Error: ${msg} @ ${line} <button onclick="clearCache()" class="ml-2 bg-red-600 px-2 py-1 rounded">Clear & Reload</button></div>`;}return false;}
</script></body></html>
