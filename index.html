HTML

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c35">
<title>PROMAX SmartPOS</title>
<style>
:root{--navy:#101c35;--navy2:#203653;--green:#16a34a;--blue:#2563eb;--bg:#f1f5f9;--line:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#172033;font:14px Arial,system-ui}
button,input,select{font:inherit}
button{cursor:pointer}
header{height:62px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:10}
.brand{font-size:19px;font-weight:900}.brand span{color:#4ade80}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.layout{display:flex;min-height:calc(100vh - 62px)}
aside{width:235px;background:var(--navy);padding:12px 10px;flex-shrink:0}
main{padding:17px;width:100%;max-width:1500px;margin:auto;min-width:0}
.navtitle{font-size:10px;color:#8295b5;font-weight:bold;letter-spacing:1px;padding:13px 10px 5px}
.nav{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:8px;margin:2px 0;font-weight:bold}
.nav:hover,.nav.active{background:#263957;color:white}
.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--green);color:white;font-weight:bold}
.btn.blue{background:var(--blue)}
.btn.light{background:#eaf0f7;color:#24334d}
.btn.red{background:#fee2e2;color:#991b1b}
.btn.small{padding:7px 9px;font-size:12px}
.card{background:white;border:1px solid #e8edf4;border-radius:12px;padding:15px;margin-bottom:13px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:2px 0 16px}
h1{font-size:23px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub,.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{font-size:12px;color:var(--muted);font-weight:bold}
.kpi strong{display:block;color:#172033;font-size:22px;margin-top:7px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:bold;color:#475569;margin-bottom:5px}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:white;color:#172033;min-width:0}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th{text-align:left;background:#f8fafc;color:#64748b;font-size:11px;padding:10px}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.empty{text-align:center;padding:22px;color:#94a3b8}
.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#dcfce7;color:#166534;font-size:10px;font-weight:bold}
.pill.low{background:#fef3c7;color:#92400e}
.pill.bad{background:#fee2e2;color:#991b1b}
.hidden{display:none!important}
.login{max-width:420px;margin:7vh auto}
.posgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.productgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:55vh;overflow:auto}
.tile{border:1px solid var(--line);border-radius:9px;padding:12px;background:white;text-align:left}
.tile b{display:block}
.cartline{display:grid;grid-template-columns:1fr 65px 80px 28px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.total{display:flex;justify-content:space-between;padding:7px 0}
.total.big{font-size:20px;font-weight:bold;border-top:1px solid var(--line);margin-top:8px}
.mobilemenu{display:none}
#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:11px 16px;border-radius:9px;z-index:100;display:none;max-width:90%}
.search{max-width:300px}

/* SETTINGS NAVIGATION */
.settings-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px}
.settings-nav{background:white;border:1px solid var(--line);border-radius:12px;padding:9px;height:max-content}
.settings-nav button{display:block;width:100%;text-align:left;border:0;background:white;padding:13px;border-radius:8px;margin-bottom:5px;color:#334155;font-weight:bold}
.settings-nav button:hover,.settings-nav button.active{background:#eaf0f7;color:#1d4ed8}
.settings-content{min-width:0}
.settings-section{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}
.settings-description{color:var(--muted);margin:0 0 15px}
.settings-save{margin-top:8px}
.settings-nav button span{display:inline-block;width:27px}
.settings-mobile-title{display:none}

/* GRN */
.grn-product-panel{background:#f8fafc;border:1px solid var(--line);padding:13px;border-radius:10px;margin:12px 0}
.grn-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.grn-line-info{min-width:0}
.grn-line-info small{display:block;color:var(--muted);margin-top:4px}
.grn-summary{background:#f8fafc;padding:12px;border-radius:9px;margin:12px 0}
@media(max-width:850px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .posgrid{grid-template-columns:1fr}
}
@media(max-width:620px){
 .mobilemenu{display:inline-block}
 aside{display:none;position:fixed;z-index:20;top:62px;bottom:0;left:0;width:260px;overflow:auto}
 aside.open{display:block}
 .layout{display:block}
 main{padding:12px}
 .grid2,.formgrid{grid-template-columns:1fr}
 .grid{gap:7px}
 .card{padding:12px}
 .settings-layout{grid-template-columns:1fr}
 .settings-nav{display:flex;overflow-x:auto;gap:5px}
 .settings-nav button{width:auto;white-space:nowrap;margin:0;padding:11px}
 .settings-nav button span{width:auto;margin-right:5px}
 .settings-mobile-title{display:block}
}
@media print{
 body *{visibility:hidden!important}
 #printArea,#printArea *{visibility:visible!important}
 #printArea{position:absolute;inset:0;background:white;padding:15px}
}
</style>
</head>
<body>

<header>
 <div class="toolbar">
  <button class="btn light mobilemenu" onclick="toggleNav()">☰</button>
  <div class="brand">PROMAX <span>SmartPOS</span></div>
 </div>
 <div class="toolbar">
  <span id="status">● OFFLINE</span>
  <span id="who"></span>
  <button class="btn light small" onclick="logout()">Sign out</button>
 </div>
</header>

<div id="loginView" class="card login">
 <h1>PROMAX SmartPOS</h1>
 <p class="sub">Secure cloud back office</p>
 <div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username"></div>
 <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
 <button class="btn" style="width:100%" onclick="login()">Sign In</button>
 <p class="muted">Staff need a Firebase Authentication account and matching profile under users/{uid}.</p>
</div>

<div id="appView" class="layout hidden">
<aside id="sidebar">
 <div class="navtitle">WORKSPACE</div>
 <button class="nav active" data-page="dashboard" onclick="go('dashboard')">▦ Dashboard</button>
 <button class="nav" data-page="pos" onclick="go('pos')">🛒 POS / New Sale</button>
 <div class="navtitle">INVENTORY & SALES</div>
 <button class="nav" data-page="products" onclick="go('products')">📦 Products</button>
 <button class="nav" data-page="purchasing" onclick="go('purchasing')">🛍 Purchase Orders</button>
 <button class="nav" data-page="grn" onclick="go('grn')">📥 Goods Received</button>
 <button class="nav" data-page="stock" onclick="go('stock')">📋 Stock Control</button>
 <button class="nav" data-page="sales" onclick="go('sales')">🧾 Sales & Receipts</button>
 <div class="navtitle">PEOPLE & FINANCE</div>
 <button class="nav" data-page="customers" onclick="go('customers')">👥 Customers</button>
 <button class="nav" data-page="suppliers" onclick="go('suppliers')">🏭 Suppliers</button>
 <button class="nav" data-page="expenses" onclick="go('expenses')">💸 Expenses & Cash</button>
 <button class="nav" data-page="reports" onclick="go('reports')">📈 Reports</button>
 <div class="navtitle">ADMINISTRATION</div>
 <button class="nav" data-page="users" onclick="go('users')">👤 Users & Roles</button>
 <button class="nav" data-page="branches" onclick="go('branches')">🏢 Branches</button>
 <button class="nav" data-page="audit" onclick="go('audit')">📜 Audit Log</button>
 <button class="nav" data-page="settings" onclick="go('settings')">⚙ Settings & Backup</button>
</aside>
<main id="main"></main>
</div>
<div id="toast"></div>
<div id="printArea" class="hidden"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
'use strict';

const firebaseConfig={
 apiKey:'AIzaSyATD1DELs0gmtnS_iG8gcA2UvqwtQDF2A4',
 authDomain:'smartpos-83781.firebaseapp.com',
 databaseURL:'https://smartpos-83781-default-rtdb.firebaseio.com',
 projectId:'smartpos-83781'
};

const SUPER_ADMIN_UID='F7lqLpgdVrfh2AEmemktCYNwn0R2';
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const cloud=firebase.database();

let user=null,profile=null,shopId=null,shopData={},branches={};
let staffCache=[],auditCache=[],page='dashboard',cart=[];
let settingsTab='general';
let grnCart=[];

const $=id=>document.getElementById(id);
const val=id=>$(id)?.value??'';
const num=x=>Number(x)||0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const isRoot=()=>user?.uid===SUPER_ADMIN_UID;
const records=k=>Object.entries(shopData[k]||{}).map(([id,x])=>({id,...x}));
const path=k=>'shops/'+shopId+'/'+k;
const key=()=>cloud.ref().push().key;

function money(x){
 let c=shopData.settings?.currency||'USD';
 return(c==='USD'?'$':c+' ')+num(x).toFixed(2);
}
function toast(s){
 $('toast').textContent=s;
 $('toast').style.display='block';
 setTimeout(()=>$('toast').style.display='none',3000);
}
function toggleNav(){$('sidebar').classList.toggle('open')}
function dateNow(){return new Date().toISOString().slice(0,10)}

function guardSilent(p){
 return isRoot()||profile?.role==='ADMIN'||
 (profile?.active!==false&&profile?.permissions?.[p]===true);
}
function guard(p){
 if(guardSilent(p))return true;
 toast('Access denied');return false;
}

async function login(){
 try{
  await auth.signInWithEmailAndPassword(val('email').trim(),val('password'));
 }catch(e){toast(e.message)}
}
async function logout(){await auth.signOut()}

auth.onAuthStateChanged(async u=>{
 user=u;
 if(!u){
  profile=null;
  $('loginView').classList.remove('hidden');
  $('appView').classList.add('hidden');
  $('who').textContent='';
  $('status').textContent='● SIGNED OUT';
  return;
 }
 try{
  let s=await cloud.ref('users/'+u.uid).once('value');
  profile=s.val();
  if(isRoot()&&!profile)profile={name:'Super Administrator',role:'ADMIN',active:true};
  if(!profile||profile.active===false)
   throw Error('Staff profile missing or disabled. Ask administrator.');
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('who').textContent=profile.name||u.email;
  await loadBranches();
 }catch(e){
  toast(e.message);await auth.signOut();
 }
});

async function loadBranches(){
 let s=await cloud.ref('branches').once('value');
 branches=s.val()||{};
 if(isRoot()||profile.role==='ADMIN')
  shopId=profile.defaultShop||Object.keys(branches)[0]||'';
 else{
  let a=profile.branches||{};
  shopId=profile.defaultShop||Object.keys(a).find(k=>a[k])||'';
 }
 if(!shopId)throw Error('No branch assigned. Create a branch or assign this user to one.');
 await loadShop();
 await loadAdminData();
 $('status').textContent='● CLOUD CONNECTED';
 render();
}

async function loadShop(){
 let s=await cloud.ref('shops/'+shopId).once('value');
 shopData=s.val()||{};
 ['products','sales','customers','suppliers','expenses','orders','grns','adjustments']
 .forEach(k=>shopData[k]=shopData[k]||{});
 shopData.settings=shopData.settings||{
  shopName:branches[shopId]?.name||shopId,
  currency:'USD',tax:0,lowStock:5
 };
}

async function loadAdminData(){
 if(!isRoot()&&profile.role!=='ADMIN')return;
 let [u,a]=await Promise.all([
  cloud.ref('users').once('value'),
  cloud.ref('audit').once('value')
 ]);
 staffCache=Object.entries(u.val()||{}).map(([uid,x])=>({uid,...x}));
 auditCache=Object.entries(a.val()||{}).map(([id,x])=>({id,...x}))
 .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

async function audit(action,detail=''){
 await cloud.ref('audit/'+key()).set({
  date:new Date().toISOString(),
  uid:user.uid,
  user:profile?.name||user.email,
  shop:shopId,
  action,detail
 });
}

async function switchShop(id){
 if(!isRoot()&&profile.role!=='ADMIN'&&!profile.branches?.[id])
  return toast('Branch not assigned');
 shopId=id;cart=[];
 await loadShop();
 await audit('Branch selected',id);
 render();
}

function branchPicker(){
 if(!isRoot()&&profile.role!=='ADMIN')return '';
 return `<select onchange="switchShop(this.value)" style="max-width:210px">
 ${Object.entries(branches).map(([id,b])=>
 `<option value="${esc(id)}" ${id===shopId?'selected':''}>${esc(b.name||id)}</option>`
 ).join('')}</select>`;
}

function permission(p){
 if(p==='dashboard')return'reports';
 if(p==='pos')return'pos';
 if(p==='sales')return'sales';
 if(['products','purchasing','grn','stock'].includes(p))return'stock';
 if(['users','branches','audit','settings'].includes(p))return'admin';
 if(p==='reports')return'reports';
 if(['customers','suppliers','expenses'].includes(p))return'manage';
 return'manage';
}

function go(p){
 if(!guard(permission(p)))return;
 page=p;
 $('sidebar').classList.remove('open');
 render();
}

function render(){
 document.querySelectorAll('.nav').forEach(b=>{
  let p=b.dataset.page;
  b.classList.toggle('hidden',!guardSilent(permission(p)));
  b.classList.toggle('active',p===page);
 });
 if(!guardSilent(permission(page)))page='pos';
 $('main').innerHTML=
 `<div class="toolbar" style="justify-content:space-between;margin-bottom:12px">
 <b>${esc(branches[shopId]?.name||shopId)}</b>${branchPicker()}</div>`+
 (pages[page]||dashboard)();
}

function head(t,d,a=''){
 return `<div class="pagehead"><div><h1>${t}</h1><p class="sub">${d}</p></div>
 <div class="toolbar">${a}</div></div>`;
}
function kpi(t,x){return `<div class="card kpi">${t}<strong>${x}</strong></div>`}
function table(h,rows,empty='No records found'){
 return `<div class="tablewrap"><table><thead><tr>
 ${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
 ${rows||`<tr><td colspan="${h.length}" class="empty">${empty}</td></tr>`}
 </tbody></table></div>`;
}
function field(l,id,type='text',v=''){
 return `<div class="field"><label>${l}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`;
}
function selectField(l,id,opts){
 return `<div class="field"><label>${l}</label><select id="${id}">${opts}</select></div>`;
}

/* DASHBOARD */

function dashboard(){
 let ps=records('products'),ss=records('sales');
 let rev=ss.reduce((a,s)=>a+num(s.total),0);
 let stock=ps.reduce((a,p)=>a+num(p.qty),0);
 let low=ps.filter(p=>num(p.qty)<=num(shopData.settings.lowStock||5)).length;
 return head('Dashboard','Branch performance and activity')+
 `<div class="grid">
 ${kpi('TOTAL SALES',money(rev))}
 ${kpi('TRANSACTIONS',ss.length)}
 ${kpi('PRODUCTS',ps.length)}
 ${kpi('LOW STOCK ITEMS',low)}
 </div>
 <div class="grid2">
 <div class="card"><h2>Stock overview</h2>
 <p>Total units on hand: <b>${stock}</b></p>
 <p>Low stock products: <b>${low}</b></p>
 <button class="btn blue" onclick="go('stock')">Open stock control</button></div>
 <div class="card"><h2>Quick actions</h2>
 <div class="toolbar">
 <button class="btn" onclick="go('pos')">New sale</button>
 <button class="btn blue" onclick="go('grn')">Receive stock</button>
 <button class="btn light" onclick="go('products')">Add product</button>
 </div><p class="muted">ZIMRA fiscalisation is not connected.</p></div>
 </div>
 <div class="card"><h2>Recent sales</h2>${salesTable(ss.slice(-8).reverse())}</div>`;
}

function salesTable(arr){
 return table(['Receipt','Date','Cashier','Payment','Total'],
 arr.map(s=>`<tr><td>${esc(s.receipt||s.id)}</td>
 <td>${esc(s.date||'')}</td><td>${esc(s.cashier||'')}</td>
 <td>${esc(s.payment||'')}</td><td>${money(s.total)}</td></tr>`).join(''));
}

/* PRODUCTS */

function products(){
 let rows=records('products').map(p=>`<tr>
 <td>${esc(p.code)}</td><td>${esc(p.name)}</td>
 <td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${num(p.qty)}</td>
 <td><button class="btn light small" onclick="editProduct('${p.id}')">Edit</button>
 <button class="btn red small" onclick="deleteRecord('products','${p.id}')">Delete</button></td>
 </tr>`).join('');
 return head('Products','Product catalogue and selling prices',
 `<button class="btn" onclick="productForm()">+ Add product</button>`)+
 `<div class="card"><input class="search" placeholder="Search products..." oninput="filterTable(this)">
 ${table(['Code','Product','Cost','Selling price','Qty','Actions'],rows)}</div>`;
}

function productForm(id=''){
 let p=shopData.products?.[id]||{};
 $('main').innerHTML=head(id?'Edit product':'Add product','Product details')+
 `<div class="card"><div class="formgrid">
 ${field('Product code','pcode','text',p.code||'')}
 ${field('Product name','pname','text',p.name||'')}
 ${field('Cost price','pcost','number',p.cost??'')}
 ${field('Selling price','pprice','number',p.price??'')}
 ${field('Opening quantity','pqty','number',p.qty??0)}
 </div><button class="btn" onclick="saveProduct('${id}')">Save product</button>
 <button class="btn light" onclick="go('products')">Cancel</button></div>`;
}

async function saveProduct(id){
 let name=val('pname').trim(),code=val('pcode').trim();
 let cost=Number(val('pcost')),price=Number(val('pprice')),qty=Number(val('pqty'));
 if(!name||!code)return toast('Enter product name and code');
 if(!Number.isFinite(cost)||cost<0||!Number.isFinite(price)||price<0||!Number.isFinite(qty)||qty<0)
  return toast('Enter valid non-negative prices and quantity');
 if(records('products').some(p=>String(p.code).toLowerCase()===code.toLowerCase()&&p.id!==id))
  return toast('Product code already exists');
 let data={name,code,cost,price,qty,updatedAt:new Date().toISOString()};
 let ref=cloud.ref(path('products')+(id?'/'+id:''));
 if(id){
  data.qty=shopData.products[id].qty;
  await ref.update(data);
 }else{
  await ref.set(data);
 }
 await audit(id?'Product updated':'Product created',name);
 await loadShop();go('products');toast('Product saved');
}
function editProduct(id){productForm(id)}

async function deleteRecord(k,id){
 if(!confirm('Delete this record?'))return;
 await cloud.ref(path(k)+'/'+id).remove();
 await audit('Record deleted',k+'/'+id);
 await loadShop();render();
}

/* POS */

function pos(){
 let ps=records('products');
 let items=ps.filter(p=>num(p.qty)>0).map(p=>
 `<button class="tile" onclick="addCart('${p.id}')">
 <b>${esc(p.name)}</b><small>${esc(p.code)} · ${num(p.qty)} in stock</small>
 <strong>${money(p.price)}</strong></button>`).join('');
 return head('POS / New Sale','Cashier: '+esc(profile.name||user.email))+
 `<div class="posgrid"><div class="card">
 <input id="posSearch" placeholder="Search product name or code" oninput="searchTiles()">
 <div class="productgrid" id="productTiles">${items||'<p class="empty">No products in stock.</p>'}</div>
 </div><div class="card"><h2>Current sale</h2>
 <div id="cartLines">${cartHTML()}</div>
 <div class="total"><span>Subtotal</span><b>${money(cartTotal())}</b></div>
 <div class="total"><span>Tax</span><b>${money(cartTotal()*num(shopData.settings.tax)/100)}</b></div>
 <div class="total big"><span>TOTAL</span>
 <span>${money(cartTotal()*(1+num(shopData.settings.tax)/100))}</span></div>
 <div class="field"><label>Payment method</label><select id="payment">
 <option>Cash</option><option>Mobile Money</option><option>Card</option>
 <option>Bank Transfer</option><option>Credit</option></select></div>
 <button class="btn" style="width:100%" onclick="checkout()">Complete sale</button>
 <button class="btn light" style="width:100%;margin-top:7px" onclick="clearCart()">Clear cart</button>
 </div></div>`;
}

function searchTiles(){
 let q=val('posSearch').toLowerCase();
 document.querySelectorAll('#productTiles .tile').forEach(x=>
 x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)));
}
function addCart(id){
 let p=shopData.products[id];if(!p)return;
 let x=cart.find(c=>c.id===id);
 if(x){if(x.qty>=num(p.qty))return toast('Not enough stock');x.qty++}
 else cart.push({id,name:p.name,price:num(p.price),qty:1});
 render();
}
function cartTotal(){return cart.reduce((a,x)=>a+x.price*x.qty,0)}
function cartHTML(){
 return cart.length?cart.map(x=>
 `<div class="cartline"><span>${esc(x.name)}<br><small>${money(x.price)}</small></span>
 <input type="number" min="1" value="${x.qty}" onchange="setCartQty('${x.id}',this.value)">
 <b>${money(x.price*x.qty)}</b>
 <button class="btn red small" onclick="removeCart('${x.id}')">×</button></div>`
 ).join(''):'<p class="empty">Cart is empty</p>';
}
function setCartQty(id,q){

async function checkout(){
 if(!cart.length)return toast('Cart is empty');
 let lines=cart.map(x=>({...x}));
 for(let x of lines){
  let p=shopData.products[x.id];
  if(!p||num(p.qty)<x.qty)return toast('Stock changed. Refresh and try again.');
 }
 let subtotal=cartTotal(),tax=subtotal*num(shopData.settings.tax)/100,total=subtotal+tax;
 let id=key(),receipt='R-'+Date.now(),updates={};
 lines.forEach(x=>{
  updates[path('products')+'/'+x.id+'/qty']=num(shopData.products[x.id].qty)-x.qty;
 });
 let sale={
  receipt,date:new Date().toISOString(),
  cashier:profile.name||user.email,uid:user.uid,shop:shopId,
  payment:val('payment')||'Cash',subtotal,tax,total,items:lines
 };
 updates[path('sales')+'/'+id]=sale;
 try{
  await cloud.ref().update(updates);
  await audit('Sale completed',receipt+' '+money(total));
  cart=[];await loadShop();render();printReceipt(sale);
  toast('Sale completed');
 }catch(e){toast('Sale failed: '+e.message)}
}

function addNewGRNProduct(){
 let code=val('gnewcode').trim();
 let name=val('gnewname').trim();
 let cost=Number(val('gnewcost'));
 let sell=Number(val('gnewsell'));
 let qty=Number(val('gnewqty'));

 if(!code||!name)return toast('Enter product code and name');
 if(grnCodeExists(code))return toast('This product code already exists');
 if(!Number.isFinite(cost)||cost<0||
    !Number.isFinite(sell)||sell<0||
    !Number.isFinite(qty)||qty<=0)
  return toast('Enter valid prices and quantity');

 let id='NEW_'+key();
 grnCart.push({
  id,isNew:true,code,name,cost,sell,qty
 });
 renderGRNLines();
 $('gnewcode').value='';
 $('gnewname').value='';
 $('gnewcost').value='0';
 $('gnewsell').value='0';
 $('gnewqty').value='1';
 toast('New product added to GRN');
}

function addGRNLine(){
 let id=val('gproduct');
 let p=shopData.products[id];
 let qty=Number(val('gqty'));
 let cost=val('gcost')===''?num(p?.cost):Number(val('gcost'));
 let sell=val('gsell')===''?num(p?.price):Number(val('gsell'));

 if(!p)return toast('Select an existing product');
 if(!Number.isFinite(qty)||qty<=0||
    !Number.isFinite(cost)||cost<0||
    !Number.isFinite(sell)||sell<0)
  return toast('Enter valid quantity and prices');

 let existing=grnCart.find(x=>x.id===id);
 if(existing){
  existing.qty+=qty;
  existing.cost=cost;
  existing.sell=sell;
 }else{
  grnCart.push({
   id,isNew:false,code:p.code,name:p.name,qty,cost,sell
  });
 }
 renderGRNLines();
 $('gqty').value='1';
 $('gcost').value='';
 $('gsell').value='';
 toast('Product added to GRN');
}

function renderGRNLines(){
 let el=$('grnLines');
 if(!el)return;
 if(!grnCart.length){
  el.innerHTML='<p class="empty">No products added yet.</p>';
  $('grnSummary').innerHTML='';
  return;
 }
 el.innerHTML=grnCart.map((x,i)=>`
 <div class="grn-line">
  <div class="grn-line-info">
   <b>${esc(x.name)}</b>
   <small>${esc(x.code)} ${x.isNew?'<span class="pill">NEW PRODUCT</span>':''}</small>
   <small>Qty: ${x.qty} · Cost: ${money(x.cost)} · Selling: ${money(x.sell)}</small>
  </div>
  <div class="toolbar">
   <b>${money(x.qty*x.cost)}</b>
   <button class="btn red small" onclick="removeGRNLine(${i})">×</button>
  </div>
 </div>`).join('');
 let units=grnCart.reduce((a,x)=>a+x.qty,0);
 let total=grnCart.reduce((a,x)=>a+x.qty*x.cost,0);
 $('grnSummary').innerHTML=`
 <div class="grn-summary">
 <div class="total"><span>Product lines</span><b>${grnCart.length}</b></div>
 <div class="total"><span>Total units</span><b>${units}</b></div>
 <div class="total"><span>Total cost</span><b>${money(total)}</b></div>
 </div>`;
}

function cancelGRN(){

async function saveGRN(){
 if(!grnCart.length)return toast('Add at least one product');

 let supplier=val('gsupplier');
 let date=val('gdate');
 let number=val('gno').trim();
 let invoice=val('ginvoice').trim();

 if(!number||!date)return toast('Enter GRN number and date');

 let updates={};
 let totalQty=0;
 let totalCost=0;
 let savedItems=[];

 for(let x of grnCart){
  let productId=x.id;

  if(x.isNew){
   productId=key();
   let product={
    code:x.code,name:x.name,cost:x.cost,price:x.sell,
    qty:x.qty,createdAt:new Date().toISOString(),
    createdFromGRN:number
   };
   updates[path('products')+'/'+productId]=product;
  }else{
   let p=shopData.products[x.id];
   if(!p)return toast('Product no longer exists: '+x.name);
   updates[path('products')+'/'+x.id+'/qty']=num(p.qty)+x.qty;
   updates[path('products')+'/'+x.id+'/cost']=x.cost;
   updates[path('products')+'/'+x.id+'/price']=x.sell;
  }

  totalQty+=x.qty;
  totalCost+=x.qty*x.cost;
  savedItems.push({
   id:productId,
   code:x.code,
   name:x.name,
   qty:x.qty,
   cost:x.cost,
   sell:x.sell,
   isNew:!!x.isNew
  });
 }

 let grnId=key();
 let grnRecord={
  number,supplier,date,invoice,
  items:savedItems,
  totalQty,totalCost,
  receivedBy:profile.name||user.email,
  receivedByUid:user.uid,
  createdAt:new Date().toISOString()
 };
 updates[path('grns')+'/'+grnId]=grnRecord;

 try{
  await cloud.ref().update(updates);
  await audit('Stock received',number+' | '+totalQty+' units');
  grnCart=[];
  await loadShop();
  go('grn');
  toast('GRN saved. Stock updated successfully.');
 }catch(e){
  toast('GRN save failed: '+e.message);
 }
}

function setSettingsTab(tab){
 settingsTab=tab;
 render();
}

async function saveSettingsSection(section){
 let updates={};
 if(section==='general'){
  let name=val('sname').trim();
  if(!name)return toast('Enter shop name');
  updates={
   shopName:name,
   currency:val('scurrency'),
   dateFormat:val('sdateformat'),
   receiptFooter:val('sreceipt')
  };
 }
 if(section==='pricing'){
  let tax=Number(val('stax'));
  if(!Number.isFinite(tax)||tax<0||tax>100)
   return toast('Enter a valid tax percentage');
  updates={
   tax,
   taxMode:val('staxmode'),
   priceDecimals:Number(val('spriceformat'))
  };
 }
 if(section==='stock'){
  let low=Number(val('slow'));
  let critical=Number(val('scritical'));
  if(!Number.isInteger(low)||low<0||!Number.isInteger(critical)||critical<0)
   return toast('Enter valid stock alert quantities');
  if(critical>low)return toast('Critical quantity should not exceed low stock quantity');
  updates={lowStock:low,criticalStock:critical};
 }
 try{
  await cloud.ref(path('settings')).update(updates);
  await audit('Settings updated',section);
  await loadShop();
  render();
  toast('Settings saved successfully');
 }catch(e){toast('Settings save failed: '+e.message)}
}

/* BACKUP AND RESTORE */

function backup(){
 let blob=new Blob([JSON.stringify({
  branch:shopId,
  exportedAt:new Date().toISOString(),
  data:shopData
 },null,2)],{type:'application/json'});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='SmartPOS-'+shopId+'-backup.json';
 a.click();
 URL.revokeObjectURL(a.href);
}

async function restoreBackup(){
 let f=$('restoreFile')?.files[0];
 if(!f)return toast('Choose a backup file');
 if(!confirm('This will overwrite this branch data. Continue?'))return;
 try{
  let j=JSON.parse(await f.text());
  if(!j.data||!j.data.products)throw Error('Invalid backup file');
  await cloud.ref('shops/'+shopId).set(j.data);
  await audit('Backup restored',f.name);
  await loadShop();
  render();
  toast('Backup restored');
 }catch(e){toast('Restore failed: '+e.message)}
}

/* CSV EXPORT AND TABLE SEARCH */

function exportCSV(k){
 let a=records(k);
 if(!a.length)return toast('No records to export');
 let cols=k==='sales'?
 ['receipt','date','cashier','payment','subtotal','tax','total']:
 Object.keys(a[0]);
 let csv=[cols.join(','),...a.map(x=>
 cols.map(c=>'"'+String(x[c]??'').replace(/"/g,'""')+'"').join(',')
 )].join('\n');
 let blob=new Blob([csv],{type:'text/csv'});
 let url=URL.createObjectURL(blob);
 let el=document.createElement('a');
 el.href=url;el.download=shopId+'-'+k+'.csv';el.click();
 URL.revokeObjectURL(url);
}

function filterTable(inp){
 let q=inp.value.toLowerCase();
 document.querySelectorAll('tbody tr').forEach(r=>
 r.classList.toggle('hidden',!r.textContent.toLowerCase().includes(q)));
}

 dashboard,pos,products,purchasing,grn,stock,sales,
 customers,suppliers,expenses,reports,users,
 branches:branchesView,audit:auditPage,settings
};
