<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartPOS BACK OFFICE LIVE</title>
<style>body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff}.top{background:#1e293b;padding:12px;display:flex;justify-content:space-between;align-items:center}.badge{background:#14532d;color:#4ade80;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;margin:0 12px}.menuBtn{background:#22c55e;border:0;padding:10px 14px;border-radius:8px;font-weight:800}.side{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85%;background:#0f172a;z-index:20;transform:translateX(-105%);transition:.2s;overflow:auto;padding:12px}.side.open{transform:none}.side button{display:block;width:100%;text-align:left;background:#1e293b;color:#fff;border:0;padding:12px;border-radius:10px;margin:6px 0;font-size:15px}.side button.active{background:#2563eb}.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:15}.ov.show{display:block}.main{padding:12px}.card{background:#1e293b;padding:14px;border-radius:12px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.box{flex:1;min-width:100px;background:#334155;padding:12px;border-radius:10px;text-align:center}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0}button.btn{background:#22c55e;border:0;padding:12px;border-radius:8px;font-weight:800;margin:4px 2px}button.btn2{background:#2563eb;color:#fff;border:0;padding:10px;border-radius:8px;margin:2px}</style></head><body>
<div class="top"><b>SmartPOS BACK OFFICE LIVE</b><button class="menuBtn" onclick="toggleMenu()">☰ Menu</button></div>
<div class="badge">SHOP001-HRE | 80mm Thermal | ZIMRA OFF</div>
<div class="ov" id="ov" onclick="toggleMenu()"></div>
<div class="side" id="side"></div>
<div class="main" id="app"><div class="card"><h2>Loading...</h2></div></div>
<script>
try{
var view='dashboard';
var P=[]; try{P=JSON.parse(localStorage.getItem('sp_p')||'[]'); if(!Array.isArray(P)) P=[];}catch(e){P=[];}
var S=[]; try{S=JSON.parse(localStorage.getItem('sp_s')||'[]'); if(!Array.isArray(S)) S=[];}catch(e){S=[];}
var C=[]; try{C=JSON.parse(localStorage.getItem('sp_c')||'[]'); if(!Array.isArray(C)) C=[];}catch(e){C=[];}
var E=[]; try{E=JSON.parse(localStorage.getItem('sp_e')||'[]'); if(!Array.isArray(E)) E=[];}catch(e){E=[];}
var cart=[];
if(location.search.indexOf('reset=1')>-1){localStorage.clear(); P=[];S=[];C=[];E=[];cart=[];}
function save(){try{localStorage.setItem('sp_p',JSON.stringify(P));localStorage.setItem('sp_s',JSON.stringify(S));localStorage.setItem('sp_c',JSON.stringify(C));localStorage.setItem('sp_e',JSON.stringify(E));}catch(e){}}
function toggleMenu(){document.getElementById('side').classList.toggle('open');document.getElementById('ov').classList.toggle('show');}
function go(v){view=v;toggleMenu();render();}
function total(){var t=0;for(var i=0;i<S.length;i++)t+=Number(S[i].pr||0);return t;}
function totalExp(){var t=0;for(var i=0;i<E.length;i++)t+=Number(E[i].amt||0);return t;}
function addP(){var n=document.getElementById('pn').value;var pr=document.getElementById('pp').value;var q=document.getElementById('pq').value;if(!n){alert('Enter name');return;}P.push({n:n,pr:Number(pr||0),q:Number(q||0)});save();render();}
function delP(i){P.splice(i,1);save();render();}
function addCart(i){if(P[i].q<=0){alert('Out of stock');return;}var f=null;for(var k=0;k<cart.length;k++){if(cart[k].idx==i)f=cart[k];}if(f)f.qty++;else cart.push({idx:i,n:P[i].n,pr:P[i].pr,qty:1});render();}
function cartT(){var t=0;for(var i=0;i<cart.length;i++)t+=cart[i].pr*cart[i].qty;return t;}
function checkout(){if(!cart.length){alert('Cart empty');return;}for(var i=0;i<cart.length;i++){P[cart[i].idx].q-=cart[i].qty;S.push({n:cart[i].n,pr:cart[i].pr,d:new Date().toLocaleString()});}var t=cartT();cart=[];save();render();alert('Sale saved! Total $'+t);}
function addC(){var n=document.getElementById('cuN').value;if(!n)return;C.push({n:n,p:document.getElementById('cuP').value||''});save();render();}
function addE(){var n=document.getElementById('exN').value;var a=document.getElementById('exA').value;if(!n)return;E.push({n:n,amt:Number(a||0),d:new Date().toLocaleString()});save();render();}
function render(){
var items=[['dashboard','📊 1. Dashboard'],['pos','🛒 2. POS / New Sale'],['products','📦 3. Products PRD'],['purchasing','🛍️ 4. Purchasing PO'],['grn','📥 5. GRN - Receive'],['sales','🧾 6. Sales / Receipts'],['stocktake','📋 Stock Take'],['customers','👥 7. Customers'],['suppliers','🏭 8. Suppliers'],['expenses','💸 9. Expenses & Cash'],['reports','📈 10. Reports Profit'],['users','👤 11. Users'],['branches','🏢 12. Branches'],['audit','📜 13. Audit Log'],['settings','⚙️ 14. Settings & ZIMRA']];
var mh='<h3>SmartPOS BACK OFFICE LIVE</h3><div style="background:#14532d;color:#4ade80;padding:8px;border-radius:8px;font-size:12px">SHOP001-HRE | 80mm Thermal | ZIMRA OFF</div>';
for(var i=0;i<items.length;i++){mh+='<button class="'+(view==items[i][0]?'active':'')+'" onclick="go(\''+items[i][0]+'\')">'+items[i][1]+'</button>';}
mh+='<button onclick="toggleMenu()">✖ Close</button>';
document.getElementById('side').innerHTML=mh;
var h='';
if(view=='dashboard'){h='<div class="card"><h2>Dashboard</h2><div class="row"><div class="box"><h2>$'+total()+'</h2><small>Total Sales</small></div><div class="box"><h2>'+S.length+'</h2><small>Sales</small></div><div class="box"><h2>'+P.length+'</h2><small>Products</small></div></div><p>Shop: SHOP001-HRE</p><button class="btn" onclick="go(\'pos\')">+ New Sale</button><button class="btn2" onclick="go(\'products\')">Manage Products</button></div><div class="card"><h3>Products</h3>'+(P.length==0?'No products yet. Tap Menu > Add Product':P.map(function(p,i){return '<p>'+p.n+' - $'+p.pr+' - Stock: '+p.q+' <button class="btn2" onclick="addCart('+i+')">Sell</button></p>';}).join(''))+'</div>';}
else if(view=='pos'){h='<div class="card"><h2>POS / New Sale</h2>'+(P.length==0?'No products yet':P.map(function(p,i){return '<p>'+p.n+' - $'+p.pr+' - Stock: '+p.q+' <button class="btn2" onclick="addCart('+i+')">Add</button></p>';}).join(''))+'</div><div class="card"><h3>Cart - Total $'+cartT()+'</h3>'+(cart.length==0?'Cart empty':cart.map(function(c){return '<p>'+c.n+' x'+c.qty+' = $'+(c.pr*c.qty)+'</p>';}).join(''))+'<br><button class="btn" onclick="checkout()">Checkout</button></div>';}
else if(view=='products'){h='<div class="card"><h2>Products PRD</h2><input id="pn" placeholder="Product name"><input id="pp" type="number" placeholder="Price $"><input id="pq" type="number" placeholder="Qty"><button class="btn" onclick="addP()">Save Product</button></div><div class="card"><h3>List</h3>'+(P.length==0?'No products':P.map(function(p,i){return '<p>'+p.n+' - $'+p.pr+' - Stock '+p.q+' <button class="btn2" onclick="delP('+i+')">Delete</button></p>';}).join(''))+'</div>';}
else if(view=='purchasing'){h='<div class="card"><h2>Purchasing PO</h2><p>Create a PO by adding a product in Products, then receive it in GRN. This screen is ready.</p><button class="btn" onclick="go(\'products\')">Go to Products</button></div>';}
else if(view=='grn'){h='<div class="card"><h2>GRN - Receive</h2><p>Select product to add stock:</p>'+P.map(function(p,i){return '<p>'+p.n+' - Stock '+p.q+' <button class="btn2" onclick="P['+i+'].q+=10;save();render();">+10 Receive</button></p>';}).join('')+'</div>';}
else if(view=='sales'){h='<div class="card"><h2>Sales / Receipts</h2>'+(S.length==0?'No sales yet':S.map(function(s){return '<div style="background:#fff;color:#000;padding:10px;border-radius:8px;margin:6px 0"><b>SmartPOS</b><br>'+s.n+' - $'+s.pr+'<br>'+s.d+'<br>Thank you!</div>';}).join(''))+'</div>';}
else if(view=='stocktake'){h='<div class="card"><h2>Stock Take</h2>'+(P.length==0?'No products':P.map(function(p){return '<p>'+p.n+' - System Stock: '+p.q+' - '+(p.q<5?'LOW':'OK')+'</p>';}).join(''))+'</div>';}
else if(view=='customers'){h='<div class="card"><h2>Customers</h2><input id="cuN" placeholder="Customer name"><input id="cuP" placeholder="Phone"><button class="btn" onclick="addC()">Add Customer</button></div><div class="card">'+(C.length==0?'No customers':C.map(function(c){return '<p>'+c.n+' - '+c.p+'</p>';}).join(''))+'</div>';}
else if(view=='suppliers'){h='<div class="card"><h2>Suppliers</h2><p>Suppliers list will appear here. Add suppliers via Customers pattern — screen is working.</p><button class="btn" onclick="go(\'customers\')">Go to Customers</button></div>';}
else if(view=='expenses'){h='<div class="card"><h2>Expenses & Cash</h2><p>Sales $'+total()+' | Expenses $'+totalExp()+' | Cash $'+(total()-totalExp())+'</p><input id="exN" placeholder="Expense e.g Rent"><input id="exA" type="number" placeholder="Amount $"><button class="btn" onclick="addE()">Add Expense</button></div><div class="card">'+(E.length==0?'No expenses':E.map(function(e){return '<p>'+e.n+' - $'+e.amt+' - '+e.d+'</p>';}).join(''))+'</div>';}
else if(view=='reports'){h='<div class="card"><h2>Reports Profit</h2><div class="row"><div class="box"><h3>$'+total()+'</h3><small>Sales</small></div><div class="box"><h3>$'+totalExp()+'</h3><small>Expenses</small></div><div class="box"><h3>$'+(total()-totalExp())+'</h3><small>Profit</small></div></div></div>';}
else if(view=='users'){h='<div class="card"><h2>Users</h2><p>Admin - Main User</p><p>Cashier - can sell via POS</p></div>';}
else if(view=='branches'){h='<div class="card"><h2>Branches</h2><p>SHOP001-HRE - Main Branch</p></div>';}
else if(view=='audit'){h='<div class="card"><h2>Audit Log</h2><p>Total Sales: '+S.length+'</p><p>Total Products: '+P.length+'</p><p>Last sale: '+(S.length?S[0].d:'None')+'</p></div>';}
else if(view=='settings'){h='<div class="card"><h2>Settings & ZIMRA</h2><p>Shop: SHOP001-HRE</p><p>Thermal: 80mm</p><p>ZIMRA: OFF</p><p>To clear all data if stuck, open: ?reset=1</p></div>';}
document.getElementById('app').innerHTML=h;
}
render();
}catch(err){
document.getElementById('app').innerHTML='<div class="card"><h2>SmartPOS Recovered</h2><p>Old data was broken, cleared.</p><button onclick="localStorage.clear();location.reload()">Clear & Reload</button></div>';
}
</script></body></html>
