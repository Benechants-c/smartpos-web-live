<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPOS V3.1 - PROPER NUMBERING 1-14</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md">
<h1 class="text-xl font-black text-center">🔥 SmartPOS V3.1 ULTIMATE</h1>
<p class="text-center text-emerald-400 text-xs">PROPER NUMBERING 1-14 - ALL FUNCTIONAL</p>
<input id="email" class="w-full mt-4 p-3 rounded-xl bg-slate-800 border border-slate-700" value="boss@smartpos.co.zw">
<input id="pass" type="password" class="w-full mt-2 p-3 rounded-xl bg-slate-800 border border-slate-700" value="Boss123">
<button onclick="loginEmail()" class="w-full mt-3 bg-blue-600 p-3 rounded-xl font-bold">Login</button>
<button onclick="loginGoogle()" class="w-full mt-2 bg-white text-black p-3 rounded-xl font-bold">Google</button>
<p id="status" class="text-xs text-center mt-2 text-yellow-400">Ready - V3.1 Proper Levels</p>
</div></div>
<div id="mainApp" class="hidden flex min-h-screen">
<div id="sidebar" class="w-[300px] bg-slate-900 border-r border-slate-800 p-3 fixed h-full overflow-y-auto z-20">
<h2 class="font-black text-sm">SmartPOS BACK OFFICE LIVE</h2>
<div id="shopBadge" class="text-[11px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded mt-2 mb-3">SHOP001-HRE | V3.1 1-14</div>
<nav id="menu" class="space-y-1 text-[13px]"></nav>
<div class="mt-4 text-[10px] text-slate-500"><div id="userEmailDisplay"></div><button onclick="logout()" class="mt-2 w-full bg-red-600 p-2 rounded text-white">Logout</button><button onclick="clearCache()" class="mt-2 w-full bg-amber-600 p-2 rounded">Fix Black Screen</button></div>
</div>
<div class="flex-1 ml-0 lg:ml-[300px] p-3 lg:p-5"><div class="lg:hidden mb-2"><button onclick="document.getElementById('sidebar').classList.toggle('hidden')" class="bg-slate-800 px-3 py-2 rounded">☰ Menu</button></div><div id="contentArea"></div></div>
</div>
<script>
function safeParse(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){localStorage.removeItem(k);return f;}}
function clearCache(){if(confirm('Clear cache?')){localStorage.clear();location.reload();}}
const firebaseConfig={apiKey:"AIzaSyATD1DELs0gmtnS_iG8gcA2UvqwtQDF2A4",authDomain:"smartpos-83781.firebaseapp.com",projectId:"smartpos-83781"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const auth=firebase.auth();
let products=safeParse('sp_products',[{code:'PRD000125',name:'Demo Sugar 2kg',cat:'Grocery',cost:5,price:10,stock:100,reorder:10}]);
let pos=safeParse('sp_pos',[]);let grns=safeParse('sp_grns',[]);let posCart=[];
let customers=safeParse('sp_customers',[{name:'Walk-in Customer',phone:'0770000000',balance:0}]);
let suppliers=safeParse('sp_suppliers',[{name:'Main Supplier',phone:'0771111111',balance:0}]);
let expenses=safeParse('sp_expenses',[]);let purchaseOrders=safeParse('sp_po',[]);
let users=safeParse('sp_users',[{email:'boss@smartpos.co.zw',role:'Admin'}]);
let branches=safeParse('sp_branches',[{code:'SHOP001-HRE',name:'Main Shop Harare'}]);
let audit=safeParse('sp_audit',[{action:'Login',time:new Date().toISOString()}]);
let settings=safeParse('sp_settings_full',{shopName:'SmartPOS Main Shop',shopCode:'SHOP001-HRE',phone:'+263 77 123 4567',address:'Harare CBD',tin:'10012345',vatNum:'22012345',currency:'USD / ZWG',usdToZwg:36.5,vat:15,lowStock:10,allowNegative:false,maxDiscount:10,receiptHeader:'Thank you!',receiptFooter:'ZIMRA Fiscal Receipt',zimraStatus:'OFF',zimraDeviceId:'',zimraModel:'Server Ver 1.0',zimraModelVer:'1.0'});
let currentModule='dashboard';
function saveAll(){localStorage.setItem('sp_products',JSON.stringify(products));localStorage.setItem('sp_pos',JSON.stringify(pos));localStorage.setItem('sp_grns',JSON.stringify(grns));localStorage.setItem('sp_customers',JSON.stringify(customers));localStorage.setItem('sp_suppliers',JSON.stringify(suppliers));localStorage.setItem('sp_expenses',JSON.stringify(expenses));localStorage.setItem('sp_po',JSON.stringify(purchaseOrders));localStorage.setItem('sp_users',JSON.stringify(users));localStorage.setItem('sp_branches',JSON.stringify(branches));localStorage.setItem('sp_audit',JSON.stringify(audit));localStorage.setItem('sp_settings_full',JSON.stringify(settings));}
function logAudit(a){audit.unshift({action:a,time:new Date().toISOString(),user:auth.currentUser?auth.currentUser.email:''});if(audit.length>200)audit.pop();saveAll();}
auth.onAuthStateChanged(u=>{if(u){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');document.getElementById('userEmailDisplay').innerText=u.email;renderMenu();renderModule('dashboard');logAudit('Login');}else{document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('mainApp').classList.add('hidden');}});
function loginEmail(){const e=document.getElementById('email').value,p=document.getElementById('pass').value;auth.signInWithEmailAndPassword(e,p).catch(()=>auth.createUserWithEmailAndPassword(e,p)).catch(er=>document.getElementById('status').innerText=er.message);}
function loginGoogle(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>document.getElementById('status').innerText=e.message);}
function logout(){auth.signOut();}
function renderMenu(){const items=[['dashboard','1. Dashboard'],['pos','2. POS / New Sale'],['products','3. Products PRD'],['purchasing','4. Purchasing PO'],['grn','5. GRN - Receive (FIXED)'],['sales','6. Sales / Receipts'],['customers','7. Customers'],['suppliers','8. Suppliers'],['expenses','9. Expenses & Cash'],['reports','10. Reports Profit'],['users','11. Users'],['branches','12. Branches'],['audit','13. Audit Log'],['settings','14. Settings & ZIMRA (FULL)']];document.getElementById('menu').innerHTML=items.map(([id,label])=>{const a=currentModule===id?'bg-blue-600 text-white':'bg-slate-800';return `<button onclick="renderModule('${id}')" class="w-full text-left px-3 py-2.5 rounded-xl ${a}">${label}</button>`;}).join('')+`<button onclick="downloadBackup()" class="w-full mt-2 text-left px-3 py-2 rounded-xl bg-slate-800">⬇ Download Backup</button><input id="restoreInput" type="file" class="hidden" onchange="restoreBackup(event)"><button onclick="document.getElementById('restoreInput').click()" class="w-full text-left px-3 py-2 rounded-xl bg-slate-800">⬆ Restore Backup</button>`;document.getElementById('shopBadge').innerText=`${settings.shopCode} | ${settings.currency} | Rate ${settings.usdToZwg}`;}
function renderModule(id){currentModule=id;renderMenu();const area=document.getElementById('contentArea');try{if(id==='dashboard')area.innerHTML=renderDashboard();else if(id==='products')area.innerHTML=renderProducts();else if(id==='pos')area.innerHTML=renderPOS();else if(id==='grn')area.innerHTML=renderGRN();else if(id==='purchasing')area.innerHTML=renderPO();else if(id==='sales')area.innerHTML=renderSales();else if(id==='customers')area.innerHTML=renderCustomers();else if(id==='suppliers')area.innerHTML=renderSuppliers();else if(id==='expenses')area.innerHTML=renderExpenses();else if(id==='reports')area.innerHTML=renderReports();else if(id==='users')area.innerHTML=renderUsers();else if(id==='branches')area.innerHTML=renderBranches();else if(id==='audit')area.innerHTML=renderAudit();else if(id==='settings')area.innerHTML=renderSettings();}catch(e){area.innerHTML=`<div class="bg-red-900 p-4 rounded">Error: ${e.message}</div>`;}if(window.innerWidth<1024)document.getElementById('sidebar').classList.add('hidden');}
function renderDashboard(){const sv=products.reduce((s,p)=>s+p.stock*p.cost,0);const rv=products.reduce((s,p)=>s+p.stock*p.price,0);const sa=pos.reduce((s,r)=>s+r.total,0);const co=pos.reduce((s,r)=>s+r.cogs,0);const ex=expenses.reduce((s,e)=>s+e.amount,0);return `<div class="space-y-3"><h1 class="text-2xl font-black">1. DASHBOARD - ${settings.shopCode}</h1><div class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="bg-slate-900 p-4 rounded-2xl"><div class="text-xs text-slate-400">Stock Cost</div><div class="text-xl font-black">$${sv.toFixed(2)}</div></div><div class="bg-slate-900 p-4 rounded-2xl"><div class="text-xs text-slate-400">Retail</div><div class="text-xl font-black">$${rv.toFixed(2)}</div></div><div class="bg-slate-900 p-4 rounded-2xl"><div class="text-xs text-slate-400">Net Sales</div><div class="text-xl font-black">$${sa.toFixed(2)}</div></div><div class="bg-emerald-900/30 p-4 rounded-2xl border border-emerald-800"><div class="text-xs text-emerald-400">Gross Profit</div><div class="text-xl font-black text-emerald-400">$${(sa-co).toFixed(2)}</div><div class="text-[10px]">Net $${(sa-co-ex).toFixed(2)}</div></div></div><div class="grid grid-cols-3 lg:grid-cols-6 gap-2"><button onclick="renderModule('pos')" class="bg-blue-600 p-3 rounded-xl font-bold">+ New Sale</button><button onclick="renderModule('products')" class="bg-slate-800 p-3 rounded-xl">+ Product</button><button onclick="renderModule('purchasing')" class="bg-slate-800 p-3 rounded-xl">PO</button><button onclick="renderModule('grn')" class="bg-emerald-600 p-3 rounded-xl">Receive</button><button onclick="renderModule('expenses')" class="bg-slate-800 p-3 rounded-xl">Expense</button><button onclick="renderModule('reports')" class="bg-slate-800 p-3 rounded-xl">Reports</button></div><div class="bg-slate-900 p-4 rounded-2xl"><h3 class="font-bold">Products (${products.length}) - Codes Visible</h3><table class="w-full text-xs mt-2"><tr class="text-slate-500"><th class="text-left">Code</th><th>Name</th><th>Stock</th><th>Cost</th><th>Price</th></tr>${products.map(p=>`<tr class="border-t border-slate-800"><td class="font-mono">${p.code}</td><td>${p.name}</td><td class="${p.stock<=settings.lowStock?'text-red-400':''}">${p.stock}</td><td>$${p.cost}</td><td>$${p.price}</td></tr>`).join('')}</table></div></div>`;}
function renderProducts(){return `<div class="bg-slate-900 p-4 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">3. Products PRD - Product Codes</h2><button onclick="addProduct()" class="bg-blue-600 px-4 py-2 rounded-xl">+ Add</button></div><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th class="text-left p-2">Code</th><th>Name</th><th>Stock</th><th>Cost</th><th>Price</th><th>Action</th></tr>${products.map((p,i)=>`<tr class="border-t border-slate-800"><td class="p-2 font-mono">${p.code}</td><td>${p.name}</td><td>${p.stock}</td><td>$${p.cost}</td><td>$${p.price}</td><td><button onclick="editProd(${i})" class="text-blue-400 mr-2">Edit</button><button onclick="delProd(${i})" class="text-red-400">Del</button></td></tr>`).join('')}</table></div>`;}
function addProduct(){const code=prompt('Code e.g. STOVE001:');if(!code)return;if(products.find(p=>p.code.toLowerCase()===code.toLowerCase())){alert('Exists');return;}const name=prompt('Name:');const cost=parseFloat(prompt('Cost:','5')||'0');const price=parseFloat(prompt('Price:','10')||'0');const stock=parseInt(prompt('Stock:','0')||'0');products.push({code:code.toUpperCase(),name:name||code,cat:'General',cost,price,stock,reorder:settings.lowStock});saveAll();logAudit('Add '+code);renderModule('products');}
function editProd(i){const p=products[i];const name=prompt('Name:',p.name);const cost=parseFloat(prompt('Cost:',p.cost)||p.cost);const price=parseFloat(prompt('Price:',p.price)||p.price);const stock=parseInt(prompt('Stock:',p.stock)||p.stock);if(name)p.name=name;p.cost=cost;p.price=price;p.stock=stock;saveAll();renderModule('products');}
function delProd(i){if(confirm('Delete?')){products.splice(i,1);saveAll();renderModule('products');}}
function renderPOS(){const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);return `<div class="grid lg:grid-cols-3 gap-3"><div class="lg:col-span-2 bg-slate-900 p-4 rounded-2xl"><h2 class="font-black">2. POS / New Sale</h2><input id="posSearch" oninput="filterPOS()" placeholder="Search code e.g. STOVE001" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 mt-2"><div id="posList" class="mt-2 grid gap-1 max-h-[400px] overflow-y-auto">${products.map((p,idx)=>`<button onclick="addToCart(${idx})" class="text-left p-2 bg-slate-800 rounded flex justify-between"><span><b class="font-mono">${p.code}</b> - ${p.name} (${p.stock})</span><span>$${p.price}</span></button>`).join('')}</div></div><div class="bg-slate-900 p-4 rounded-2xl"><h3 class="font-bold">Cart (${posCart.length})</h3><div class="mt-2 text-sm">${posCart.map((c,i)=>`<div class="flex justify-between"><span>${c.code} x${c.qty}</span><span>$${(c.qty*c.price).toFixed(2)} <button onclick="posCart.splice(${i},1);renderModule('pos')" class="text-red-400">x</button></span></div>`).join('')||'Empty'}</div><div class="mt-3 font-black border-t border-slate-700 pt-2">Total $${total.toFixed(2)}</div><button onclick="checkout()" class="w-full mt-3 bg-emerald-600 p-3 rounded-xl font-bold">Complete Sale</button></div></div>`;}
function filterPOS(){const q=document.getElementById('posSearch').value.toLowerCase();document.getElementById('posList').innerHTML=products.filter(p=>p.code.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)).map(p=>{const idx=products.indexOf(p);return `<button onclick="addToCart(${idx})" class="text-left p-2 bg-slate-800 rounded flex justify-between"><span><b class="font-mono">${p.code}</b> - ${p.name} (${p.stock})</span><span>$${p.price}</span></button>`;}).join('');}
function addToCart(i){const p=products[i];if(p.stock<=0&&!settings.allowNegative){alert('Out of stock');return;}const ex=posCart.find(c=>c.code===p.code);if(ex)ex.qty++;else posCart.push({code:p.code,name:p.name,price:p.price,qty:1,cost:p.cost});renderModule('pos');}
function checkout(){if(posCart.length===0)return;const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);const cogs=posCart.reduce((s,i)=>s+i.qty*i.cost,0);posCart.forEach(c=>{const pr=products.find(pp=>pp.code===c.code);if(pr)pr.stock-=c.qty;});pos.unshift({id:'S'+Date.now(),items:[...posCart],total,cogs,date:new Date().toISOString()});posCart=[];saveAll();logAudit('Sale $'+total);alert('Sale Done Profit $'+(total-cogs).toFixed(2));renderModule('dashboard');}
function renderPO(){return `<div class="bg-slate-900 p-4 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">4. Purchasing PO</h2><button onclick="addPO()" class="bg-blue-600 px-4 py-2 rounded">+ New PO</button></div><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th class="text-left">PO#</th><th>Supplier</th><th>Items</th><th>Status</th><th>Action</th></tr>${purchaseOrders.map((po,i)=>`<tr class="border-t border-slate-800"><td>${po.id}</td><td>${po.supplier}</td><td>${po.items.length}</td><td>${po.status}</td><td><button onclick="receivePO(${i})" class="text-emerald-400">Receive</button></td></tr>`).join('')||'<tr><td colspan=5 class="p-3 text-slate-500">No POs - Tap + New PO</td></tr>'}</table></div>`;}
function addPO(){const sup=prompt('Supplier:',suppliers[0]?.name||'Main Supplier');if(!sup)return;const code=prompt('Product Code to order e.g. STOVE001:');if(!code)return;const qty=parseInt(prompt('Qty:','10')||'0');const po={id:'PO'+Date.now(),supplier:sup,items:[{code:code.toUpperCase(),qty}],status:'Pending',date:new Date().toISOString()};purchaseOrders.unshift(po);saveAll();logAudit('Create PO '+po.id);renderModule('purchasing');}
function receivePO(i){const po=purchaseOrders[i];po.items.forEach(it=>{const prod=products.find(p=>p.code.toLowerCase()===it.code.toLowerCase());if(!prod){alert('Product '+it.code+' not found - create in Products first');return;}prod.stock+=it.qty;grns.push({code:prod.code,name:prod.name,qty:it.qty,cost:prod.cost,date:new Date().toISOString(),po:po.id});});po.status='Received';saveAll();renderModule('purchasing');alert('PO Received - Stock Updated');}
function renderGRN(){return `<div class="bg-slate-900 p-4 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">5. GRN - Receive (FIXED - Manual Code)</h2><button onclick="openGRN()" class="bg-emerald-600 px-4 py-2 rounded">+ Receive Stock</button></div><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th>Date</th><th class="text-left">Code</th><th>Product</th><th>Qty</th><th>Cost</th><th>PO</th></tr>${grns.slice(-30).reverse().map(g=>`<tr class="border-t border-slate-800"><td>${new Date(g.date).toLocaleDateString()}</td><td class="font-mono">${g.code}</td><td>${g.name}</td><td>+${g.qty}</td><td>$${g.cost}</td><td>${g.po||''}</td></tr>`).join('')||'<tr><td colspan=6 class="p-3 text-slate-500">No GRNs - Tap + Receive Stock and type STOVE001</td></tr>'}</table><div class="mt-3 bg-slate-800 p-3 rounded text-xs"><b>FIXED:</b> Type Product Code manually e.g. STOVE001 - Auto-creates if not found!</div></div>`;}
function openGRN(){const code=prompt('Enter Product CODE to receive:\n'+products.map(p=>p.code+' - '+p.name).join('\n'));if(!code)return;let prod=products.find(p=>p.code.toLowerCase()===code.toLowerCase());if(!prod){if(confirm('Code '+code+' not found. Create new product?')){const name=prompt('Name for '+code+':',code);const cost=parseFloat(prompt('Cost:','10')||'10');const price=parseFloat(prompt('Price:','15')||'15');prod={code:code.toUpperCase(),name:name||code,cat:'General',cost,price,stock:0,reorder:settings.lowStock};products.push(prod);}else return;}const qty=parseInt(prompt('Qty for '+prod.code+':','1')||'0');const nc=prompt('New cost? Blank keep $'+prod.cost+':','');if(nc&&!isNaN(parseFloat(nc)))prod.cost=parseFloat(nc);prod.stock+=qty;grns.unshift({code:prod.code,name:prod.name,qty,cost:prod.cost,date:new Date().toISOString()});saveAll();logAudit('GRN '+prod.code+' +'+qty);renderModule('grn');alert('Received '+qty+' x '+prod.code+' New stock '+prod.stock);}
function renderSales(){return `<div class="bg-slate-900 p-4 rounded-2xl"><h2 class="font-black">6. Sales / Receipts</h2><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th class="text-left">Receipt</th><th>Date</th><th>Items</th><th>Total</th><th>Profit</th><th>Action</th></tr>${pos.slice(-50).map((s,i)=>`<tr class="border-t border-slate-800"><td class="font-mono">${s.id}</td><td>${new Date(s.date).toLocaleString()}</td><td>${s.items.length}</td><td>$${s.total.toFixed(2)}</td><td class="text-emerald-400">$${(s.total-s.cogs).toFixed(2)}</td><td><button onclick="reprintSale(${pos.indexOf(s)})" class="text-blue-400 mr-2">Reprint</button><button onclick="refundSale(${pos.indexOf(s)})" class="text-red-400">Refund</button></td></tr>`).join('')||'<tr><td colspan=6 class="p-3 text-slate-500">No sales</td></tr>'}</table></div>`;}
function reprintSale(i){const s=pos[i];const items=s.items.map(it=>`${it.code} x${it.qty} $${(it.qty*it.price).toFixed(2)}`).join('\n');alert(`RECEIPT ${s.id}\nDate: ${new Date(s.date).toLocaleString()}\n---\n${items}\n---\nTotal: $${s.total.toFixed(2)}\nZWG: $${(s.total*settings.usdToZwg).toFixed(2)}\n---\n${settings.receiptHeader}\n${settings.receiptFooter}\nTIN: ${settings.tin}`);}
function refundSale(i){if(!confirm('Refund? Stock will return'))return;const s=pos[i];s.items.forEach(c=>{const pr=products.find(pp=>pp.code===c.code);if(pr)pr.stock+=c.qty;});pos.splice(i,1);saveAll();logAudit('Refund '+s.id);renderModule('sales');}
function renderCustomers(){return `<div class="bg-slate-900 p-4 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">7. Customers</h2><button onclick="addCustomer()" class="bg-blue-600 px-4 py-2 rounded">+ Add</button></div><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th class="text-left">Name</th><th>Phone</th><th>Balance</th><th>Action</th></tr>${customers.map((c,i)=>`<tr class="border-t border-slate-800"><td>${c.name}</td><td>${c.phone}</td><td>$${c.balance.toFixed(2)}</td><td><button onclick="editCustomer(${i})" class="text-blue-400 mr-2">Edit</button><button onclick="delCustomer(${i})" class="text-red-400">Del</button></td></tr>`).join('')}</table></div>`;}
function addCustomer(){const name=prompt('Customer Name:');if(!name)return;const phone=prompt('Phone:','077');customers.push({name,phone:phone||'',balance:0});saveAll();renderModule('customers');}
function editCustomer(i){const c=customers[i];const name=prompt('Name:',c.name);const phone=prompt('Phone:',c.phone);if(name)c.name=name;c.phone=phone;saveAll();renderModule('customers');}
function delCustomer(i){if(confirm('Delete?')){customers.splice(i,1);saveAll();renderModule('customers');}}
function renderSuppliers(){return `<div class="bg-slate-900 p-4 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">8. Suppliers</h2><button onclick="addSupplier()" class="bg-blue-600 px-4 py-2 rounded">+ Add</button></div><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th class="text-left">Name</th><th>Phone</th><th>Balance</th><th>Action</th></tr>${suppliers.map((s,i)=>`<tr class="border-t border-slate-800"><td>${s.name}</td><td>${s.phone}</td><td>$${s.balance.toFixed(2)}</td><td><button onclick="editSupplier(${i})" class="text-blue-400 mr-2">Edit</button><button onclick="delSupplier(${i})" class="text-red-400">Del</button></td></tr>`).join('')}</table></div>`;}
function addSupplier(){const name=prompt('Supplier Name:');if(!name)return;const phone=prompt('Phone:','077');suppliers.push({name,phone:phone||'',balance:0});saveAll();renderModule('suppliers');}
function editSupplier(i){const s=suppliers[i];const name=prompt('Name:',s.name);const phone=prompt('Phone:',s.phone);if(name)s.name=name;s.phone=phone;saveAll();renderModule('suppliers');}
function delSupplier(i){if(confirm('Delete?')){suppliers.splice(i,1);saveAll();renderModule('suppliers');}}
function renderExpenses(){const total=expenses.reduce((s,e)=>s+e.amount,0);return `<div class="bg-slate-900 p-4 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">9. Expenses & Cash - Total $${total.toFixed(2)}</h2><button onclick="addExpense()" class="bg-blue-600 px-4 py-2 rounded">+ Add</button></div><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th>Date</th><th class="text-left">Category</th><th>Desc</th><th>Amount</th><th>Action</th></tr>${expenses.map((e,i)=>`<tr class="border-t border-slate-800"><td>${new Date(e.date).toLocaleDateString()}</td><td>${e.cat}</td><td>${e.desc}</td><td>$${e.amount.toFixed(2)}</td><td><button onclick="delExpense(${i})" class="text-red-400">Del</button></td></tr>`).join('')||'<tr><td colspan=5 class="p-3 text-slate-500">No expenses</td></tr>'}</table></div>`;}
function addExpense(){const cat=prompt('Category (Rent, Transport, Airtime, Wages):','Rent');const desc=prompt('Description:','');const amount=parseFloat(prompt('Amount:','10')||'0');expenses.unshift({cat:cat||'General',desc:desc||'',amount,date:new Date().toISOString()});saveAll();logAudit('Expense $'+amount);renderModule('expenses');}
function delExpense(i){if(confirm('Delete?')){expenses.splice(i,1);saveAll();renderModule('expenses');}}
function renderReports(){const sales=pos.reduce((s,r)=>s+r.total,0);const cogs=pos.reduce((s,r)=>s+r.cogs,0);const gross=sales-cogs;const exp=expenses.reduce((s,e)=>s+e.amount,0);const net=gross-exp;const vat=sales*settings.vat/100;return `<div class="space-y-3"><div class="bg-slate-900 p-4 rounded-2xl"><h2 class="font-black">10. Reports Profit - SHOP001-HRE</h2><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-3"><div class="bg-slate-800 p-3 rounded"><div class="text-xs text-slate-400">Net Sales</div><div class="font-black">$${sales.toFixed(2)}</div></div><div class="bg-slate-800 p-3 rounded"><div class="text-xs text-slate-400">COGS</div><div class="font-black">$${cogs.toFixed(2)}</div></div><div class="bg-emerald-900/30 p-3 rounded"><div class="text-xs text-emerald-400">Gross Profit</div><div class="font-black text-emerald-400">$${gross.toFixed(2)}</div></div><div class="bg-slate-800 p-3 rounded"><div class="text-xs text-slate-400">Expenses</div><div class="font-black text-red-400">$${exp.toFixed(2)}</div></div><div class="bg-blue-900/30 p-3 rounded"><div class="text-xs text-blue-400">Net Profit</div><div class="font-black text-blue-400">$${net.toFixed(2)}</div></div><div class="bg-slate-800 p-3 rounded"><div class="text-xs text-slate-400">VAT ${settings.vat}%</div><div class="font-black">$${vat.toFixed(2)}</div></div><div class="bg-slate-800 p-3 rounded"><div class="text-xs text-slate-400">ZWG Sales</div><div class="font-black">$${(sales*settings.usdToZwg).toFixed(2)}</div></div><div class="bg-slate-800 p-3 rounded"><div class="text-xs text-slate-400">Stock Value</div><div class="font-black">$${products.reduce((s,p)=>s+p.stock*p.cost,0).toFixed(2)}</div></div></div><div class="mt-4 text-xs">Gross = Sales - COGS | Net = Gross - Expenses | VAT = Sales * ${settings.vat}%</div><button onclick="alert('ZIMRA Report\\nTIN: ${settings.tin}\\nVAT: ${settings.vatNum}\\nSales: $${sales}\\nVAT Due: $${vat}\\nStatus: ${settings.zimraStatus}')" class="mt-3 bg-red-600 px-4 py-2 rounded">View ZIMRA Summary</button></div><div class="bg-slate-900 p-4 rounded-2xl"><h3 class="font-bold">Sales by Product Code</h3><table class="w-full text-xs mt-2"><tr class="text-slate-400"><th class="text-left">Code</th><th>Name</th><th>Qty</th><th>Profit</th></tr>${(()=>{const map={};pos.forEach(s=>s.items.forEach(it=>{if(!map[it.code])map[it.code]={code:it.code,name:it.name,qty:0,profit:0};map[it.code].qty+=it.qty;map[it.code].profit+=(it.price-it.cost)*it.qty;}));return Object.values(map).map(m=>`<tr class="border-t border-slate-800"><td class="font-mono">${m.code}</td><td>${m.name}</td><td>${m.qty}</td><td class="text-emerald-400">$${m.profit.toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=4 class="p-2 text-slate-500">No sales</td></tr>';})()}</table></div></div>`;}
function renderUsers(){return `<div class="bg-slate-900 p-4 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">11. Users</h2><button onclick="addUser()" class="bg-blue-600 px-4 py-2 rounded">+ Add</button></div><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th class="text-left">Email</th><th>Role</th><th>Action</th></tr>${users.map((u,i)=>`<tr class="border-t border-slate-800"><td>${u.email}</td><td>${u.role}</td><td><button onclick="delUser(${i})" class="text-red-400">Del</button></td></tr>`).join('')}</table></div>`;}
function addUser(){const email=prompt('Email:');if(!email)return;const role=prompt('Role (Admin/Cashier):','Cashier');users.push({email,role:role||'Cashier'});saveAll();renderModule('users');}
function delUser(i){if(confirm('Delete?')){users.splice(i,1);saveAll();renderModule('users');}}
function renderBranches(){return `<div class="bg-slate-900 p-4 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">12. Branches</h2><button onclick="addBranch()" class="bg-blue-600 px-4 py-2 rounded">+ Add</button></div><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th>Code</th><th class="text-left">Name</th><th>Action</th></tr>${branches.map((b,i)=>`<tr class="border-t border-slate-800"><td class="font-mono">${b.code}</td><td>${b.name}</td><td><button onclick="delBranch(${i})" class="text-red-400">Del</button></td></tr>`).join('')}</table></div>`;}
function addBranch(){const code=prompt('Code e.g. SHOP002-BYO:');if(!code)return;const name=prompt('Name:');branches.push({code:code.toUpperCase(),name:name||code});saveAll();renderModule('branches');}
function delBranch(i){if(confirm('Delete?')){branches.splice(i,1);saveAll();renderModule('branches');}}
function renderAudit(){return `<div class="bg-slate-900 p-4 rounded-2xl"><h2 class="font-black">13. Audit Log</h2><table class="w-full text-xs mt-3"><tr class="text-slate-400"><th class="text-left">Time</th><th>Action</th><th>User</th></tr>${audit.slice(0,100).map(a=>`<tr class="border-t border-slate-800"><td>${new Date(a.time).toLocaleString()}</td><td>${a.action}</td><td>${a.user||''}</td></tr>`).join('')}</table><button onclick="if(confirm('Clear log?')){audit=[];saveAll();renderModule('audit');}" class="mt-3 bg-red-600 px-4 py-2 rounded">Clear Log</button></div>`;}
function renderSettings(){return `<div class="space-y-3"><h1 class="text-xl font-black">14. SETTINGS & ZIMRA - FULL 9 Sections - V3.1 PROPER NUMBERING</h1>
<div class="bg-slate-900 p-4 rounded-2xl"><h3 class="font-bold text-blue-400">1. Shop Info</h3><div class="grid lg:grid-cols-2 gap-2 mt-2"><input id="s_shopName" value="${settings.shopName}" placeholder="Shop Name" class="p-2 rounded bg-slate-800"><input id="s_shopCode" value="${settings.shopCode}" class="p-2 rounded bg-slate-800"><input id="s_phone" value="${settings.phone}" class="p-2 rounded bg-slate-800"><input id="s_address" value="${settings.address}" class="p-2 rounded bg-slate-800"><input id="s_tin" value="${settings.tin}" placeholder="TIN" class="p-2 rounded bg-slate-800"><input id="s_vatNum" value="${settings.vatNum}" placeholder="VAT" class="p-2 rounded bg-slate-800"></div></div>
<div class="bg-slate-900 p-4 rounded-2xl"><h3 class="font-bold text-emerald-400">2. Financial - Currency & Rate</h3><div class="grid lg:grid-cols-3 gap-2 mt-2"><select id="s_currency" class="p-2 rounded bg-slate-800"><option ${settings.currency==='USD / ZWG'?'selected':''}>USD / ZWG</option><option ${settings.currency==='USD'?'selected':''}>USD</option><option ${settings.currency==='ZWG'?'selected':''}>ZWG</option></select><input id="s_rate" type="number" step="0.01" value="${settings.usdToZwg}" class="p-2 rounded bg-slate-800"><input id="s_vat" type="number" value="${settings.vat}" class="p-2 rounded bg-slate-800"></div></div>
<div class="bg-slate-900 p-4 rounded-2xl"><h3 class="font-bold text-amber-400">3. Inventory</h3><div class="grid lg:grid-cols-3 gap-2 mt-2"><input id="s_low" type="number" value="${settings.lowStock}" class="p-2 rounded bg-slate-800"><select id="s_neg" class="p-2 rounded bg-slate-800"><option value="false" ${!settings.allowNegative?'selected':''}>No Negative Stock</option><option value="true" ${settings.allowNegative?'selected':''}>Allow Negative</option></select><input id="s_maxDisc" type="number" value="${settings.maxDiscount}" class="p-2 rounded bg-slate-800"></div></div>
<div class="bg-slate-900 p-4 rounded-2xl border border-red-900/50"><h3 class="font-bold text-red-400">5. ZIMRA FDMS - Fiscalisation</h3><div class="grid lg:grid-cols-2 gap-2 mt-2"><select id="s_zimra" class="p-2 rounded bg-slate-800"><option ${settings.zimraStatus==='OFF'?'selected':''}>OFF</option><option ${settings.zimraStatus==='ON'?'selected':''}>ON</option></select><input id="s_zimraId" value="${settings.zimraDeviceId}" placeholder="Device ID" class="p-2 rounded bg-slate-800"><input id="s_zimraModel" value="${settings.zimraModel}" class="p-2 rounded bg-slate-800"><input id="s_zimraVer" value="${settings.zimraModelVer}" class="p-2 rounded bg-slate-800"></div></div>
<div class="bg-slate-900 p-4 rounded-2xl"><h3 class="font-bold text-cyan-400">6. Receipt Customization</h3><div class="grid gap-2 mt-2"><input id="s_rHeader" value="${settings.receiptHeader}" class="p-2 rounded bg-slate-800"><input id="s_rFooter" value="${settings.receiptFooter}" class="p-2 rounded bg-slate-800"></div></div>
<div class="bg-slate-900 p-4 rounded-2xl"><button onclick="saveSettings()" class="bg-blue-600 px-6 py-3 rounded-xl font-black">💾 Save All Settings - 14. Settings</button><button onclick="downloadBackup()" class="ml-2 bg-emerald-600 px-4 py-2 rounded">Download Backup</button></div>
</div>`;}
function saveSettings(){settings.shopName=document.getElementById('s_shopName').value;settings.shopCode=document.getElementById('s_shopCode').value;settings.phone=document.getElementById('s_phone').value;settings.address=document.getElementById('s_address').value;settings.tin=document.getElementById('s_tin').value;settings.vatNum=document.getElementById('s_vatNum').value;settings.currency=document.getElementById('s_currency').value;settings.usdToZwg=parseFloat(document.getElementById('s_rate').value)||36.5;settings.vat=parseFloat(document.getElementById('s_vat').value)||15;settings.lowStock=parseInt(document.getElementById('s_low').value)||10;settings.allowNegative=document.getElementById('s_neg').value==='true';settings.maxDiscount=parseInt(document.getElementById('s_maxDisc').value)||10;settings.zimraStatus=document.getElementById('s_zimra').value;settings.zimraDeviceId=document.getElementById('s_zimraId').value;settings.zimraModel=document.getElementById('s_zimraModel').value;settings.zimraModelVer=document.getElementById('s_zimraVer').value;settings.receiptHeader=document.getElementById('s_rHeader').value;settings.receiptFooter=document.getElementById('s_rFooter').value;saveAll();renderMenu();alert('✅ Settings 14. Saved - Proper Numbering V3.1');renderModule('settings');}
function downloadBackup(){const data={products,pos,grns,customers,suppliers,expenses,purchaseOrders,settings,audit,exported:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SmartPOS-V3.1-Backup-'+settings.shopCode+'.json';a.click();}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.products)products=d.products;if(d.pos)pos=d.pos;if(d.grns)grns=d.grns;if(d.customers)customers=d.customers;if(d.suppliers)suppliers=d.suppliers;if(d.expenses)expenses=d.expenses;if(d.purchaseOrders)purchaseOrders=d.purchaseOrders;if(d.settings)settings=d.settings;saveAll();location.reload();}catch(err){alert('Invalid');}};r.readAsText(file);}
window.onerror=(m,u,l)=>{document.getElementById('contentArea').innerHTML+=`<div class="bg-red-900 p-2 mt-2">Error ${m} @ ${l}</div>`;return false;};
</script></body></html>
