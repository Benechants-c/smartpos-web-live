<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartPOS BACK OFFICE LIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f1f5f9;color:#0f172a;padding-bottom:40px}
.top{background:#0f172a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.top b{font-size:18px}.top small{color:#94a3b8;display:block;font-weight:400}
.topMenu{background:#22c55e;border:0;padding:10px 14px;border-radius:9px;font-weight:800}
.badge{background:#dcfce7;color:#166534;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block;margin:12px 16px}
.main{padding:0 12px}.card{background:#fff;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card h2{margin:0 0 6px;font-size:20px}.card p.sub{color:#64748b;margin:0 0 14px;font-size:14px}
.menuBtn2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:0;padding:16px;border-radius:14px;margin:8px 0;font-size:17px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.menuBtn2 span{font-size:26px;background:#f1f5f9;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px}.menuBtn2 small{display:block;color:#64748b;font-size:13px;font-weight:400}.menuBtn2 b{font-size:16px}
.back{background:#0f172a;color:#fff;border:0;padding:10px 14px;border-radius:9px;margin:12px 0;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}.kpi{flex:1;min-width:105px;background:#fff;padding:16px;border-radius:14px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.06)}.kpi h2{margin:0;font-size:22px}.kpi small{color:#64748b}.kpi.green h2{color:#16a34a}.kpi.red h2{color:#dc2626}
label{font-size:13px;font-weight:700;color:#334155}input,select{width:100%;padding:13px;margin:6px 0 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:15px}
button.btn{background:#16a34a;color:#fff;border:0;padding:14px;border-radius:11px;font-weight:800;cursor:pointer;width:100%;font-size:16px}button.btnBlue{background:#2563eb;color:#fff;border:0;padding:11px 14px;border-radius:10px;cursor:pointer}button.btnGray{background:#e2e8f0;border:0;padding:10px 12px;border-radius:9px;cursor:pointer}button.del{background:#fee2e2;color:#dc2626;border:0;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:#f8fafc;text-align:left;padding:11px 8px;color:#475569;font-size:12px;text-transform:uppercase}td{padding:11px 8px;border-top:1px solid #e2e8f0;vertical-align:middle}
.pill{padding:4px 9px;border-radius:20px;font-size:12px;font-weight:700}.pill.ok{background:#dcfce7;color:#166534}.pill.low{background:#fef9c3;color:#854d0e}.pill.out{background:#fee2e2;color:#991b1b}
.posGrid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:700px){.posGrid{grid-template-columns:1.2fr .8fr}}
.prodRow{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin:8px 0}
.receipt{background:#fff;color:#000;padding:16px;border-radius:10px;margin:10px 0;font-family:monospace;border:1px dashed #94a3b8;text-align:center}
</style></head><body>
<div class="top"><div><b>SmartPOS</b><small>BACK OFFICE LIVE • SHOP001-HRE</small></div><button class="topMenu" onclick="go('home')">☰ Menu</button></div>
<div><span class="badge">● SHOP001-HRE | 80mm Thermal | ZIMRA OFF</span></div>
<div class="main" id="app"></div>
<script>
var view='home';
var P=[];try{P=JSON.parse(localStorage.getItem('sp_p')||'[]');if(!Array.isArray(P))P=[];}catch(e){P=[];}
var S=[];try{S=JSON.parse(localStorage.getItem('sp_s')||'[]');if(!Array.isArray(S))S=[];}catch(e){S=[];}
var C=[];try{C=JSON.parse(localStorage.getItem('sp_c')||'[]');if(!Array.isArray(C))C=[];}catch(e){C=[];}
var E=[];try{E=JSON.parse(localStorage.getItem('sp_e')||'[]');if(!Array.isArray(E))E=[];}catch(e){E=[];}
var SUP=[];try{SUP=JSON.parse(localStorage.getItem('sp_sup')||'[]');if(!Array.isArray(SUP))SUP=[];}catch(e){SUP=[];}
var cart=[];
if(location.search.indexOf('reset=1')>-1){localStorage.clear();P=[];S=[];C=[];E=[];SUP=[];}
function save(){try{localStorage.setItem('sp_p',JSON.stringify(P));localStorage.setItem('sp_s',JSON.stringify(S));localStorage.setItem('sp_c',JSON.stringify(C));localStorage.setItem('sp_e',JSON.stringify(E));localStorage.setItem('sp_sup',JSON.stringify(SUP));}catch(e){}}
function go(v){view=v;render();window.scrollTo(0,0);}
function total(){var t=0;for(var i=0;i<S.length;i++)t+=Number(S[i].total||S[i].pr||0);return t;}
function totalExp(){var t=0;for(var i=0;i<E.length;i++)t+=Number(E[i].amt||0);return t;}
function back(){return '<button class="back" onclick="go(\'home\')">← Back to Menu</button>';}
function addP(){var n=document.getElementById('pn').value.trim();if(!n){alert('Enter name');return;}P.push({code:'PRD'+String(P.length+1).padStart(3,'0'),n:n,pr:Number(document.getElementById('pp').value||0),cost:Number(document.getElementById('pc').value||0),q:Number(document.getElementById('pq').value||0),cat:document.getElementById('pCat').value});save();render();alert('Saved: '+n);}
function delP(i){if(!confirm('Delete '+P[i].n+'?'))return;P.splice(i,1);save();render();}
function addCart(i){if(P[i].q<=0){alert('Out of stock');return;}var f=null;for(var k=0;k<cart.length;k++)if(cart[k].idx==i)f=cart[k];if(f)f.qty++;else cart.push({idx:i,n:P[i].n,pr:P[i].pr,qty:1});render();}
function cartT(){var t=0;for(var i=0;i<cart.length;i++)t+=cart[i].pr*cart[i].qty;return t;}
function checkout(){if(!cart.length){alert('Cart empty');return;}var tot=cartT();for(var i=0;i<cart.length;i++){P[cart[i].idx].q-=cart[i].qty;}S.unshift({items:JSON.parse(JSON.stringify(cart)),total:tot,d:new Date().toLocaleString()});cart=[];save();render();alert('Sale saved! Total $'+tot);}
function addC(){var n=document.getElementById('cuN').value.trim();if(!n)return;C.push({n:n,p:document.getElementById('cuP').value||''});save();render();}
function addSUP(){var n=document.getElementById('suN').value.trim();if(!n)return;SUP.push({n:n,p:document.getElementById('suP').value||''});save();render();}
function addE(){var n=document.getElementById('exN').value.trim();if(!n)return;E.push({n:n,amt:Number(document.getElementById('exA').value||0),d:new Date().toLocaleString()});save();render();}
function pill(q){if(q<=0)return '<span class="pill out">OUT</span>';if(q<5)return '<span class="pill low">LOW</span>';return '<span class="pill ok">IN STOCK</span>';}
function render(){
var h='';
if(view=='home'){
h='<div class="card"><h2>Welcome back 👋</h2><p class="sub">SHOP001-HRE • Harare • Choose a module to start</p><div class="row"><div class="kpi green"><h2>$'+total().toFixed(2)+'</h2><small>Total Sales</small></div><div class="kpi"><h2>'+S.length+'</h2><small>Receipts</small></div><div class="kpi"><h2>'+P.length+'</h2><small>Products</small></div></div></div>';
var m=[['dashboard','📊','1. Dashboard','Sales, stock & profit at a glance'],['pos','🛒','2. POS / New Sale','Fast checkout'],['products','📦','3. Products PRD','Price, cost & stock'],['purchasing','🛍️','4. Purchasing PO','Order from suppliers'],['grn','📥','5. GRN - Receive','Receive delivered stock'],['sales','🧾','6. Sales / Receipts','All receipts'],['stocktake','📋','Stock Take','Count & verify'],['customers','👥','7. Customers','Customer database'],['suppliers','🏭','8. Suppliers','Supplier database'],['expenses','💸','9. Expenses & Cash','Cash in hand'],['reports','📈','10. Reports Profit','Profit & performance'],['users','👤','11. Users','Staff accounts'],['branches','🏢','12. Branches','Shop branches'],['audit','📜','13. Audit Log','Activity history'],['settings','⚙️','14. Settings & ZIMRA','Shop & printer']];
for(var i=0;i<m.length;i++){h+='<button class="menuBtn2" onclick="go(\''+m[i][0]+'\')"><span>'+m[i][1]+'</span><div><b>'+m[i][2]+'</b><small>'+m[i][3]+'</small></div><div style="margin-left:auto;color:#94a3b8">›</div></button>';}
}
else if(view=='dashboard'){h=back()+'<div class="card"><h2>📊 Dashboard</h2><p class="sub">Today • SHOP001-HRE</p><div class="row"><div class="kpi green"><h2>$'+total().toFixed(2)+'</h2><small>Total Sales</small></div><div class="kpi"><h2>'+S.length+'</h2><small>Sales</small></div><div class="kpi"><h2>'+P.length+'</h2><small>Products</small></div><div class="kpi"><h2>$'+(total()-totalExp()).toFixed(2)+'</h2><small>Profit</small></div></div></div><div class="card"><h2>Low Stock Alert</h2><p class="sub">Products below 5 units</p><table><tr><th>Product</th><th>Stock</th><th>Status</th></tr>'+(P.filter(function(p){return p.q<5}).length==0?'<tr><td colspan="3">✅ All stock OK</td></tr>':P.filter(function(p){return p.q<5}).map(function(p){return '<tr><td><b>'+p.n+'</b></td><td>'+p.q+'</td><td>'+pill(p.q)+'</td></tr>';}).join(''))+'</table></div>';}
else if(view=='pos'){h=back()+'<div class="posGrid"><div class="card"><h2>🛒 POS / New Sale</h2><p class="sub">Tap Add to add to cart</p>'+(P.length==0?'<p>No products. Add in Products first.</p>':P.map(function(p,i){return '<div class="prodRow"><div><b>'+p.n+'</b><br><small style="color:#64748b">$'+p.pr.toFixed(2)+' • Stock: '+p.q+' • '+pill(p.q)+'</small></div><button class="btnBlue" onclick="addCart('+i+')">Add +</button></div>';}).join(''))+'</div><div class="card"><h2>🧺 Cart</h2><p class="sub">'+cart.length+' items</p><table><tr><th>Item</th><th>Qty</th><th>Amount</th></tr>'+(cart.length==0?'<tr><td colspan="3">Cart empty</td></tr>':cart.map(function(c){return '<tr><td>'+c.n+'</td><td>x'+c.qty+'</td><td>$'+(c.pr*c.qty).toFixed(2)+'</td></tr>';}).join(''))+'</table><div style="display:flex;justify-content:space-between;margin:14px 0;font-size:18px"><b>Total</b><b>$'+cartT().toFixed(2)+'</b></div><button class="btn" onclick="checkout()">✅ Checkout • Print Receipt</button><button class="btnGray" style="width:100%;margin-top:8px" onclick="cart=[];render()">Clear Cart</button></div></div>';}
else if(view=='products'){h=back()+'<div class="card"><h2>📦 Add New Product</h2><p class="sub">Fill in and save</p><label>Product Name</label><input id="pn" placeholder="e.g Coca-Cola 500ml"><div class="row"><div style="flex:1"><label>Selling Price $</label><input id="pp" type="number" placeholder="1.50"></div><div style="flex:1"><label>Cost Price $</label><input id="pc" type="number" placeholder="1.00"></div></div><div class="row"><div style="flex:1"><label>Quantity</label><input id="pq" type="number" placeholder="20"></div><div style="flex:1"><label>Category</label><select id="pCat"><option>General</option><option>Drinks</option><option>Food</option><option>Groceries</option><option>Other</option></select></div></div><button class="btn" onclick="addP()">💾 Save Product</button></div><div class="card"><h2>Product List</h2><p class="sub">'+P.length+' products</p><div style="overflow:auto"><table><tr><th>Code</th><th>Product</th><th>Price</th><th>Cost</th><th>Stock</th><th>Status</th><th></th></tr>'+(P.length==0?'<tr><td colspan="7">No products yet</td></tr>':P.map(function(p,i){return '<tr><td>'+p.code+'</td><td><b>'+p.n+'</b><br><small style="color:#64748b">'+p.cat+'</small></td><td>$'+p.pr.toFixed(2)+'</td><td>$'+(p.cost||0).toFixed(2)+'</td><td>'+p.q+'</td><td>'+pill(p.q)+'</td><td><button class="del" onclick="delP('+i+')">Delete</button></td></tr>';}).join(''))+'</table></div></div>';}
else if(view=='purchasing'){h=back()+'<div class="card"><h2>🛍️ Purchasing PO</h2><p class="sub">Create purchase order</p><label>Supplier</label><select><option>Select supplier</option>'+SUP.map(function(s){return '<option>'+s.n+'</option>';}).join('')+'</select><label>Item to Order</label><input id="poN" placeholder="e.g Sugar 2kg"><label>Quantity</label><input id="poQ" type="number" placeholder="10"><button class="btn" onclick="alert(\'PO Created: \'+document.getElementById(\'poN\').value)">📝 Create Purchase Order</button></div><div class="card"><h2>How it works</h2><p class="sub">1. Create PO → 2. Supplier delivers → 3. Go to GRN to add stock</p><button class="btnBlue" onclick="go(\'grn\')">Go to GRN →</button></div>';}
else if(view=='grn'){h=back()+'<div class="card"><h2>📥 GRN - Receive Stock</h2><p class="sub">Tap Receive to add stock</p><table><tr><th>Product</th><th>Current Stock</th><th>Action</th></tr>'+(P.length==0?'<tr><td colspan="3">No products</td></tr>':P.map(function(p,i){return '<tr><td><b>'+p.n+'</b></td><td>'+p.q+'</td><td><button class="btnBlue" onclick="P['+i+'].q+=10;save();render();">+10 Receive</button> <button class="btnGray" onclick="P['+i+'].q+=1;save();render();">+1</button></td></tr>';}).join(''))+'</table></div>';}
else if(view=='sales'){h=back()+'<div class="card"><h2>🧾 Sales / Receipts</h2><p class="sub">Total: $'+total().toFixed(2)+' • '+S.length+' receipts</p></div>'+(S.length==0?'<div class="card"><p>No sales yet</p></div>':S.map(function(s,idx){return '<div class="receipt"><b>SmartPOS • SHOP001-HRE</b><br><small>'+s.d+'</small><br>------------------------------<br>'+s.items.map(function(it){return it.n+' x'+it.qty+' — $'+(it.pr*it.qty).toFixed(2);}).join('<br>')+'<br>------------------------------<br><b>TOTAL: $'+s.total.toFixed(2)+'</b><br>Thank you! Come Again!</div>';}).join(''));}
else if(view=='stocktake'){h=back()+'<div class="card"><h2>📋 Stock Take</h2><p class="sub">Compare system vs physical count</p><table><tr><th>Product</th><th>System Stock</th><th>Value</th><th>Status</th></tr>'+(P.length==0?'<tr><td colspan="4">No products</td></tr>':P.map(function(p){return '<tr><td><b>'+p.n+'</b></td><td>'+p.q+'</td><td>$'+(p.q*p.pr).toFixed(2)+'</td><td>'+pill(p.q)+'</td></tr>';}).join(''))+'</table></div>';}
else if(view=='customers'){h=back()+'<div class="card"><h2>👥 Add Customer</h2><label>Full Name</label><input id="cuN" placeholder="e.g Tinashe Moyo"><label>Phone</label><input id="cuP" placeholder="077..."><button class="btn" onclick="addC()">➕ Add Customer</button></div><div class="card"><h2>Customer List</h2><table><tr><th>#</th><th>Name</th><th>Phone</th></tr>'+(C.length==0?'<tr><td colspan="3">No customers yet</td></tr>':C.map(function(c,i){return '<tr><td>'+(i+1)+'</td><td><b>'+c.n+'</b></td><td>'+c.p+'</td></tr>';}).join(''))+'</table></div>';}
else if(view=='suppliers'){h=back()+'<div class="card"><h2>🏭 Add Supplier</h2><label>Supplier Name</label><input id="suN" placeholder="e.g Delta Beverages"><label>Phone</label><input id="suP" placeholder="077..."><button class="btn" onclick="addSUP()">➕ Add Supplier</button></div><div class="card"><h2>Supplier List</h2><table><tr><th>#</th><th>Name</th><th>Phone</th></tr>'+(SUP.length==0?'<tr><td colspan="3">No suppliers yet</td></tr>':SUP.map(function(s,i){return '<tr><td>'+(i+1)+'</td><td><b>'+s.n+'</b></td><td>'+s.p+'</td></tr>';}).join(''))+'</table></div>';}
else if(view=='expenses'){h=back()+'<div class="card"><h2>💸 Expenses & Cash</h2><div class="row"><div class="kpi green"><h2>$'+total().toFixed(2)+'</h2><small>Total Sales</small></div><div class="kpi red"><h2>$'+totalExp().toFixed(2)+'</h2><small>Expenses</small></div><div class="kpi"><h2>$'+(total()-totalExp()).toFixed(2)+'</h2><small>Cash in Hand</small></div></div></div><div class="card"><h2>Add Expense</h2><label>Expense Name</label><input id="exN" placeholder="e.g Rent, Transport"><label>Amount $</label><input id="exA" type="number" placeholder="50"><button class="btn" onclick="addE()">➕ Add Expense</button></div><div class="card"><h2>Expense List</h2><table><tr><th>Expense</th><th>Amount</th><th>Date</th></tr>'+(E.length==0?'<tr><td colspan="3">No expenses</td></tr>':E.map(function(e){return '<tr><td><b>'+e.n+'</b></td><td>$'+e.amt.toFixed(2)+'</td><td>'+e.d+'</td></tr>';}).join(''))+'</table></div>';}
else if(view=='reports'){h=back()+'<div class="card"><h2>📈 Reports Profit</h2><p class="sub">Performance summary</p><table><tr><th>Metric</th><th>Value</th></tr><tr><td>Total Sales</td><td><b>$'+total().toFixed(2)+'</b></td></tr><tr><td>Total Expenses</td><td><b>$'+totalExp().toFixed(2)+'</b></td></tr><tr><td>Net Profit</td><td><b>$'+(total()-totalExp()).toFixed(2)+'</b></td></tr><tr><td>Total Receipts</td><td><b>'+S.length+'</b></td></tr><tr><td>Total Products</td><td><b>'+P.length+'</b></td></tr><tr><td>Total Customers</td><td><b>'+C.length+'</b></td></tr></table></div>';}
else if(view=='users'){h=back()+'<div class="card"><h2>👤 Users</h2><table><tr><th>Name</th><th>Role</th><th>Access</th></tr><tr><td><b>Admin</b></td><td>Owner</td><td><span class="pill ok">Full Access</span></td></tr><tr><td><b>Cashier</b></td><td>Staff</td><td><span class="pill low">POS Only</span></td></tr></table></div>';}
else if(view=='branches'){h=back()+'<div class="card"><h2>🏢 Branches</h2><table><tr><th>Branch</th><th>Location</th><th>Status</th></tr><tr><td><b>SHOP001-HRE</b></td><td>Harare</td><td><span class="pill ok">Active</span></td></tr></table></div>';}
else if(view=='audit'){h=back()+'<div class="card"><h2>📜 Audit Log</h2><p class="sub">System activity</p><table><tr><th>Activity</th><th>Count</th></tr><tr><td>Sales made</td><td>'+S.length+'</td></tr><tr><td>Products created</td><td>'+P.length+'</td></tr><tr><td>Customers added</td><td>'+C.length+'</td></tr><tr><td>Last sale</td><td>'+(S.length?S[0].d:'None')+'</td></tr></table></div>';}
else if(view=='settings'){h=back()+'<div class="card"><h2>⚙️ Settings & ZIMRA</h2><table><tr><th>Setting</th><th>Value</th></tr><tr><td>Shop Name</td><td><b>SHOP001-HRE</b></td></tr><tr><td>Thermal Printer</td><td><b>80mm</b></td></tr><tr><td>ZIMRA Mode</td><td><b>OFF</b></td></tr><tr><td>Currency</td><td><b>USD $</b></td></tr></table><br><button class="btnGray" style="width:100%" onclick="if(confirm(\'Clear all data?\')){localStorage.clear();location.reload();}">🗑️ Clear All Data</button></div>';}
document.getElementById('app').innerHTML=h;
}
render();
</script></body></html>
