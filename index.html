return `<div class="space-y-3">

function showSalesByFilter(type){
let filtered=[];const t=todayStr();const y=yesterdayStr();
if(type==='today')filtered=pos.filter(s=>new Date(s.date).toISOString().split('T')[0]===t);
else if(type==='yesterday')filtered=pos.filter(s=>new Date(s.date).toISOString().split('T')[0]===y);
else if(type==='week')filtered=pos.filter(s=>{const d=new Date(s.date);const diff=(new Date()-d)/(1000*3600*24);return diff<=7;});
else if(type==='month')filtered=pos.filter(s=>{const d=new Date(s.date);return d.getMonth()===new Date().getMonth()&&d.getFullYear()===new Date().getFullYear();});
const el=document.getElementById('dashDetail');el.classList.remove('hidden');
el.innerHTML=`<h3 class="font-bold">${type} Sales - ${filtered.length} receipts - $${filtered.reduce((s,r)=>s+r.total,0).toFixed(2)}</h3><table class="w-full mt-2"><tr><th class="th">Receipt</th><th class="th">Date</th><th class="th">Total</th><th class="th">Profit</th></tr>${filtered.map(s=>`<tr class="row"><td class="td font-mono">${s.id}</td><td class="td text-[11px]">${new Date(s.date).toLocaleString()}</td><td class="td font-bold">$${s.total.toFixed(2)}</td><td class="td text-emerald-400">$${(s.total-s.cogs).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=4 class="td text-center">No sales</td></tr>'}</table><button onclick="document.getElementById('dashDetail').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[10px]">Close</button>`;
el.scrollIntoView({behavior:'smooth'});
logAudit('Dashboard View '+type+' Sales');
}
function showCustomSales(){
const from=document.getElementById('dash_from').value;const to=document.getElementById('dash_to').value;
if(!from||!to){alert('Select From and To dates');return;}
const filtered=filterByDateRange(pos,from,to);
document.getElementById('customSalesResult').innerHTML=`Found ${filtered.length} receipts $${filtered.reduce((s,r)=>s+r.total,0).toFixed(2)} Profit $${filtered.reduce((s,r)=>s+(r.total-r.cogs),0).toFixed(2)}`;
showSalesByFilterCustom(filtered,from,to);
}
function showSalesByFilterCustom(filtered,from,to){
const el=document.getElementById('dashDetail');el.classList.remove('hidden');
el.innerHTML=`<h3 class="font-bold">Custom Date Range ${from} to ${to} - ${filtered.length} receipts - $${filtered.reduce((s,r)=>s+r.total,0).toFixed(2)}</h3><table class="w-full mt-2"><tr><th class="th">Receipt</th><th class="th">Date</th><th class="th">Total</th><th class="th">Profit</th></tr>${filtered.map(s=>`<tr class="row"><td class="td font-mono">${s.id}</td><td class="td text-[11px]">${new Date(s.date).toLocaleString()}</td><td class="td font-bold">$${s.total.toFixed(2)}</td><td class="td text-emerald-400">$${(s.total-s.cogs).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=4 class="td text-center">No sales in range</td></tr>'}</table><button onclick="document.getElementById('dashDetail').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[10px]">Close</button>`;
el.scrollIntoView({behavior:'smooth'});
}
function showPaymentSales(type){
let filtered=[];
if(type==='cash')filtered=pos.filter(s=>(s.payment||'').toLowerCase().includes('cash'));
else if(type==='mobile')filtered=pos.filter(s=>{const p=(s.payment||'').toLowerCase();return p.includes('ecocash')||p.includes('mobile')||p.includes('zig')||p.includes('transfer');});
else if(type==='card')filtered=pos.filter(s=>(s.payment||'').toLowerCase().includes('card'));
else if(type==='credit')filtered=pos.filter(s=>(s.payment||'').toLowerCase().includes('credit'));
else filtered=pos.filter(s=>{const p=(s.payment||'').toLowerCase();return !p.includes('cash')&&!p.includes('card')&&!p.includes('credit')&&!p.includes('ecocash')&&!p.includes('mobile')&&!p.includes('transfer')&&p!=='';});
const el=document.getElementById('dashDetail');el.classList.remove('hidden');
el.innerHTML=`<h3 class="font-bold">${type} Sales - ${filtered.length} receipts - $${filtered.reduce((s,r)=>s+r.total,0).toFixed(2)}</h3><table class="w-full mt-2"><tr><th class="th">Receipt</th><th class="th">Payment</th><th class="th">Total</th></tr>${filtered.map(s=>`<tr class="row"><td class="td font-mono">${s.id}</td><td class="td">${s.payment}</td><td class="td font-bold">$${s.total.toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=3 class="td text-center">No sales</td></tr>'}</table><button onclick="document.getElementById('dashDetail').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[10px]">Close</button>`;
el.scrollIntoView({behavior:'smooth'});
}
function reconcilePayments(){
const cash=pos.filter(s=>(s.payment||'').toLowerCase().includes('cash')).reduce((s,r)=>s+r.total,0);
const mobile=pos.filter(s=>{const p=(s.payment||'').toLowerCase();return p.includes('ecocash')||p.includes('mobile')||p.includes('zig')||p.includes('transfer');}).reduce((s,r)=>s+r.total,0);
const card=pos.filter(s=>(s.payment||'').toLowerCase().includes('card')).reduce((s,r)=>s+r.total,0);
const credit=pos.filter(s=>(s.payment||'').toLowerCase().includes('credit')).reduce((s,r)=>s+r.total,0);
const total=pos.reduce((s,r)=>s+r.total,0);
const el=document.getElementById('dashDetail');el.classList.remove('hidden');
el.innerHTML=`<h3 class="font-bold">Payment Reconciliation</h3><div class="mt-2 space-y-1 text-[12px]"><div>Cash: $${cash.toFixed(2)}</div><div>Mobile Money: $${mobile.toFixed(2)}</div><div>Card: $${card.toFixed(2)}</div><div>Credit: $${credit.toFixed(2)}</div><div class="font-black border-t border-slate-700 pt-1 mt-1">Total: $${total.toFixed(2)} | Reconciled: $${(cash+mobile+card+credit).toFixed(2)} | Difference: $${(total-(cash+mobile+card+credit)).toFixed(2)}</div></div><button onclick="document.getElementById('dashDetail').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[10px]">Close</button><button onclick="printReport('reconciliation')" class="mt-2 ml-2 bg-blue-600 btn text-[10px]">Print Reconciliation</button>`;
logAudit('Payment Reconciliation');
}
function showStockValue(){
const el=document.getElementById('dashDetail');el.classList.remove('hidden');
el.innerHTML=`<h3 class="font-bold">Stock Value Details - Cost vs Retail</h3><table class="w-full mt-2"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Stock</th><th class="th">Cost</th><th class="th">Cost Value</th><th class="th">Price</th><th class="th">Retail Value</th></tr>${products.map(p=>`<tr class="row"><td class="td font-mono">${p.code}</td><td class="td">${p.name}</td><td class="td">${p.stock}</td><td class="td">$${p.cost.toFixed(2)}</td><td class="td">$${(p.stock*p.cost).toFixed(2)}</td><td class="td">$${p.price.toFixed(2)}</td><td class="td">$${(p.stock*p.price).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=7 class="td text-center">No products</td></tr>'}</table><div class="mt-2 font-black">Total Cost Value: $${products.reduce((s,p)=>s+p.stock*p.cost,0).toFixed(2)} | Total Retail Value: $${products.reduce((s,p)=>s+p.stock*p.price,0).toFixed(2)}</div><button onclick="document.getElementById('dashDetail').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[10px]">Close</button>`;
}
function showLowStock(){

function showOutStock(){

}
function showProfitFilter(type){
let filtered=[];if(type==='today'){const t=todayStr();filtered=pos.filter(s=>new Date(s.date).toISOString().split('T')[0]===t);}else{filtered=pos.filter(s=>{const d=new Date(s.date);return d.getMonth()===new Date().getMonth()&&d.getFullYear()===new Date().getFullYear();});}
const el=document.getElementById('dashDetail');el.classList.remove('hidden');
el.innerHTML=`<h3 class="font-bold">${type} Gross Profit - $${filtered.reduce((s,r)=>s+(r.total-r.cogs),0).toFixed(2)}</h3><table class="w-full mt-2"><tr><th class="th">Receipt</th><th class="th">Sales</th><th class="th">COGS</th><th class="th">Profit</th></tr>${filtered.map(s=>`<tr class="row"><td class="td font-mono">${s.id}</td><td class="td">$${s.total.toFixed(2)}</td><td class="td">$${s.cogs.toFixed(2)}</td><td class="td text-emerald-400 font-bold">$${(s.total-s.cogs).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=4 class="td text-center">No sales</td></tr>'}</table><button onclick="document.getElementById('dashDetail').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[10px]">Close</button>`;
}
function showStockValuation(){
const el=document.getElementById('dashDetail');el.classList.remove('hidden');
const costVal=products.reduce((s,p)=>s+p.stock*p.cost,0);const retailVal=products.reduce((s,p)=>s+p.stock*p.price,0);
el.innerHTML=`<h3 class="font-bold">Stock Valuation Report</h3><div class="mt-2 text-[12px] space-y-1"><div>Total Stock Value (Cost): $${costVal.toFixed(2)}</div><div>Total Retail Value: $${retailVal.toFixed(2)}</div><div>Potential Gross Profit: $${(retailVal-costVal).toFixed(2)}</div><div>Margin: ${costVal>0?((retailVal-costVal)/costVal*100).toFixed(1):0}%</div></div><table class="w-full mt-3"><tr><th class="th">Code</th><th class="th">Stock</th><th class="th">Cost Value</th><th class="th">Retail Value</th><th class="th">Profit Potential</th></tr>${products.map(p=>`<tr class="row"><td class="td font-mono">${p.code}</td><td class="td">${p.stock}</td><td class="td">$${(p.stock*p.cost).toFixed(2)}</td><td class="td">$${(p.stock*p.price).toFixed(2)}</td><td class="td text-emerald-400">$${(p.stock*(p.price-p.cost)).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=5 class="td text-center">No products</td></tr>'}</table><button onclick="document.getElementById('dashDetail').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[10px]">Close</button><button onclick="printReport('stockValuation')" class="mt-2 ml-2 bg-blue-600 btn text-[10px]">Print Valuation</button>`;
}
function renderPOS(){
const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);
const cogs=posCart.reduce((s,i)=>s+i.qty*i.cost,0);
return `<div class="space-y-3">
<div class="flex justify-between flex-wrap gap-2 items-center"><h1 class="text-[16px] font-black">🛒 2. POS / New Sale - 31 REAL BUTTONS (No Discount as per spec)</h1><div class="flex gap-1.5"><button onclick="printReport('pos')" class="bg-slate-700 btn text-[10px]">🖨️ Print</button><button onclick="exportPDF('pos')" class="bg-blue-600 btn text-[10px]">📄 PDF</button></div></div>

<div class="grid lg:grid-cols-5 gap-3">
<div class="lg:col-span-3 space-y-3">

<div class="card"><h3 class="font-bold text-[11px] text-blue-400">A. Product Selection (6 buttons - REAL)</h3>
<div class="flex gap-1.5 mt-2 flex-wrap">

<select id="posCatFilter" onchange="filterPOS()" class="input w-[110px]"><option value="">All Categories</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select>
</div>
<div class="flex gap-1 mt-2 flex-wrap">
<button onclick="browseProducts()" class="bg-blue-600 btn text-[9px]">Browse Products</button>
<button onclick="browseCategories()" class="bg-slate-700 btn text-[9px]">Browse Categories</button>
<button onclick="scanBarcode()" class="bg-purple-600 btn text-[9px]">Scan Barcode</button>
<button onclick="filterPOS()" class="bg-emerald-600 btn text-[9px]">Search Products</button>
</div>
<div class="overflow-x-auto mt-2"><table class="w-full"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Stock</th><th class="th">Price</th><th class="th">View Details</th><th class="th">Add to Cart</th></tr><tbody id="posList">${products.map((p,idx)=>`<tr class="row"><td class="td font-mono font-bold text-[11px]">${p.code}</td><td class="td">${p.name}</td><td class="td ${p.stock<=0?'text-red-400':''}">${p.stock}</td><td class="td font-bold">$${p.price.toFixed(2)}</td><td class="td"><button onclick="viewProductDetails(${idx})" class="bg-slate-700 px-2 py-1 rounded text-[9px]">View Details</button></td><td class="td"><button onclick="addToCart(${idx})" class="bg-blue-600 px-3 py-1 rounded text-[10px]">Add Product to Cart</button></td></tr>`).join('')||'<tr><td colspan=6 class="td text-center py-6 text-slate-500">No products - Add in Products PRD</td></tr>'}</tbody></table></div>
<div id="posProdDetail" class="hidden mt-2 p-2 bg-[#020617] rounded-xl border border-slate-700 text-[11px]"></div>
</div>
</div>

<div class="lg:col-span-2 space-y-3">

<div class="card border-emerald-900/30"><h3 class="font-bold text-[11px] text-emerald-400">B. Shopping Cart (8 buttons - REAL)</h3>
<div class="mt-2"><table class="w-full text-[11px]"><tr><th class="th">Code</th><th class="th">Qty (Increase/Reduce/Edit)</th><th class="th">Price</th><th class="th">Total</th><th class="th">Remove</th></tr><tbody>${posCart.map((c,i)=>`<tr class="row"><td class="td font-mono text-[9px]">${c.code}</td><td class="td"><div class="flex items-center gap-1"><button onclick="changeQty(${i},-1)" class="bg-slate-800 px-1.5 py-1 rounded text-[9px]">Reduce -</button><button onclick="editQty(${i})" class="bg-blue-800 px-1.5 py-1 rounded text-[9px]">${c.qty}</button><button onclick="changeQty(${i},1)" class="bg-slate-800 px-1.5 py-1 rounded text-[9px]">Increase +</button></div></td><td class="td">$${c.price.toFixed(2)}</td><td class="td font-bold">$${(c.qty*c.price).toFixed(2)}</td><td class="td"><button onclick="removeItem(${i})" class="text-red-400 text-[10px]">Remove Item</button></td></tr>`).join('')||'<tr><td colspan=5 class="td text-center text-slate-500">Cart Empty</td></tr>'}</tbody></table></div>
<div class="mt-2 p-2.5 bg-[#020617] rounded-xl border border-slate-700 space-y-1.5">
<div class="flex justify-between text-[11px]"><span>Calculate Subtotal</span><span id="subtotalDisplay">$${total.toFixed(2)}</span></div>
<div class="flex justify-between font-black text-[14px] border-t border-slate-700 pt-1"><span>Calculate Total</span><span>$${total.toFixed(2)}</span></div>
<div class="flex gap-1 mt-2">
<button onclick="clearCart()" class="bg-red-600 btn text-[9px] flex-1">Clear Cart</button>
<button onclick="viewCart()" class="bg-slate-700 btn text-[9px] flex-1">View Cart</button>
</div>
</div>
</div>

<div class="card"><h3 class="font-bold text-[11px] text-amber-400">C. Customer & Payment (9 buttons - REAL - No Discount)</h3>
<div class="space-y-2 mt-2">
<div><label class="label">Select Customer (1)</label><select id="posCustomer" class="input">${customers.map(c=>`<option>${c.name}</option>`).join('')}</select></div>
<button onclick="addNewCustomerFromPOS()" class="bg-blue-600 btn text-[9px] w-full">Add New Customer</button>
<div class="grid grid-cols-2 gap-1 mt-1">
<button onclick="setPayment('Cash USD')" class="bg-emerald-600 btn text-[9px]">Cash Payment</button>
<button onclick="setPayment('EcoCash')" class="bg-blue-600 btn text-[9px]">Mobile Money Payment</button>
<button onclick="setPayment('Card')" class="bg-slate-700 btn text-[9px]">Card Payment</button>
<button onclick="setPayment('Credit')" class="bg-amber-600 btn text-[9px]">Credit Sale</button>

<button onclick="splitPayment()" class="bg-purple-600 btn text-[9px] w-full mt-1">Split Payment</button>
<div class="grid grid-cols-2 gap-1.5 mt-2">
<div><label class="label">Enter Amount Tendered (Real Calc)</label><input id="tendered" type="number" step="0.01" oninput="calcChange()" class="input font-bold text-[14px]" placeholder="${total.toFixed(2)}"></div>
<div><label class="label">Calculate Change (Live)</label><div id="changeDisplay" class="input bg-emerald-950/30 text-emerald-400 font-black text-[14px]">$0.00</div></div>
</div>
<div class="text-[9px] text-slate-400 mt-1">Profit on this sale: $${(total-cogs).toFixed(2)} | Payment: <span id="payMethodDisplay">Cash USD</span></div>
</div>
</div>

<div class="card border-blue-900/30"><h3 class="font-bold text-[11px] text-blue-400">D. Complete Sale (8 buttons - REAL)</h3>
<div class="space-y-1.5 mt-2">
<button onclick="checkout()" class="w-full bg-emerald-600 btn py-2.5 text-[12px]">Complete Sale - Pay $${total.toFixed(2)}</button>
<div class="grid grid-cols-2 gap-1">
<button onclick="holdSale()" class="bg-amber-600 btn text-[9px]">Hold Sale</button>
<button onclick="retrieveHeldSale()" class="bg-blue-600 btn text-[9px]">Retrieve Held Sale (${heldSales.length})</button>
<button onclick="cancelSale()" class="bg-red-600 btn text-[9px]">Cancel Sale</button>
<button onclick="printReceipt()" class="bg-slate-700 btn text-[9px]">Print Receipt</button>
<button onclick="reprintLast()" class="bg-slate-700 btn text-[9px]">Reprint Receipt</button>
<button onclick="emailReceipt()" class="bg-blue-800 btn text-[9px]">Email Receipt</button>
<button onclick="viewLastSale()" class="bg-[#1e293b] btn text-[9px] col-span-2">View Last Sale</button>
</div>
</div>
<div id="liveReceipt" class="card mt-2 hidden"><h3 class="font-bold text-[11px]">Live Receipt - Virtual Receipt Totals</h3><div id="receiptTape" class="receipt-tape mt-1.5"></div><div class="mt-2 flex gap-1"><button onclick="printReceipt()" class="bg-blue-600 btn text-[9px] flex-1">Print Receipt Upon Printing</button><button onclick="reprintLast()" class="bg-slate-700 btn text-[9px] flex-1">Double Tape Reprint</button></div></div>
</div>

</div>
</div>
</div>`;
}
function browseProducts(){filterPOS(); logAudit('Browse Products');}
function browseCategories(){const cat=prompt('Enter category to browse: '+categories.join(', '));if(cat){document.getElementById('posCatFilter').value=cat;filterPOS();}}
function scanBarcode(){const code=prompt('Scan Barcode - Enter Product Code:');if(code){const idx=products.findIndex(p=>p.code===code.toUpperCase());if(idx>=0)addToCart(idx);else alert('Product not found: '+code);}}
function viewProductDetails(idx){const p=products[idx];const el=document.getElementById('posProdDetail');el.classList.remove('hidden');el.innerHTML=`<div class="font-bold">${p.code} - ${p.name}</div><div>Category: ${p.cat} | Brand: ${p.brand||'N/A'} | UOM: ${p.uom||'Each'}</div><div>Cost: $${p.cost.toFixed(2)} | Price: $${p.price.toFixed(2)} | Stock: ${p.stock} | Supplier: ${p.supplier||''}</div><div>Description: ${p.desc||'No description'}</div><button onclick="document.getElementById('posProdDetail').classList.add('hidden')" class="mt-1 bg-slate-700 btn text-[9px]">Close Details</button>`;logAudit('View Product Details '+p.code);}
function filterPOS(){const q=(document.getElementById('posSearch')?.value||'').toLowerCase();const cat=document.getElementById('posCatFilter')?.value||'';const list=document.getElementById('posList');if(!list)return;list.innerHTML=products.filter(p=>{const mq=p.code.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)||(p.barcode||'').toLowerCase().includes(q);const mc=!cat||p.cat===cat;return mq&&mc;}).map(p=>{const idx=products.indexOf(p);return `<tr class="row"><td class="td font-mono font-bold text-[11px]">${p.code}</td><td class="td">${p.name}</td><td class="td ${p.stock<=0?'text-red-400':''}">${p.stock}</td><td class="td font-bold">$${p.price.toFixed(2)}</td><td class="td"><button onclick="viewProductDetails(${idx})" class="bg-slate-700 px-2 py-1 rounded text-[9px]">View Details</button></td><td class="td"><button onclick="addToCart(${idx})" class="bg-blue-600 px-3 py-1 rounded text-[10px]">Add Product to Cart</button></td></tr>`;}).join('')||'<tr><td colspan=6 class="td text-center py-4 text-slate-500">No products found</td></tr>';}
function addToCart(idx){const p=products[idx];if(p.stock<=0&&!settings.allowNegative){alert('Out of stock: '+p.code);return;}const ex=posCart.find(c=>c.code===p.code);if(ex)ex.qty++;else posCart.push({code:p.code,name:p.name,price:p.price,qty:1,cost:p.cost,cat:p.cat});logAudit('Add Product to Cart '+p.code);renderModule('pos');}
function changeQty(i,d){posCart[i].qty+=d;if(posCart[i].qty<=0)posCart.splice(i,1);renderModule('pos');calcChange();}
function editQty(i){const newQty=parseInt(prompt('Edit Quantity for '+posCart[i].code+' - Current: '+posCart[i].qty+' Enter new qty:'))||posCart[i].qty;if(newQty>0)posCart[i].qty=newQty;else posCart.splice(i,1);renderModule('pos');}
function removeItem(i){posCart.splice(i,1);logAudit('Remove Item');renderModule('pos');}
function clearCart(){if(confirm('Clear Cart?')){posCart=[];renderModule('pos');logAudit('Clear Cart');}}
function viewCart(){alert('Cart: '+posCart.length+' items Total $'+posCart.reduce((s,i)=>s+i.qty*i.price,0).toFixed(2));}
function setPayment(method){document.getElementById('payMethodDisplay').innerText=method;logAudit('Set Payment '+method);}
function addNewCustomerFromPOS(){const name=prompt('Add New Customer - Enter Full Name:');if(!name)return;const phone=prompt('Enter Phone Number:')||'';customers.push({name,phone,balance:0});saveAll();renderModule('pos');logAudit('Add New Customer '+name);}
function splitPayment(){const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);const cash=parseFloat(prompt('Split Payment - Enter Cash amount out of $'+total.toFixed(2)+':')||'0');const rest=total-cash;alert('Cash: $'+cash.toFixed(2)+' + Other: $'+rest.toFixed(2)+' = $'+total.toFixed(2)+' - Process as Split');logAudit('Split Payment Cash $'+cash+' Other $'+rest);}
function calcChange(){const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);const tender=parseFloat(document.getElementById('tendered')?.value)||0;const change=tender-total;const el=document.getElementById('changeDisplay');if(el){el.innerText='$'+change.toFixed(2);el.className='input font-black text-[14px] '+(change<0?'bg-red-950/30 text-red-400':'bg-emerald-950/30 text-emerald-400');}}
function holdSale(){if(posCart.length===0){alert('Cart empty');return;}heldSales.unshift({id:'H'+Date.now(),items:[...posCart],date:new Date().toISOString(),total:posCart.reduce((s,i)=>s+i.qty*i.price,0)});posCart=[];saveAll();renderModule('pos');logAudit('Hold Sale');alert('Sale Held - '+heldSales.length+' held sales');}
function retrieveHeldSale(){if(heldSales.length===0){alert('No held sales');return;}const list=heldSales.map((h,i)=>`${i}: ${h.id} - $${h.total.toFixed(2)} - ${new Date(h.date).toLocaleTimeString()}`).join('\n');const idx=parseInt(prompt('Retrieve Held Sale - Select index:\n'+list+'\nEnter index:'));if(!isNaN(idx)&&heldSales[idx]){posCart=heldSales[idx].items;heldSales.splice(idx,1);saveAll();renderModule('pos');logAudit('Retrieve Held Sale');}}
function cancelSale(){if(confirm('Cancel Sale? Cart will be cleared')){posCart=[];renderModule('pos');logAudit('Cancel Sale');}}
function emailReceipt(){if(!lastReceipt){alert('No last sale');return;}const email=prompt('Email Receipt - Enter customer email:');if(email){alert('Email sent to '+email+' for receipt '+lastReceipt.id+' (Simulated - Connect real email service)');logAudit('Email Receipt '+lastReceipt.id+' to '+email);}}
function viewLastSale(){if(!lastReceipt){alert('No last sale');return;}alert('Last Sale: '+lastReceipt.id+' Total $'+lastReceipt.total.toFixed(2)+' Payment '+lastReceipt.payment+' Customer '+lastReceipt.customer+' Change $'+(lastReceipt.change||0).toFixed(2));}
function checkout(){
if(posCart.length===0){alert('Cart empty - Add Product to Cart');return;}
const total=posCart.reduce((s,i)=>s+i.qty*i.price,0);
const cogs=posCart.reduce((s,i)=>s+i.qty*i.cost,0);
const tender=parseFloat(document.getElementById('tendered')?.value)||total;
if(tender<total){if(!confirm('Tendered $'+tender.toFixed(2)+' less than Total $'+total.toFixed(2)+' - Continue as Credit Sale?'))return;}
const change=tender-total;
const cust=document.getElementById('posCustomer')?.value||'Walk-in Customer';
const pay=document.getElementById('payMethodDisplay')?.innerText||'Cash USD';
posCart.forEach(c=>{const pr=products.find(pp=>pp.code===c.code);if(pr)pr.stock-=c.qty;});
const sale={id:'S'+Date.now(),items:[...posCart],total,cogs,customer:cust,payment:pay,tendered:tender,change,date:new Date().toISOString(),receiptNo:'R'+Date.now()};
pos.unshift(sale);lastReceipt=sale;posCart=[];saveAll();logAudit('Complete Sale '+sale.id+' $'+total+' '+pay+' Tendered $'+tender+' Change $'+change.toFixed(2));
showLiveReceipt(sale);renderModule('pos');setTimeout(()=>{document.getElementById('liveReceipt').classList.remove('hidden');document.getElementById('receiptTape').scrollIntoView({behavior:'smooth'});},200);
}

${settings.address}
Phone: ${settings.phone}
TIN: ${settings.tin} | VAT: ${settings.vatNum}

Receipt: ${s.id}
Date: ${new Date(s.date).toLocaleString()}
Customer: ${s.customer}
Payment: ${s.payment}

${s.items.map(it=>`${it.code} ${it.name}
 ${it.qty} x $${it.price.toFixed(2)} = $${(it.qty*it.price).toFixed(2)}`).join('\n')}

Subtotal: $${s.total.toFixed(2)}
VAT ${settings.vat}%: $${(s.total*settings.vat/100).toFixed(2)}
TOTAL: $${s.total.toFixed(2)}
Tendered: $${s.tendered.toFixed(2)}
Change: $${s.change.toFixed(2)}
Profit: $${(s.total-s.cogs).toFixed(2)}
ZWG Total: $${(s.total*settings.usdToZwg).toFixed(2)}

${settings.receiptHeader}
${settings.receiptFooter}
ZIMRA: ${settings.zimraStatus}

}
function printReceipt(){if(!lastReceipt){alert('No receipt to print - Complete a sale first');return;}const content=document.getElementById('receiptTape')?.innerText||'No receipt';const w=window.open('','','width=300,height=600');w.document.write(`<pre style="font-family:monospace;font-size:10px;white-space:pre-line">${content}</pre>`);w.document.close();w.print();logAudit('Print Receipt '+lastReceipt.id);}
function reprintLast(){if(!lastReceipt){alert('No last receipt');return;}showLiveReceipt(lastReceipt);document.getElementById('liveReceipt').classList.remove('hidden');logAudit('Reprint Receipt '+lastReceipt.id);}

function toggleProdForm(){const el=document.getElementById('prodForm');if(el)el.classList.toggle('hidden');document.getElementById('prodFormCard').scrollIntoView({behavior:'smooth'});}
function addCategory(){const cat=prompt('Add Category - Enter new category name:');if(cat&&cat.trim()){categories.push(cat.trim());saveAll();renderModule('products');logAudit('Add Category '+cat);}}
function editCategory(){const oldCat=prompt('Edit Category - Enter old category name: '+categories.join(', '));if(!oldCat||!categories.includes(oldCat)){alert('Category not found');return;}const newCat=prompt('Enter new name for '+oldCat+':',oldCat);if(newCat){const idx=categories.indexOf(oldCat);categories[idx]=newCat;products.forEach(p=>{if(p.cat===oldCat)p.cat=newCat;});saveAll();renderModule('products');logAudit('Edit Category '+oldCat+' to '+newCat);}}
function deleteCategory(){const cat=prompt('Delete Category - Enter category to delete: '+categories.join(', '));if(!cat||!categories.includes(cat)){alert('Not found');return;}if(confirm('Delete category '+cat+'? Products in this category will be moved to General')){categories=categories.filter(c=>c!==cat);products.forEach(p=>{if(p.cat===cat)p.cat='General';});saveAll();renderModule('products');logAudit('Delete Category '+cat);}}
function viewCategories(){const el=document.getElementById('catList');el.innerHTML=categories.map(c=>`<span class="bg-slate-800 px-2 py-1 rounded text-[10px]">${c} (${products.filter(p=>p.cat===c).length})</span>`).join(' ');logAudit('View Categories');}
function filterCategories(){const q=(document.getElementById('catSearch')?.value||'').toLowerCase();const el=document.getElementById('catList');if(!el)return;el.innerHTML=categories.filter(c=>c.toLowerCase().includes(q)).map(c=>`<span class="bg-slate-800 px-2 py-1 rounded text-[10px]">${c} (${products.filter(p=>p.cat===c).length})</span>`).join(' ');}
function updateCostPrice(){const code=prompt('Update Cost Price - Enter Product Code:');if(!code)return;const p=products.find(pp=>pp.code===code.toUpperCase());if(!p){alert('Not found');return;}const newCost=parseFloat(prompt('Current Cost $'+p.cost.toFixed(2)+' - Enter new Cost Price for '+p.code+':',p.cost));if(!isNaN(newCost)){p.cost=newCost;saveAll();renderModule('products');logAudit('Update Cost Price '+p.code+' to $'+newCost);}}
function updateSellingPrice(){const code=prompt('Update Selling Price - Enter Product Code:');if(!code)return;const p=products.find(pp=>pp.code===code.toUpperCase());if(!p){alert('Not found');return;}const newPrice=parseFloat(prompt('Current Price $'+p.price.toFixed(2)+' - Enter new Selling Price for '+p.code+':',p.price));if(!isNaN(newPrice)){p.price=newPrice;saveAll();renderModule('products');logAudit('Update Selling Price '+p.code+' to $'+newPrice);}}
function viewPriceHistory(){const code=prompt('View Price History - Enter Product Code:');if(!code)return;const p=products.find(pp=>pp.code===code.toUpperCase());if(!p){alert('Not found');return;}const el=document.getElementById('priceHistory');el.classList.remove('hidden');el.innerHTML=`<div class="p-2 bg-[#020617] rounded-xl border border-slate-700"><div class="font-bold">${p.code} - ${p.name} Price History</div><div>Cost: $${p.cost.toFixed(2)} | Price: $${p.price.toFixed(2)} | Margin: ${p.cost>0?(((p.price-p.cost)/p.cost)*100).toFixed(1):0}%</div><div class="text-[10px] text-slate-400">History tracking will show all price changes from audit log. Current: Cost $${p.cost} Price $${p.price}</div></div>`;logAudit('View Price History '+p.code);}
function bulkPriceUpdate(){const perc=parseFloat(prompt('Bulk Price Update - Enter percentage increase (e.g. 10 for 10% increase, -5 for 5% decrease):','10'));if(isNaN(perc)){alert('Invalid');return;}if(confirm('Update ALL products selling price by '+perc+'%?')){products.forEach(p=>{p.price=p.price*(1+perc/100);});saveAll();renderModule('products');logAudit('Bulk Price Update '+perc+'%');}}
function printPriceList(){const content=products.map(p=>`${p.code} | ${p.name} | Cost $${p.cost.toFixed(2)} | Price $${p.price.toFixed(2)} | Stock ${p.stock}`).join('\n');const w=window.open('','','width=600,height=800');w.document.write(`<pre>Price List - ${settings.shopName} - ${new Date().toLocaleString()}\n\n${content}</pre>`);w.document.close();w.print();logAudit('Print Price List');}
function viewStockBalance(){const el=document.getElementById('prodDetailPanel');el.classList.remove('hidden');el.innerHTML=`<h3 class="font-bold">View Stock Balance - ${products.length} products</h3><table class="w-full mt-2"><tr><th class="th">Code</th><th class="th">Name</th><th class="th">Stock</th><th class="th">Value</th></tr>${products.map(p=>`<tr class="row"><td class="td font-mono">${p.code}</td><td class="td">${p.name}</td><td class="td font-bold">${p.stock}</td><td class="td">$${(p.stock*p.cost).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=4 class="td text-center">No products</td></tr>'}</table><button onclick="document.getElementById('prodDetailPanel').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[9px]">Close</button>`;}
function viewStockByBranch(){const el=document.getElementById('prodDetailPanel');el.classList.remove('hidden');el.innerHTML=`<h3 class="font-bold">View Stock by Branch</h3><div class="text-[11px] mt-2">${branches.map(b=>`<div class="p-2 bg-[#020617] rounded border border-slate-800 mt-1"><div class="font-bold">${b.code} - ${b.name}</div><div>${products.length} products | Stock Value $${products.reduce((s,p)=>s+p.stock*p.cost,0).toFixed(2)}</div></div>`).join('')}</div><button onclick="document.getElementById('prodDetailPanel').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[9px]">Close</button>`;}
function viewStockMovement(){const el=document.getElementById('prodDetailPanel');el.classList.remove('hidden');const movements=[...grns.map(g=>({...g,type:'GRN',qty:'+'+g.qty})),...pos.flatMap(s=>s.items.map(it=>({code:it.code,name:it.name,qty:'-'+it.qty,date:s.date,type:'Sale'})))].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,30);el.innerHTML=`<h3 class="font-bold">View Stock Movement - Last 30</h3><table class="w-full mt-2"><tr><th class="th">Date</th><th class="th">Code</th><th class="th">Type</th><th class="th">Qty</th></tr>${movements.map(m=>`<tr class="row"><td class="td text-[10px]">${new Date(m.date).toLocaleDateString()}</td><td class="td font-mono">${m.code}</td><td class="td"><span class="px-1.5 py-0.5 rounded text-[9px] ${m.type==='Sale'?'bg-red-500/20 text-red-400':'bg-emerald-500/20 text-emerald-400'}">${m.type}</span></td><td class="td font-bold">${m.qty}</td></tr>`).join('')||'<tr><td colspan=4 class="td text-center">No movements</td></tr>'}</table><button onclick="document.getElementById('prodDetailPanel').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[9px]">Close</button>`;}
function viewProductHistory(){const code=prompt('View Product History - Enter Product Code:');if(!code)return;const p=products.find(pp=>pp.code===code.toUpperCase());if(!p){alert('Not found');return;}const history=audit.filter(a=>a.action.includes(p.code)).slice(0,20);const el=document.getElementById('prodDetailPanel');el.classList.remove('hidden');el.innerHTML=`<h3 class="font-bold">View Product History - ${p.code} - ${p.name}</h3><table class="w-full mt-2"><tr><th class="th">Date</th><th class="th">Action</th><th class="th">User</th></tr>${history.map(h=>`<tr class="row"><td class="td text-[10px]">${new Date(h.time).toLocaleString()}</td><td class="td">${h.action}</td><td class="td text-[10px]">${h.user}</td></tr>`).join('')||'<tr><td colspan=3 class="td text-center">No history yet</td></tr>'}</table><button onclick="document.getElementById('prodDetailPanel').classList.add('hidden')" class="mt-2 bg-slate-700 btn text-[9px]">Close</button>`;}
function focusEditProduct(){const code=prompt('Edit Product - Enter Product Code to edit:');if(!code)return;const idx=products.findIndex(p=>p.code===code.toUpperCase());if(idx>=0)editProduct(idx);else alert('Not found');}
function deleteSelectedProduct(){const code=prompt('Delete Product - Enter Product Code:');if(!code)return;const idx=products.findIndex(p=>p.code===code.toUpperCase());if(idx>=0)deleteProduct(idx);else alert('Not found');}
function activateProduct(){const code=prompt('Activate Product - Enter Code:');if(!code)return;const p=products.find(pp=>pp.code===code.toUpperCase());if(!p){alert('Not found');return;}p.active=true;saveAll();renderModule('products');logAudit('Activate Product '+p.code);}
function deactivateProduct(){const code=prompt('Deactivate Product - Enter Code:');if(!code)return;const p=products.find(pp=>pp.code===code.toUpperCase());if(!p){alert('Not found');return;}p.active=false;saveAll();renderModule('products');logAudit('Deactivate Product '+p.code);}
function saveProduct(){
const code=document.getElementById('pf_code').value.trim().toUpperCase();
const name=document.getElementById('pf_name').value.trim();
const cat=document.getElementById('pf_cat').value;
const barcode=document.getElementById('pf_barcode').value.trim();
const brand=document.getElementById('pf_brand').value.trim();
const uom=document.getElementById('pf_uom').value;
const cost=parseFloat(document.getElementById('pf_cost').value)||0;
const price=parseFloat(document.getElementById('pf_price').value)||0;
const min=parseInt(document.getElementById('pf_min').value)||0;
const max=parseInt(document.getElementById('pf_max').value)||0;
const reorder=parseInt(document.getElementById('pf_reorder').value)||10;
const sup=document.getElementById('pf_sup').value;
const desc=document.getElementById('pf_desc').value.trim();
const stock=parseInt(document.getElementById('pf_stock').value)||0;
if(!code||!name){alert('Product Code and Name required');return;}
if(editingProdIndex>=0){
products[editingProdIndex]={...products[editingProdIndex],code,name,cat,barcode,brand,uom,cost,price,min,max,reorder,supplier:sup,desc,stock,active:true};
editingProdIndex=-1;logAudit('Edit Product '+code);
}else{
if(products.find(p=>p.code===code)){alert('Code exists - Use Edit');return;}
products.push({code,name,cat,barcode,brand,uom,cost,price,min,max,reorder,supplier:sup,desc,stock,active:true});
logAudit('Add Product '+code);
}
saveAll();renderModule('products');
}

function importProducts(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const text=ev.target.result;const lines=text.split('\n');for(let i=1;i<lines.length;i++){const cols=lines[i].split(',');if(cols.length>=3){const code=cols[0].trim().toUpperCase();if(code&&!products.find(p=>p.code===code))products.push({code,name:cols[1].trim(),barcode:cols[2]||'',cat:cols[3]||'General',brand:cols[4]||'',uom:cols[5]||'Each',stock:parseInt(cols[6])||0,min:parseInt(cols[7])||0,max:parseInt(cols[8])||0,reorder:parseInt(cols[9])||10,cost:parseFloat(cols[10])||0,price:parseFloat(cols[11])||0,supplier:cols[13]||'',active:cols[14]!=='Inactive',desc:cols[15]||''});}}saveAll();renderModule('products');logAudit('Import Products');}catch(err){alert('Import failed '+err);}};r.readAsText(file);}

function saveDraftGRN(){
const code=document.getElementById('grn_code').value;const qty=parseInt(document.getElementById('grn_qty').value)||0;const qtyOrd=parseInt(document.getElementById('grn_qtyOrdered').value)||qty;const cost=parseFloat(document.getElementById('grn_cost').value)||0;const invoice=document.getElementById('grn_invoice').value||'';const grnNo=document.getElementById('grn_grnNo').value||'GRN-'+String(grns.length+125).padStart(6,'0');const branch=document.getElementById('grn_branch').value||'SHOP001-HRE';const recvDate=document.getElementById('grn_recvDate').value||new Date().toISOString();
let finalCode=code;let finalName='';
if(code==='NEW'){finalCode=document.getElementById('grn_new_code').value.trim().toUpperCase();finalName=document.getElementById('grn_new_name').value.trim();const price=parseFloat(document.getElementById('grn_new_price').value)||0;if(!finalCode||!finalName){alert('New Code and Name required');return;}if(products.find(p=>p.code===finalCode)){alert('Code exists');return;}const newProd={code:finalCode,name:finalName,cat:'General',cost,price:price||cost*1.5,stock:0,supplier:'',brand:'',uom:'Each',active:true};products.push(newProd);finalName=newProd.name;}else{const prod=products.find(p=>p.code===code);if(!prod){alert('Product not found');return;}finalName=prod.name;}
if(!finalCode||qty<=0){alert('Code and Qty Received required');return;}
const draft={code:finalCode,name:finalName,qty,qtyOrdered:qtyOrd,cost,invoice,grnNo,branch,date:recvDate,totalQty:qty,totalCost:qty*cost,po:'',supplier:'Main Supplier',status:'Draft'};
grns.unshift(draft);saveAll();logAudit('Save Draft GRN '+grnNo+' - No Stock Increase (Draft)');alert('Draft Saved - Stock NOT increased (as per spec) - GRN '+grnNo);renderModule('grn');
}
function editDraftGRN(){const grnNo=prompt('Edit Draft - Enter GRN Number (e.g. GRN-000125):');if(!grnNo)return;const idx=grns.findIndex(g=>(g.grnNo||'')===grnNo.toUpperCase());if(idx<0){alert('GRN not found');return;}const g=grns[idx];if(g.status!=='Draft'){alert('Only drafts can be edited - This GRN is '+g.status);return;}document.getElementById('grnForm').classList.remove('hidden');document.getElementById('grn_code').value=g.code;document.getElementById('grn_qty').value=g.qty;document.getElementById('grn_qtyOrdered').value=g.qtyOrdered||g.qty;document.getElementById('grn_cost').value=g.cost;document.getElementById('grn_invoice').value=g.invoice||'';document.getElementById('grn_grnNo').value=g.grnNo;grns.splice(idx,1);saveAll();logAudit('Edit Draft GRN '+grnNo);}
function postGRN(){
const code=document.getElementById('grn_code').value;const qty=parseInt(document.getElementById('grn_qty').value)||0;const qtyOrd=parseInt(document.getElementById('grn_qtyOrdered').value)||qty;const cost=parseFloat(document.getElementById('grn_cost').value)||0;const invoice=document.getElementById('grn_invoice').value||'';const grnNo=document.getElementById('grn_grnNo').value||'GRN-'+String(grns.length+125).padStart(6,'0');const branch=document.getElementById('grn_branch').value||'SHOP001-HRE';const recvDate=document.getElementById('grn_recvDate').value||new Date().toISOString();
let finalCode=code;let finalName='';
if(code==='NEW'){finalCode=document.getElementById('grn_new_code').value.trim().toUpperCase();finalName=document.getElementById('grn_new_name').value.trim();const price=parseFloat(document.getElementById('grn_new_price').value)||0;if(!finalCode||!finalName){alert('New Code and Name required');return;}if(products.find(p=>p.code===finalCode)){alert('Code exists');return;}const newProd={code:finalCode,name:finalName,cat:'General',cost,price:price||cost*1.5,stock:0,supplier:'',brand:'',uom:'Each',active:true};products.push(newProd);finalName=newProd.name;}else{const prod=products.find(p=>p.code===code);if(!prod){alert('Product not found');return;}finalName=prod.name;}
if(!finalCode||qty<=0){alert('Code and Qty Received required');return;}
const prod=products.find(p=>p.code===finalCode);
if(prod){prod.stock+=qty;if(cost>0)prod.cost=cost;}
const grnRecord={code:finalCode,name:finalName,qty,qtyOrdered:qtyOrd,cost,invoice,grnNo,branch,date:recvDate,totalQty:qty,totalCost:qty*cost,po:'',supplier:'Main Supplier',status:'Posted'};
grns.unshift(grnRecord);saveAll();logAudit('Post GRN '+grnNo+' Qty '+qty+' Updates Stock REAL - Branch '+branch);alert('GRN Posted - Stock Updated REAL - '+finalCode+' +'+qty+' new stock '+prod.stock+' Branch '+branch);renderModule('grn');
}

function renderStockTake(){return `<div class="card"><h2 class="font-black">📋 Stock Take - Stage 1 Basic</h2><div class="flex gap-1.5 mt-2"><input id="st_from" type="date" class="input w-[110px]"><input id="st_to" type="date" class="input w-[110px]"><button onclick="filterStockTake()" class="bg-blue-600 btn text-[9px]">Filter by Dates</button><button onclick="startStockTake()" class="bg-blue-600 btn text-[9px]">Start Stock Take</button></div><table class="w-full mt-3" id="stockTakeTable"><tr><th class="th">Date</th><th class="th">Code</th><th class="th">System</th><th class="th">Counted</th><th class="th">Variance</th></tr>${stockTakes.map(st=>`<tr class="row"><td class="td text-[10px]">${new Date(st.date).toLocaleDateString()}</td><td class="td font-mono">${st.code}</td><td class="td">${st.system}</td><td class="td">${st.counted}</td><td class="td ${st.variance<0?'text-red-400':'text-emerald-400'}">${st.variance}</td></tr>`).join('')||'<tr><td colspan=5 class="td text-center">No stock takes</td></tr>'}</table><div id="stockTakeForm" class="hidden mt-3 p-2 bg-[#020617] rounded-xl border border-slate-700"><select id="stk_code" class="input">${products.map(p=>`<option value="${p.code}">${p.code} - ${p.name} - Sys ${p.stock}</option>`).join('')}</select><input id="stk_counted" type="number" class="input mt-1" placeholder="Counted Qty"><button onclick="saveStockTake()" class="bg-emerald-600 btn mt-1 text-[9px]">Save Count - Calculate Variance</button></div></div>`;}
